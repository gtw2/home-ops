---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
review:
  # A review with nothing blocking or important approves, so a clean PR
  # shows up as approved; a later review that finds something withdraws it.
  approve: true
skills:
  scope:
    # Offered only to Renovate PRs, so other reviews don't spend the local
    # model's single slot reading it.
    renovate-review:
      when: [{ expr: pr.headRef.startsWith("renovate/") }]
# Since kritika 0.0.61 AGENTS.md is no longer loaded automatically. What a
# review must enforce is restated here, because rules are read from the merge
# base and a pull request cannot rewrite them; AGENTS.md is offered as
# context (read from the head) for the layout only.
rules:
  - id: sops-secrets
    rule: >-
      Secrets come from 1Password through ExternalSecrets. Files matching
      *.sops.yaml are SOPS-encrypted: never ask to decrypt, print or edit
      them, and flag a literal secret committed to a manifest.
  - id: flux-secret-substitution
    rule: >-
      ${SECRET_*} values are substituted by Flux from the cluster-secrets
      Secret at apply time. They are not unexpanded variables or missing
      literals.
  - id: measured-comments
    rule: >-
      Comments in manifests record why a value was chosen, often from
      measurements (memory, slots, timeouts). Flag a change to such a value,
      or to the behaviour the comment relies on, that leaves the comment
      describing the old one.
  - id: pinned-images
    rule: Container images are pinned by tag and digest.
  - id: conventional-commits
    rule: >-
      Commits and PR titles follow Conventional Commits, such as
      fix(container): ... or chore(renovate): ...
# Tools the runners add to the -tools image's curl, find, gh, grep and jq.
# Read from the merge base like the rules, so a change here applies from the
# next PR on. No lock: kritika locks each tool against the release's API
# digest before installing it (0.0.87).
tools:
  "github:home-operations/flate":
    filter_bins: flate
    # renovate: datasource=github-releases depName=home-operations/flate
    version: "0.6.5"
  # 0.0.103 rebuilt the -tools image on Red Hat Hardened Images without fd,
  # rg and yq, which the renovate-review skill tells reviews to use. These
  # are the versions that image last shipped.
  # renovate: datasource=github-releases depName=sharkdp/fd
  fd: "10.5.0"
  # renovate: datasource=github-releases depName=BurntSushi/ripgrep
  rg: "15.2.0"
  # renovate: datasource=github-releases depName=mikefarah/yq
  yq: "4.54.1"
context:
  - path: AGENTS.md
    description: >-
      Repository layout: kubernetes/apps/<namespace>/<app> (ks.yaml and app/),
      kubernetes/components, kubernetes/flux, talos, docker/sentinel, Taskfiles
