# Remaining v1alpha1 cluster settings.
#
# As of Talos 1.14 talhelper emits the Kube*Config documents natively, and the
# v1alpha1 equivalents are mutually exclusive with them — apiServer,
# controllerManager, scheduler and proxy moved to ./kube-components.yaml.
# The fields below have no generated document yet, so they stay here.
cluster:
  allowSchedulingOnControlPlanes: true
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 10.10.40.0/24
