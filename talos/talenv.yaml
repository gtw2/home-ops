# renovate: datasource=docker depName=ghcr.io/siderolabs/installer-base
#
# NOTE: this deliberately lags the running cluster, which is on Talos v1.14.0.
# talhelper switches to the multi-document config format at talosVersion 1.14+,
# and its generated KubeEtcdEncryptionConfig names the secretbox key "key1" with
# no identity provider, while Talos derived "key2" + identity from the same
# secret via v1alpha1. Existing secrets are encrypted under key2, so the
# generated config makes kube-apiserver fail to decrypt them. The document is
# regenerated after patches are applied, so it cannot be overridden.
#
# Pinning to 1.13.10 keeps genconfig emitting the v1alpha1 format the nodes
# actually run. Talos 1.14 accepts it (validate warns only).
#
# WARNING: `task talos:upgrade-node` reads talosVersion from this file and would
# therefore target 1.13.10 — a downgrade. Use tuppr (talosupgrade.yaml, v1.14.0)
# for Talos upgrades until this is unpinned.
talosVersion: v1.13.10
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.4
