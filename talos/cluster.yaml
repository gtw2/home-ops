---
# Cluster-wide values for machineconfig.yaml.j2.
# Per-node values live in ./nodes/<hostname>.yaml; secrets come from
# talsecret.sops.yaml at render time and are never written to disk.

clusterName: kubernetes
endpoint: https://10.10.40.20:6443
vip: 10.10.40.20

# renovate: datasource=docker depName=ghcr.io/siderolabs/installer-base
talosVersion: v1.14.5
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.2

# Image Factory schematics, selected per node by `profile` in nodes/<node>.yaml.
# Kernel cmdline args live in the schematic, NOT in machineconfig — changing one
# mints a new id and needs a Talos upgrade to take effect.
#
# The definition behind an id is not kept in this repo. Read it back with
#   curl https://factory.talos.dev/schematics/<id>
# The id is the sha256 of exactly that text, so an edited copy POSTed to
# https://factory.talos.dev/schematics returns the id to put here.
schematics:
  # Intel NUC-class nodes: i915, intel-ucode, mei, nfsrahead, nut-client,
  # thunderbolt.
  intel: eedc5a208f7758edf7df3fbdbe293c9300b9822f94de0cfe890f28ed884b91c7
  # AMD Strix Halo (Framework Desktop): amdgpu, amd-ucode, nfsrahead,
  # nut-client.
  # Kernel args reserve 124GiB of the 128GB unified memory for the iGPU
  # (amdgpu.gttsize=126976, ttm.pages_limit=32505856) with a 96GiB page pool,
  # plus amd_iommu=off / amd_pstate=active / pcie_aspm=off.
  #
  # nvme_core.default_ps_max_latency_us=0 disables NVMe APST. Talos defaults
  # this to 100000us - 4x the upstream kernel's 25000 - which lets a drive enter
  # its deepest power state. The Lexar NM790 (Maxio MAP1602) holding the model
  # cache does not reliably wake from those: on 2026-09-09 it timed out on an
  # admin Identify, failed controller reset (CSTS=0x0), and XFS shut the
  # filesystem down. A warm reboot did not recover it; only removing power did.
  # It is the idle drive that dies - weights are mmap'd once and then served
  # from page cache, so it can sit hours with no I/O, while the identical
  # sibling holding EPHEMERAL never idles and has never failed.
  amd-ai: a5a5e7ad335558510cd41aa5295262b8dfb9320a7869cf38a433fc17b2529c88

dnsDomain: cluster.local
podSubnets: ["10.42.0.0/16"]
serviceSubnets: ["10.43.0.0/16"]

nameserver: 10.10.40.1
gateway: 10.10.40.1
nodeSubnet: 10.10.40.0/24

certSANs: ["127.0.0.1", "10.10.40.20"]
apiServerExtraSANs: ["k8s.internal"]

# UPS the nut-client extension watches on every node, as <ups>@<server>, and
# the NUT user it logs in as. The password is `nutPassword` in nut.sops.yaml.
# See "UPS shutdown" in docs/talos.md.
#
# The server is tank's address on the node subnet, not tank.internal: a node
# deciding whether to shut down in a power cut should not depend on DNS, or on
# a router hop to reach it.
nutMonitor: ups-main@10.10.40.5
nutUser: talos
