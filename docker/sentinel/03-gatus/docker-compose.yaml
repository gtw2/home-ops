---
name: gatus

services:
  gatus:
    container_name: gatus
    # renovate: datasource=docker depName=ghcr.io/twin/gatus
    image: v5.37.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    env_file:
      - /opt/sentinel/env
    environment:
      GATUS_CONFIG_PATH: /config
      TZ: America/New_York
    volumes:
      - gatus-config:/config
      # Rendered by Ansible from 1Password - Pushover credentials and the
      # heartbeat token. Gatus merges every file under GATUS_CONFIG_PATH.
      - /opt/gatus/secrets.yaml:/config/secrets.yaml:ro
    configs:
      - source: gatus_config
        target: /config/config.yaml
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  gatus-config:

configs:
  gatus_config:
    file: ./config/config.yaml

networks:
  default:
    name: edge
    external: true
