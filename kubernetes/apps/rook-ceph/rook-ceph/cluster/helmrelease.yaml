---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.${SECRET_DOMAIN}
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Storage
          gethomepage.dev/name: Ceph
          gethomepage.dev/icon: ceph.png
          gethomepage.dev/description: Ceph storage dashboard
          gethomepage.dev/pod-selector: app=rook-ceph-mgr
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      security:
        cephx:
          daemon:
            # Rotate daemon (mon/mgr/osd/mds) keys to the secure aes256k
            # cipher introduced in Ceph 20.2 Tentacle. Clears the HEALTH_ERR
            # AUTH_INSECURE_SERVICE_KEY_TYPE.
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            # Rotate the four CSI client keys (rbd/cephfs, node/provisioner)
            # to the secure aes256k cipher for CVE-2025-30156.
            #
            # keyType MUST be set explicitly. The rook-ceph-cluster chart
            # defaults it to `aes` ("required when Kubernetes nodes don't run
            # Linux kernel 7.0+"), and that default overrides the mon map's
            # auth_preferred_cipher. Omitting it here does not fall back to
            # the preferred cipher — it silently re-applies aes, which is how
            # generation 2 ended up insecure. Talos 1.14 backported aes256k
            # to its 6.18 kernel, so the chart default's premise is not true
            # for this cluster.
            keyType: aes256k
            keyRotationPolicy: KeyGeneration
            # Generation 3 was the aes256k rotation (a generation bump is what
            # deterministically triggers one; the CRD only promises changing
            # keyType "may"). Deliberately NOT bumped further here:
            # keepPriorKeyCountMax acts on prior keys that already exist, so
            # dropping it to 0 retires generation 2 on its own; bumping the
            # generation would mint a generation 4 and immediately create a
            # fresh prior, defeating the point.
            keyGeneration: 3
            # Generation 3 (aes256k) is live and verified — RBD and CephFS
            # both provisioned, mounted and written. Dropping the retained
            # generation-2 aes keys is what actually clears
            # AUTH_INSECURE_CLIENT_KEY_TYPE.
            #
            # This also removes the fallback, which is the real test: a plugin
            # that cannot negotiate aes256k now fails visibly instead of
            # quietly continuing on the old key. Reversible — raising this
            # back re-creates a prior key, unlike allowedCiphers, which needs
            # a mon restart to undo.
            keepPriorKeyCountMax: 0
          rbdMirrorPeer:
            # Done: rotated to generation 2 / aes256k and no longer reported
            # by AUTH_INSECURE_CLIENT_KEY_TYPE. It has no chart default for
            # keyType, so it correctly picked up the mon map's
            # auth_preferred_cipher — which is what csi above could not.
            # No keepPriorKeyCountMax here; the CRD only offers it on csi.
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          # Final step of CVE-2025-30156: stop the mons accepting the
          # vulnerable aes cipher at all. Until this is set, the mon map
          # advertises auth_allowed_ciphers = [aes, aes256k] and the
          # authentication bypass remains reachable regardless of what key
          # types the clients happen to use.
          #
          # Safe to set now, and only now: all 17 auth entities (mon, mgr,
          # osd, mds, admin, exporter, crash, the four csi keys and
          # rbd-mirror-peer) are on aes256k, and `ceph health detail` reports
          # zero entities with insecure key types. Setting this while any
          # client still held an aes key would lock that client out.
          #
          # This is the one step in the sequence that is not cheaply
          # reversible. Recovery from a lockout is the
          # mon_auth_emergency_allowed_ciphers config, which is NOT
          # runtime-settable — it requires restarting the mons. Reverting
          # this file alone would not restore access.
          #
          # Expect the CephCluster to enter Progressing while the mons are
          # reconfigured, which fails Flux's health gate and briefly marks
          # dependent kustomizations not-ready. That is transient; judge it by
          # `ceph health`, not the Flux tree.
          allowedCiphers: [aes256k]
      healthCheck:
        muteHealthWarning:
          # All four CVE-2025-30156 warnings are resolved: every auth entity
          # is on aes256k and the mon map allows only aes256k.
          #
          # policy is flipped to unmute rather than the entries being deleted.
          # Ceph's mutes here are sticky, so removing the keys would only stop
          # Rook managing them — the warnings would stay suppressed in Ceph
          # indefinitely, hiding any future regression. Rook needs an explicit
          # unmute to clear them.
          #
          # Once `ceph health detail` shows no mute list, these entries can be
          # dropped entirely; at that point there is nothing left to unmute.
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: unmute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: unmute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: unmute
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: unmute
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        addressRanges:
          public:
            - 10.10.40.0/24
          cluster:
            - 10.10.40.0/24
        connections:
          requireMsgr2: true
      resources:
        mgr:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 2Gi
        osd:
          limits:
            memory: 8Gi
      storage:
        useAllNodes: true
        useAllDevices: false
        devicePathFilter: /dev/disk/by-id/nvme-SAMSUNG_MZQL21T9HCJR-.*
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores: []
