---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  interval: 1h
  values:
    drivers:
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        grpcTimeout: 150
        kernelMountOptions:
          ms_mode: prefer-crc
        # The Framework is dedicated by llm-workload=true:NoSchedule. Without
        # this the node plugin DaemonSet never lands there, so no Ceph volume
        # can be mounted on it - including llmkube's shared model cache, the
        # only RWX storage in the cluster. Tolerating a taint only permits
        # scheduling; nothing changes on the other nodes.
        nodePlugin:
          tolerations:
            - key: llm-workload
              operator: Exists
              effect: NoSchedule
        controllerPlugin:
          replicas: 2
      nfs:
        enabled: false
      nvmeof:
        enabled: false
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        grpcTimeout: 150
        # Same reasoning as cephfs above; RBD is what any future block PVC on
        # that node would use.
        nodePlugin:
          tolerations:
            - key: llm-workload
              operator: Exists
              effect: NoSchedule
        controllerPlugin:
          replicas: 2
