---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app icarus
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    replace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      icarus:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            nameOverride: *app
            image:
              repository: mornedhels/icarus-server
              tag: 1.0.0
              pullPolicy: IfNotPresent
            env:
                SERVER_PORT: &port 17777
                SERVER_QUERYPORT: &queryport 27015
                PUID: "4711"
                PGID: "4711"
                TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: icarus-secret
            resources:
              requests:
                memory: 8Gi
                cpu: 1000m
              limits:
                memory: 16Gi

    service:
      icarus:
        controller: *app
        type: LoadBalancer
        loadBalancerIP: 10.10.40.143
        annotations:
          warden.dev/enabled: "true"
          warden.dev/game: "icarus"
          warden.dev/query-port: "27015"       # A2S — confirmed answering, no EOS needed
          warden.dev/control: "true"
          warden.dev/channels: "steam-servers"
          # The game port on the LoadBalancer. Swap for a public hostname if
          # this ever gets a DNS record, as palworld has.
          warden.dev/address: "icarus.${SECRET_GAMING_DOMAIN}:17777"
          # Split horizon: unifi-dns answers the LAN with the LoadBalancer
          # address; cloudflare-dns has no service source, so the public
          # record keeps pointing at the towonel edge.
          external-dns.alpha.kubernetes.io/hostname: icarus.${SECRET_GAMING_DOMAIN}
          towonel.io/tunnel: enable
          towonel.io/tunnel-ref: network/home-ops
          towonel.io/icarus-game.udp: "true"
          towonel.io/icarus-game.public-port: "17777"
          towonel.io/icarus-query.udp: "true"
          towonel.io/icarus-query.public-port: "27015"
        ports:
          icarus-game:
            port: *port
            protocol: UDP
          icarus-query:
            port: *queryport
            protocol: UDP
    persistence:
      saves:
        existingClaim: *app
        advancedMounts:
          icarus:
            app:
              - path: /home/icarus/drive_c/icarus
                subPath: data
              - path: /opt/icarus
                subPath: game
