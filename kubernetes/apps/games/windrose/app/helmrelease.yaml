---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app windrose
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 4711
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      windrose:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mornedhels/windrose-server
              tag: 1.0.0-proton@sha256:374927da1083d6d524212eb3bf77d2f40a9ab4f89df02ee742ec48cde1d73299
            env:
              TZ: ${TIMEZONE}
              PUID: "4711"
              PGID: "4711"
              SERVER_NAME: Confetti-Cannon
              SERVER_MAX_PLAYER_COUNT: "8"
              SERVER_USE_DIRECT_CONNECTION: "true"
              SERVER_DIRECT_CONNECTION_SERVER_PORT: &gameport 7779
              SERVER_DIRECT_CONNECTION_PROXY_ADDRESS: "0.0.0.0"
            envFrom:
              - secretRef:
                  name: windrose-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 8Gi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: 10.10.40.149
          # Split horizon: unifi-dns answers the LAN with the LoadBalancer
          # address; cloudflare-dns has no service source, so the public
          # record keeps pointing at the towonel edge.
          external-dns.alpha.kubernetes.io/hostname: windrose.${SECRET_GAMING_DOMAIN}
          # Same port on both protocols is intentional - the service exposes
          # gameport/udp and gameport-tcp/tcp on 7779, and the edge binds them
          # as separate listeners.
          towonel.io/tunnel: enable
          towonel.io/tunnel-ref: network/home-ops
          towonel.io/gameport.udp: "true"
          towonel.io/gameport.public-port: "7779"
          towonel.io/gameport-tcp.tcp: "true"
          towonel.io/gameport-tcp.public-port: "7779"
        ports:
          gameport:
            enabled: true
            port: *gameport
            protocol: UDP
          gameport-tcp:
            enabled: true
            port: *gameport
            protocol: TCP
    persistence:
      data:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /opt/windrose
