# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft-limbo
spec:
  interval: 15m
  timeout: 5m
  maxHistory: 3
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      minecraft-limbo:
        # Always-on safety net for cold-start UX. Sized for ~128Mi heap — a few hundred
        # players idling in a NanoLimbo void is still well under the memory limit.
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # NanoLimbo reads settings.yml from its working directory, /data. We render
          # the real settings.yml — with the forwarding secret injected — via
          # ExternalSecret, mount it read-only at /config, and copy it into the
          # emptyDir-backed /data before the main container starts. Under
          # TYPE=NANOLIMBO (see the env below for why it is off) itzg also writes a
          # default only if the file is missing, then patches it in place, which
          # needs the copy to be writable.
          copy-settings:
            image:
              repository: public.ecr.aws/docker/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - "cp /config/settings.yml /data/settings.yml && chmod 644 /data/settings.yml"
        containers:
          app:
            image:
              repository: ghcr.io/itzg/minecraft-server
              tag: 2026.10.1@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
            tty: true
            probes:
              # NanoLimbo has no rcon/mc-health endpoint — TCP-probe the listener instead.
              readiness: &probes
                enabled: true
                type: TCP
                port: 25565
              liveness: *probes
              startup:
                <<: *probes
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            env:
              EULA: "true"
              TZ: "${TIMEZONE}"
              # TYPE=NANOLIMBO downloads the jar with mc-image-helper, which since
              # 2026-10-23 rejects github.com's responses: their headers (~10.7KB,
              # 9.2KB of it CSP) exceed its 10240-byte limit, and the emptyDir makes
              # every restart re-download (itzg/mc-image-helper#913). CUSTOM fetches
              # the same BoomEaro/NanoLimbo jar with curl instead. FAMILY=LIMBO is
              # what NANOLIMBO sets; the bind.port patch it would also apply is
              # already 25565 in settings.yml. Pinned by hand, so go back to
              # TYPE=NANOLIMBO once #913 is fixed.
              TYPE: CUSTOM
              FAMILY: LIMBO
              CUSTOM_SERVER: https://github.com/BoomEaro/NanoLimbo/releases/download/1.14.0/NanoLimbo.jar
              SERVER_PORT: "25565"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      minecraft:
        controller: *app
        type: ClusterIP
        ports:
          java:
            port: 25565
            protocol: TCP
    persistence:
      # NanoLimbo is stateless — no PVC. emptyDir is reset every restart, which is
      # fine because settings.yml is re-copied by the init container each time.
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      settings:
        type: secret
        name: minecraft-limbo-secret
        items:
          - key: settings.yml
            path: settings.yml
        advancedMounts:
          minecraft-limbo:
            copy-settings:
              - path: /config/settings.yml
                subPath: settings.yml
                readOnly: true
