---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minecraft-router
spec:
  interval: 15m
  timeout: 5m
  maxHistory: 3
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    serviceAccount:
      minecraft-router: {}
    rbac:
      roles:
        minecraft-router:
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["services"]
              verbs: ["get", "list", "watch"]
            # mc-router only knows how to scale StatefulSets; per upstream docs the
            # backend's metadata.name must equal its spec.serviceName for scale-up to fire.
            - apiGroups: ["apps"]
              resources: ["statefulsets", "statefulsets/scale"]
              verbs: ["get", "list", "watch", "update", "patch"]
            - apiGroups: [""]
              resources: ["endpoints", "pods"]
              verbs: ["get", "list", "watch"]
      bindings:
        minecraft-router:
          type: RoleBinding
          roleRef:
            identifier: minecraft-router
          subjects:
            - identifier: minecraft-router
    defaultPodOptions:
      # mc-router needs the SA token to talk to the Kubernetes API
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      mc-router:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: itzg/mc-router
              # renovate: datasource=docker depName=itzg/mc-router
              tag: 1.46.5
            args:
              - --in-kube-cluster
              - --kube-namespace=games
              - --api-binding=:25564
              # Anything that doesn't match an annotated Service falls through to Velocity
              - --default=minecraft-velocity.games.svc.cluster.local:25565
              # Scale-from-zero on StatefulSet when an annotated Service receives a connection
              - --auto-scale-up
              # Scale-to-zero after the connection drains + idle period
              - --auto-scale-down
              # Single global value (mc-router doesn't support per-service overrides).
              # 60m favors avoiding cold-start churn over pinning idle pods — first-connect
              # cold start is 60-120s of pod schedule + image pull + JVM start + mod load,
              # and creative pods sleep cheaply (replicas: 0 holds no compute). If creative
              # idle drift becomes a problem, drop back to 30m and document the trade-off
              # in the README. Tune in this one place.
              - --auto-scale-down-after=60m
              # MOTD shown to status pings while a backend is at replicas: 0. Without
              # this, mc-router does not respond at all and the server appears as
              # "Can't connect to server" in the client's list. With it set, players
              # see a friendly message and know to click connect to wake the backend.
              - --auto-scale-asleep-motd=Server is sleeping — connect to wake it up
            env:
              TZ: "${TIMEZONE}"
              # Temporary while diagnosing why players see "Network Protocol Error"
              # after the edge-LB refactor; revert once the cause is identified.
              DEBUG: "true"
            probes:
              readiness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /routes
                    port: 25564
                  periodSeconds: 30
              liveness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /routes
                    port: 25564
                  failureThreshold: 30
                  periodSeconds: 2
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
    service:
      # mc-router is the public TCP entrypoint. It reads the handshake hostname,
      # scales the matching backend StatefulSet from 0→1 if needed, then routes the
      # client to Velocity (via the proxyServerName annotation on each backend's
      # Service). Velocity then connects to the now-running backend directly, so
      # Velocity's modern player-info-forwarding handshake reaches the backend
      # intact (mc-router never sits between Velocity and the backend).
      app:
        controller: mc-router
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: 10.10.40.150
          io.cilium/lb-ipam-sharing-key: minecraft-frontend
          warden.dev/enabled: "true"
          warden.dev/game: "minecraft"
          warden.dev/display: "Minecraft"
          warden.dev/kind: "deployment"
          warden.dev/query-port: "25565"
          # No control button. mc-router is the entrypoint for every
          # Minecraft server, including vanilla's wake-on-connect, so
          # stopping it takes the whole stack unreachable while each
          # backend still reports itself as running. Status only.
          warden.dev/channels: "minecraft"
          warden.dev/address: "mc.${SECRET_GAMING_DOMAIN}"
          # Tunnelled at the router, not per-server: mc-router already fans out
          # to vanilla/creative/limbo by SNI hostname, so one tunnelled TCP port
          # covers every backend behind it. First TCP service on the tunnel -
          # everything before this was UDP.
          # Split horizon, and every hostname is listed rather than just mc.*.
          # The others CNAME to mc.* in public DNS, so a LAN override on mc.*
          # alone would not catch them - the upstream resolver would follow the
          # chain and hand back the edge address. Naming each one gives the LAN
          # a direct A record; mc-router still fans them out by SNI.
          # No spaces after the commas: external-dns splits this on "," and it
          # is not worth depending on whether it trims each element.
          external-dns.alpha.kubernetes.io/hostname: "mc.${SECRET_GAMING_DOMAIN},vanilla.${SECRET_GAMING_DOMAIN},vanilla-creative.${SECRET_GAMING_DOMAIN},create.${SECRET_GAMING_DOMAIN},create-creative.${SECRET_GAMING_DOMAIN}"
          towonel.io/tunnel: enable
          towonel.io/tunnel-ref: network/home-ops
          towonel.io/minecraft.tcp: "true"
          towonel.io/minecraft.public-port: "25565"
        ports:
          minecraft:
            port: 25565
            protocol: TCP
            targetPort: 25565
      # Admin API kept on its own ClusterIP service — no need to expose it externally.
      api:
        controller: mc-router
        type: ClusterIP
        ports:
          api:
            port: 25564
            protocol: TCP
            targetPort: 25564
