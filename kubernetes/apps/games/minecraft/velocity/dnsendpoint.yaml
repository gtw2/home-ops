---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: velocity
spec:
  endpoints:
    - dnsName: "mc.${SECRET_GAMING_DOMAIN}"
      recordType: CNAME
      # Every other minecraft hostname CNAMEs to mc.*, so repointing this one
      # record moves vanilla, vanilla-creative, create and create-creative too -
      # mc-router fans them back out by SNI behind the single tunnelled port.
      targets: ["towonel.${SECRET_DOMAIN}"]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: 'false'
    - dnsName: "_minecraft._tcp.mc.${SECRET_GAMING_DOMAIN}"
      recordType: SRV
      # The trailing dot is load-bearing. external-dns validates SRV targets
      # with NewSRVRecord(), which rejects any whose host does not end in a dot
      # - "priority weight port host." - and then SKIPS the endpoint with a
      # warning rather than failing. Without it these records silently did
      # nothing for months while looking correct in git.
      targets: ["0 5 25565 towonel.${SECRET_DOMAIN}."]
