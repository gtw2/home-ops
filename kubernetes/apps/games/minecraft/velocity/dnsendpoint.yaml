---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: velocity
spec:
  endpoints:
    - dnsName: "mc.${SECRET_GAMING_DOMAIN}"
      recordType: CNAME
      # Every other minecraft hostname CNAMEs to mc.*, so repointing this one
      # record moves vanilla, vanilla-creative, create and create-creative too -
      # mc-router fans them back out by SNI behind the single tunnelled port.
      targets: ["towonel.${SECRET_DOMAIN}"]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: 'false'
    # No _minecraft._tcp SRV record here, deliberately. Minecraft's SRV lookup
    # exists so a server can sit on a non-standard port; this one is on 25565,
    # the default, so every client connects from the CNAME alone. The SRV
    # entries that used to be here never existed as records and were never
    # missed - see the git history if that needs re-litigating.
