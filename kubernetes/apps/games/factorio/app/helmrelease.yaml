---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app factorio
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
    controllers:
      factorio:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: factoriotools/factorio
              tag: stable-2.0.69
            env:
              TZ: ${TIMEZONE}
              SAVE_NAME: confetti-cannon
              LOAD_LATEST_SAVE: false
              GENERATE_NEW_SAVE: true
              PRESET: rich-resources # default, rich-resources, marathon, death-world, rail-world, ribbon-world
              BIND: "0.0.0.0"
            resources:
              requests:
                cpu: 1000m
                memory: 9Gi
              limits:
                memory: 14Gi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: 10.10.40.146
          warden.dev/enabled: "true"
          # Factorio speaks no A2S; warden shows lifecycle from Kubernetes
          # with no player count. The 27015 queryport is unused by any protocol.
          warden.dev/game: "factorio"
          warden.dev/control: "true"
          warden.dev/channels: "steam-servers"
          # The game port on the LoadBalancer. Swap for a public hostname if
          # this ever gets a DNS record, as palworld has.
          warden.dev/address: "factorio.${SECRET_GAMING_DOMAIN}:34197"
          # Split horizon: unifi-dns answers the LAN with the LoadBalancer
          # address; cloudflare-dns has no service source, so the public
          # record keeps pointing at the towonel edge.
          external-dns.alpha.kubernetes.io/hostname: factorio.${SECRET_GAMING_DOMAIN}
          # Factorio resolves hostnames in Connect to address, so the name is
          # genuinely usable here rather than decorative.
          towonel.io/tunnel: enable
          towonel.io/tunnel-ref: network/home-ops
          towonel.io/factorio-game.udp: "true"
          towonel.io/factorio-game.public-port: "34197"
          towonel.io/factorio-query.tcp: "true"
          towonel.io/factorio-query.public-port: "27015"
        ports:
          factorio-game:
            enabled: true
            port: 34197
            protocol: UDP
          factorio-query:
            enabled: true
            port: 27015
            protocol: TCP

    persistence:
      config:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /factorio