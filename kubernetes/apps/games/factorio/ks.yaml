---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app factorio
  namespace: &namespace games
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  path: ./kubernetes/apps/games/factorio/app
  prune: true
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
      # The factorio image owns its data as 845 and the server writes a 0640
      # .lock while it is up, so a 1000 mover gets permission denied on it and
      # the whole snapshot fails. Only visible when the server is running - the
      # lock does not exist while it is stopped, which is why this surfaced the
      # first time factorio came back up rather than when backups were set up.
      KOPIUR_PUID: "845"
      KOPIUR_PGID: "845"

