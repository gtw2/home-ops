---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/externaldns.k8s.io/dnsendpoint_v1alpha1.json
# Points at the towonel edge; unifi-dns answers the same name on the LAN with
# the LoadBalancer address, so nobody at home is routed through the VPS.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: dragonwilds
spec:
  endpoints:
    - dnsName: "dragonwilds.${SECRET_GAMING_DOMAIN}"
      recordType: CNAME
      targets: ["towonel.${SECRET_DOMAIN}"]
      providerSpecific:
        # Never proxied: this is raw game traffic, and cloudflare-dns runs with
        # --cloudflare-proxied on by default.
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
