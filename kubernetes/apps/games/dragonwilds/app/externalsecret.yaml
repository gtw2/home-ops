---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonwilds
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dragonwilds-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # 32 hex chars from the in-game Settings menu (EOS ID). The server
        # refuses to start without it.
        RSDW_OWNER_ID: "{{ .OWNER_ID }}"
        RSDW_ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        # Leave the 1Password field empty for an open world.
        RSDW_PASSWORD: "{{ .WORLD_PASSWORD }}"
  dataFrom:
    - extract:
        key: dragonwilds
