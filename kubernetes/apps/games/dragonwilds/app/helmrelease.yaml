---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dragonwilds
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        # The official image runs as steam (1000:1000) and owns its own paths.
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      dragonwilds:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Jagex's own image (github.com/runescape/rsdw-dedicated). It
            # templates DedicatedServer.ini from RSDW_* on every start and runs
            # SteamCMD app_update first, so a restart is an update.
            image:
              repository: ghcr.io/runescape/rsdw-dedicated
              tag: 2.0.1@sha256:e8b0a5f59eb03082f43e74f8fd6a9019ba8e37773fcde60e1fc7859eb24b9211
            env:
              TZ: ${TIMEZONE}
              # Defaults on purpose. Before upstream PR #17 the game ignored
              # -Port and always bound 7777/8888, and the public Worlds list
              # still advertises 7777 - any other number is asking for trouble.
              # The beacon (world create/edit) is game port + 1111.
              RSDW_PORT: &gameport 7777
              RSDW_BEACON_PORT: &beaconport 8888
              RSDW_SERVER_NAME: BustedRNG
              # Case-sensitive, max 16 chars; this is what players search for,
              # and the .sav filename under Saved/SaveGames.
              RSDW_WORLD_NAME: ConfettiCannon
              # Exit when Steam has a newer build and let Kubernetes restart
              # the container - SteamCMD updates on start.
              RSDW_AUTO_STOP_ON_UPDATE: "true"
            # RSDW_OWNER_ID, RSDW_ADMIN_PASSWORD and RSDW_PASSWORD. All three
            # must be set explicitly - the image randomises the passwords on
            # every start otherwise, and an empty RSDW_PASSWORD means no
            # password, not "unset".
            envFrom:
              - secretRef:
                  name: dragonwilds-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              # 2Gi + 1Gi per player, six players max.
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 8Gi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: 10.10.40.148
          warden.dev/enabled: "true"
          warden.dev/game: "dragonwilds"       # no query port exposed — Kubernetes-only state
          warden.dev/display: "RuneScape: Dragonwilds"   # else derived from the key, without the space
          warden.dev/control: "true"
          warden.dev/channels: "steam-servers"
          warden.dev/password-env: "JOIN_DRAGONWILDS"   # join password, spoilered on the panel
          # The towonel edge IP. There is deliberately no DNS name for this
          # server: the in-game Direct tab only accepts IP:port. Keep in sync
          # with network/towonel/dns if the VPS ever moves.
          warden.dev/address: "40.160.90.34:7777"
          # Remote players must use the in-game Direct tab with the edge
          # address. The Worlds list advertises whatever public IP the server
          # reports to EOS, which is the home WAN (egress does not go through
          # the tunnel), so joining from the list will fail with "connection
          # lost" for anyone outside the LAN.
          towonel.io/tunnel: enable
          towonel.io/tunnel-ref: network/home-ops
          towonel.io/dw-game.udp: "true"
          towonel.io/dw-game.public-port: "7777"
          towonel.io/dw-beacon.udp: "true"
          towonel.io/dw-beacon.public-port: "8888"
        ports:
          dw-game:
            enabled: true
            port: *gameport
            protocol: UDP
          dw-beacon:
            enabled: true
            port: *beaconport
            protocol: UDP
    persistence:
      data:
        enabled: true
        existingClaim: *app
        globalMounts:
          # subPath leaves the old andyaltsys /home/ubuntu/Steam tree at the
          # volume root untouched; nothing in it is worth keeping.
          - path: /home/steam/rsdw-dedicated
            subPath: rsdw-dedicated
