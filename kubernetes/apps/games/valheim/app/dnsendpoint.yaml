---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: valheim
spec:
  endpoints:
    - dnsName: "valheim.${SECRET_GAMING_DOMAIN}"
      recordType: CNAME
      # The towonel edge, not the WAN IP. This is the line that actually moves
      # remote players onto the tunnel - and the one to revert if it goes wrong;
      # ipv4.${SECRET_GAMING_DOMAIN} is still maintained by cloudflare-ddns, so
      # putting it back is a one-line change that takes effect in a minute.
      #
      # LAN clients never see this record: unifi-dns answers them from the
      # Service annotation in ./helmrelease.yaml instead.
      targets: ["towonel.${SECRET_DOMAIN}"]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
