---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app valheim
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    replace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      valheim:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            nameOverride: *app
            image:
              repository: docker.io/mbround18/valheim
              # renovate: datasource=docker depName=docker.io/mbround18/valheim
              tag: 3.8.0
            env:
              PUBLIC: 1
              TZ: "${TIMEZONE}"
              TYPE: "BepInEx"
              WORLD: "DeepNorth"
              # Native world modifiers, in place of DeathTweaks / Custom_Raids /
              # NoAFKRaids. Baked into the world on creation; an admin can
              # change them live with `setworldmodifier` from the F5 console.
              MODIFIERS: "deathpenalty=casual,raids=less"
              MODS: |
                Advize-PlantEasily-2.2.0
                Advize-PlantEverything-1.21.1
                Digitalroot-Eternal_Fire-1.0.19
                hex:Azumatt-AzuAutoStore-3.1.4
                hex:Azumatt-AzuContainerSizes-1.1.5
                hex:Azumatt-AzuCraftyBoxes-1.8.19
                hex:Azumatt-AzuExtendedPlayerInventory-2.4.14
                hex:Azumatt-Build_Camera_Custom_Hammers_Edition-1.3.1
                hex:Azumatt-Hooked-1.1.1
                hex:Azumatt-Unshamed-1.0.3
                hex:shudnal-ConfigurationManager-1.1.18
                hex:Smoothbrain-Groups-1.2.11
                hex:Smoothbrain-Guilds-1.1.14
                hex:Smoothbrain-Sailing-1.1.9
                hex:Smoothbrain-TargetPortal-1.2.6
                MSchmoecker-MultiUserChest-0.6.2
                TastyChickenLegs-TreesReborn-1.1.3
                ValheimModding-Jotunn-2.30.0
                hex:shudnal-ConditionalConfigSync-1.0.5
                hex:ValheimModding-JsonDotNET-13.0.4
                ValheimModding-YamlDotNet-16.3.1
              #   Numenos-InfinityTools-1.0.0
              HTTP_PORT: &port 80
            envFrom:
              - secretRef:
                  name: valheim-secret
            resources:
              requests:
                memory: 4Gi
                cpu: 200m
              limits:
                memory: 10Gi
    service:
      app:
        controller: *app
        type: LoadBalancer
        loadBalancerIP: 10.10.40.140
        annotations:
          warden.dev/enabled: "true"
          warden.dev/game: "valheim"
          warden.dev/query-port: "2457"        # steam2 / A2S
          warden.dev/control: "true"
          warden.dev/channels: "steam-servers"
          # The game port, as players type it into Join IP. 2456 is the game
          # port; 2457 above is the A2S query port and is not joinable.
          warden.dev/address: "valheim.${SECRET_GAMING_DOMAIN}:2456"
        ports:
          http:
            port: *port
          steam1:
            port: 2456
            protocol: UDP
          steam2:
            port: 2457
            protocol: UDP
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          valheim:
            app:
              - path: /home/steam/.config/unity3d/IronGate/Valheim/
                subPath: saves
              - path: /home/steam/valheim/
                subPath: server
              - path: /home/steam/backups/
                subPath: backups
