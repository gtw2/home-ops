---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app valheim
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    replace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      valheim:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            nameOverride: *app
            image:
              repository: docker.io/mbround18/valheim
              # renovate: datasource=docker depName=docker.io/mbround18/valheim
              tag: 3.8.0
            env:
              PUBLIC: 1
              TZ: "${TIMEZONE}"
              # BepInExPack_Valheim went 1.0-ready as 5.4.2350 on release day.
              # TYPE=BepInEx installs that pack itself, so it must never be
              # listed in MODS.
              TYPE: "BepInEx"
              # Fresh world for the 1.0 release; ConfettiCannon stays on disk
              # untouched. 1.0 content only generates at world creation.
              WORLD: "DeepNorth"
              # Native world modifiers, in place of DeathTweaks / Custom_Raids /
              # NoAFKRaids. Baked into the world on creation; an admin can
              # change them live with `setworldmodifier` from the F5 console.
              MODIFIERS: "deathpenalty=casual,raids=less"
              # Every entry below has a 1.0-era build, checked 2026-09-11.
              # `hex:` marks the ones whose Thunderstore copy is still pre-1.0;
              # Azumatt and Smoothbrain publish to Hexium first. Jotunn is a
              # dependency of Eternal_Fire, YamlDotNet of AzuCraftyBoxes.
              #
              # Mod strings only, nothing else: Odin splits MODS on whitespace
              # and has no notion of comments, so a trailing `# note` inside the
              # block becomes several more mods for it to fail to find - and a
              # failure aborts the whole run unless MODS_CONTINUE_ON_FAILURE.
              MODS: |
                Advize-PlantEasily-2.2.0
                Advize-PlantEverything-1.21.1
                Digitalroot-Eternal_Fire-1.0.19
                hex:Azumatt-AzuAutoStore-3.1.4
                hex:Azumatt-AzuContainerSizes-1.1.5
                hex:Azumatt-AzuCraftyBoxes-1.8.19
                hex:Azumatt-Build_Camera_Custom_Hammers_Edition-1.3.1
                hex:Smoothbrain-Sailing-1.1.9
                ValheimModding-Jotunn-2.30.0
                ValheimModding-YamlDotNet-16.3.1
              # Parked. Has a 1.0 build, but vanilla now covers it:
              #   ASharpPen-Custom_Raids-1.8.2                 MODIFIERS raids=
              #   hex:Azumatt-AzuExtendedPlayerInventory-2.4.14  Deeper/Wider Pockets
              #   Digitalroot-Better_Wisps-1.0.44
              # Parked. No 1.0 build yet, expect breakage:
              #   Azumatt-SleepSkip-1.3.0                      2026-02
              #   blacks7ar-OreMines-1.2.0                     2025-09
              #   Dumba-NoAFKRaids-2.0.0                       2026-01, raids= partly covers
              #   MSchmoecker-MultiUserChest-0.6.1             2025-02
              #   Numenos-InfinityTools-1.0.0                  2023-10, nobuildcost covers build cost only
              #   Pineapple-DeathTweaks-1.4.1                  2026-01, MODIFIERS deathpenalty= covers
              #   Smoothbrain-PackHorse-1.0.4                  2026-02
              #   TastyChickenLegs-TreesReborn-1.1.2           2026-07
              AUTO_UPDATE: 1
              AUTO_UPDATE_SCHEDULE: "0 8 * * *" # every day at 8am
              AUTO_UPDATE_PAUSE_WITH_PLAYERS: 1
              SCHEDULED_RESTART: 1
              SCHEDULED_RESTART_SCHEDULE: "0 9 * * *" # every day at 9am
              AUTO_BACKUP: 1
              AUTO_BACKUP_SCHEDULE: "0 */2 * * *"
              AUTO_BACKUP_REMOVE_OLD: 1
              AUTO_BACKUP_DAYS_TO_LIVE: 2
              AUTO_BACKUP_ON_UPDATE: 1
              AUTO_BACKUP_ON_SHUTDOWN: 1
              HTTP_PORT: &port 80
            envFrom:
              - secretRef:
                  name: valheim-secret
            resources:
              requests:
                memory: 4Gi
                cpu: 200m
              limits:
                memory: 10Gi
    service:
      app:
        controller: *app
        type: LoadBalancer
        loadBalancerIP: 10.10.40.140
        annotations:
          warden.dev/enabled: "true"
          warden.dev/game: "valheim"
          warden.dev/query-port: "2457"        # steam2 / A2S
          warden.dev/control: "true"
          warden.dev/channels: "steam-servers"
          # The game port on the LoadBalancer. Swap for a public hostname if
          # this ever gets a DNS record, as palworld has.
          warden.dev/address: "10.10.40.140:2456"
        ports:
          http:
            port: *port
          steam1:
            port: 2456
            protocol: UDP
          steam2:
            port: 2457
            protocol: UDP
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          valheim:
            app:
              - path: /home/steam/.config/unity3d/IronGate/Valheim/
                subPath: saves
              - path: /home/steam/valheim/
                subPath: server
              - path: /home/steam/backups/
                subPath: backups
