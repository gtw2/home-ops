---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app palworld
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      palworld:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/thijsvanloef/palworld-server-docker
              # renovate: datasource=docker depName=docker.io/thijsvanloef/palworld-server-docker
              tag: v2.6.0
            env:
              TZ: "${TIMEZONE}"
              PUID: 1000
              PGID: 1000
              PORT: &game_port 8211
              QUERY_PORT: &query_port 27016
              PLAYERS: 16
              MULTITHREADING: true
              COMMUNITY: false
              SERVER_NAME: "BustedRNG"
              SERVER_DESCRIPTION: "BustedRNG Palworld"
              UPDATE_ON_BOOT: true
              BACKUP_ENABLED: false
              # Offset off the hour so it never coincides with the top-of-hour VolSync snapshot
              AUTO_UPDATE_ENABLED: false
              AUTO_REBOOT_ENABLED: false
              RCON_ENABLED: true
              RCON_PORT: &rcon_port 25575
              # REST API (used by Discord GSM for status/players; auth = admin password)
              REST_API_ENABLED: true
              REST_API_PORT: &rest_api_port 8212
              # --- Game world settings (map to PalWorldSettings.ini) ---
              # Difficulty & progression
              DIFFICULTY: "None" # None | Casual | Normal | Hard
              EXP_RATE: "1.200000"
              PAL_CAPTURE_RATE: "1.000000"
              PAL_SPAWN_NUM_RATE: "1.000000"
              PAL_EGG_DEFAULT_HATCHING_TIME: "0.150000" # hours
              WORK_SPEED_RATE: "1.000000"
              DAYTIME_SPEEDRATE: "1.000000"
              NIGHTTIME_SPEEDRATE: "1.000000"
              # Combat / damage
              PAL_DAMAGE_RATE_ATTACK: "1.000000"
              PAL_DAMAGE_RATE_DEFENSE: "1.000000"
              PLAYER_DAMAGE_RATE_ATTACK: "1.000000"
              PLAYER_DAMAGE_RATE_DEFENSE: "1.000000"
              BUILD_OBJECT_HP_RATE: "1.000000"
              BUILD_OBJECT_DAMAGE_RATE: "1.000000"
              BUILD_OBJECT_DETERIORATION_DAMAGE_RATE: "0.000000"
              # Survival rates
              PLAYER_STOMACH_DECREASE_RATE: "0.500000"
              PLAYER_STAMINA_DECREASE_RATE: "0.500000"
              PLAYER_AUTO_HP_REGEN_RATE: "1.000000"
              PLAYER_AUTO_HP_REGEN_RATE_IN_SLEEP: "1.000000"
              PAL_STOMACH_DECREASE_RATE: "1.000000"
              PAL_STAMINA_DECREASE_RATE: "1.000000"
              PAL_AUTO_HP_REGEN_RATE: "1.000000"
              PAL_AUTO_HP_REGEN_RATE_IN_SLEEP: "1.000000"
              # Gathering & drops
              COLLECTION_DROP_RATE: "1.000000"
              COLLECTION_OBJECT_HP_RATE: "1.000000"
              COLLECTION_OBJECT_RESPAWN_SPEED_RATE: "1.000000"
              ENEMY_DROP_ITEM_RATE: "2.000000"
              ITEM_WEIGHT_RATE: "1.000000"
              EQUIPMENT_DURABILITY_DAMAGE_RATE: "1.000000"
              DROP_ITEM_MAX_NUM: 3000
              DROP_ITEM_ALIVE_MAX_HOURS: "1.000000"
              # Death penalty & PvP
              DEATH_PENALTY: "None" # None | Item | ItemAndEquipment | All
              ENABLE_PLAYER_TO_PLAYER_DAMAGE: false
              ENABLE_FRIENDLY_FIRE: false
              IS_PVP: false
              HARDCORE: false
              PAL_LOST: false
              CAN_PICKUP_OTHER_GUILD_DEATH_PENALTY_DROP: false
              # World / base camp
              ENABLE_INVADER_ENEMY: false
              ENABLE_PREDATOR_BOSS_PAL: true
              BASE_CAMP_MAX_NUM: 128
              BASE_CAMP_WORKER_MAX_NUM: 25
              BASE_CAMP_MAX_NUM_IN_GUILD: 10
              BUILD_AREA_LIMIT: false
              MAX_BUILDING_LIMIT_NUM: 0 # 0 = unlimited
              SUPPLY_DROP_SPAN: 180
              # Guild
              GUILD_PLAYER_MAX_NUM: 20
              AUTO_RESET_GUILD_NO_ONLINE_PLAYERS: false
              AUTO_RESET_GUILD_TIME_NO_ONLINE_PLAYERS: "72.000000"
              ENABLE_DEFENSE_OTHER_GUILD_PLAYER: false
              # Quality of life
              ENABLE_FAST_TRAVEL: true
              IS_START_LOCATION_SELECT_BY_MAP: true
              EXIST_PLAYER_AFTER_LOGOUT: false
              ENABLE_NON_LOGIN_PENALTY: true
              ENABLE_AIM_ASSIST_PAD: true
              ENABLE_AIM_ASSIST_KEYBOARD: false
              SHOW_PLAYER_LIST: false
              CHAT_POST_LIMIT_PER_MINUTE: 30
              CROSSPLAY_PLATFORMS: "(Steam,Xbox,PS5,Mac)"
              ALLOW_CLIENT_MOD: true
              # Persistence
              AUTO_SAVE_SPAN: "30.000000"
            envFrom:
              - secretRef:
                  name: palworld-secret
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 1000m
                memory: 8Gi
              limits:
                memory: 16Gi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: 10.10.40.142
        ports:
          gameport:
            enabled: true
            port: *game_port
            protocol: UDP
          queryport:
            enabled: true
            port: *query_port
            protocol: UDP
          restapi:
            enabled: true
            port: *rest_api_port
            protocol: TCP
    persistence:
      data:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /palworld
            readOnly: false
