---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: palworld
spec:
  endpoints:
    - dnsName: "palworld.${SECRET_GAMING_DOMAIN}"
      recordType: CNAME
      # The towonel edge. Revert to ipv4.${SECRET_GAMING_DOMAIN} to put players
      # straight back on the WAN IP - cloudflare-ddns still maintains it.
      targets: ["towonel.${SECRET_DOMAIN}"]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
