---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  maxHistory: 3
  # Outlasts the startup probe's 25m. RomM runs its migrations before it
  # listens, and upstream warns they can take 15-20 minutes on a large
  # library. On the default 5m the upgrade would fail and the cluster-wide
  # remediation would roll back with recreate, killing the migration and
  # starting the old version against a half-migrated database.
  timeout: 30m
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [3001]
        seccompProfile: { type: RuntimeDefault }
    controllers:
      romm:
        annotations:
          secret.reloader.stakater.com/reload: &secret romm-secret
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: *secret
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.4.1
            env:
              TZ: ${TIMEZONE}
              # Downloads need a logged-in session or credentials. With this
              # true, /api/roms/<id>/content answered anyone on the public
              # route, and the ids are sequential. If a handheld or other
              # client stops downloading after this, it was relying on that;
              # give it credentials, or reach RomM through envoy-internal.
              DISABLE_DOWNLOAD_ENDPOINT_AUTH: false
              DISABLE_USERPASS_LOGIN: false
              ENABLE_RESCAN_ON_FILESYSTEM_CHANGE: "true"
              ENABLE_SCHEDULED_CONVERT_IMAGES_TO_WEBP: "true"
              ENABLE_SCHEDULED_RESCAN: "true"
              ENABLE_SCHEDULED_RETROACHIEVEMENTS_PROGRESS_SYNC: "true"
              ENABLE_SCHEDULED_UPDATE_LAUNCHBOX_METADATA: "true" #chron set to 5m by default
              ENABLE_SCHEDULED_UPDATE_MAME_XML: "false"
              ENABLE_SCHEDULED_UPDATE_SWITCH_TITLEDB: "false"
              HASHEOUS_API_ENABLED: true
              PLAYMATCH_API_ENABLED: true
              RESCAN_ON_FILESYSTEM_CHANGE_DELAY: 5
              SCHEDULED_RESCAN_CRON: "0 3 * * *"
              LAUNCHBOX_API_ENABLED: "true"
              ROMM_DB_DRIVER: postgresql
              # Chunked web uploads stage 10MiB parts under resources/tmp on the
              # 8Gi data PVC by default, and RomM only clears an abandoned one
              # after a fixed 24h. Four parallel uploads stalled at ~1.8GiB each
              # filled it on 2026-10-17. /tmp is the node-disk emptyDir (~500GB
              # free); the cache already defaults to /tmp/romm/cache, and
              # finished uploads assemble straight into the NFS library.
              ROMM_TMP_PATH: /tmp/romm
              REDIS_HOST: dragonfly.database.svc.cluster.local
              REDIS_PORT: 6379
              REDIS_DB: 4
              OIDC_ENABLED: true
              OIDC_CLAIM_ROLES: "groups"
              OIDC_ROLE_ADMIN: rommAdmin
              OIDC_ROLE_EDITOR: rommEditor
              OIDC_ROLE_VIEWER: rommViewer
              OIDC_PROVIDER: authentik
              OIDC_REDIRECT_URI: https://romm.${SECRET_DOMAIN}/api/oauth/openid
              OIDC_SERVER_APPLICATION_URL: https://sso.${SECRET_DOMAIN}/application/o/romm
            envFrom:
              - secretRef:
                  name: *secret
            probes:
              liveness: &probes
                enabled: true
              readiness: *probes
              # Port 8080 stays closed while `alembic upgrade head` runs, and a
              # restart re-runs the migration from the start. 300 x 5s = 25m
              # covers the 15-20 minutes upstream warns a migration can take.
              startup:
                enabled: true
                spec:
                  failureThreshold: 300
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 500Mi
              limits:
                memory: 2Gi
            # RomM unpacks and hashes uploaded files, so this is the container
            # an exploited parser would run in. It already runs as uid 1000
            # with no effective capabilities, and the image has no setuid,
            # setgid or file-capability binaries (checked in 5.4.1), so
            # neither setting below changes what RomM itself can do; they
            # take away what an attacker could regain. The root filesystem
            # stays writable: RomM's paths outside its volumes were not
            # mapped.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Rom emulator
          gethomepage.dev/group: Media
          gethomepage.dev/icon: sh-romm.png
          gethomepage.dev/name: Romm
          gethomepage.dev/weight: "35"
          gethomepage.dev/widget.type: romm
          gethomepage.dev/widget.url: http://romm.games:8080
    persistence:
      config:
        type: configMap
        name: romm-configmap
        globalMounts:
          - path: /romm/config/config.yml
            subPath: config.yml
            readOnly: true
      data:
        existingClaim: *app
        advancedMounts:
          romm:
            app:
              - path: /romm/assets
                subPath: assets
              - path: /romm/resources
                subPath: resources
      # Uploads stage their chunks under /tmp (ROMM_TMP_PATH) until the whole
      # file is assembled, and archives are unpacked here. Without a limit an
      # archive that unpacks to a huge size fills the node disk and gets other
      # pods on the node evicted; with one, only this pod is evicted. The
      # largest file in the library is 25.8GiB (2026-11-27), so 64Gi fits two
      # of those uploading at once.
      tmp:
        type: emptyDir
        sizeLimit: 64Gi
        advancedMounts:
          romm:
            app:
              - path: /romm/config
                subPath: config
              - path: /tmp
                subPath: tmp
      games:
        type: nfs
        server: tank.internal
        path: "/mnt/silo/media/games"
        advancedMounts:
          romm:
            app:
              - path: /romm/library
