---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrole_v1.json
#
# Permissions as the Fenrir fork's examples/installation grants them at
# 3f75c1aa, bound to the ServiceAccounts app-template creates
# (<release>-<identifier>).
#
# wolf-agent: a DRA driver. It publishes its lobby slots as ResourceSlices,
# writes each allocated lobby's id back into the claim, and follows Sessions to
# know which lobby a stream belongs to.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: games-on-whales-wolf-agent
rules:
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get, list, watch]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims/status]
    verbs: [patch, update]
  - apiGroups: [resource.k8s.io]
    resources: [deviceclasses]
    verbs: [get]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [sessions]
    verbs: [get, list, watch]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [sessions/status]
    verbs: [update, patch]
  # Its own node's address, which goes into the stream URL.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: games-on-whales-wolf-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: games-on-whales-wolf-agent
subjects:
  - kind: ServiceAccount
    name: games-on-whales-wolf-agent
    namespace: games
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrole_v1.json
#
# operator: Sessions to Lobbies, Lobbies to StatefulSets and lobby claims.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: games-on-whales-operator
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [sessions]
    verbs: [get, list, watch, update, patch, delete]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [sessions/status]
    verbs: [update, patch]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [lobbies]
    verbs: [get, list, watch]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [lobbies/status]
    verbs: [update, patch]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [apps, profiles]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [create, update, patch]
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [list]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: games-on-whales-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: games-on-whales-operator
subjects:
  - kind: ServiceAccount
    name: games-on-whales-operator
    namespace: games
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/role_v1.json
#
# moonlight-proxy: records Pairings, reads Profiles and Apps for the app list,
# and creates the Session and Lobby a launch asks for. Namespaced only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: games-on-whales-moonlight-proxy
rules:
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [pairings, profiles, apps, sessions]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [pairings]
    verbs: [create, patch]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [sessions]
    verbs: [create, delete, get]
  - apiGroups: [direwolf.games-on-whales.github.io]
    resources: [lobbies]
    verbs: [create, delete, get, list]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: games-on-whales-moonlight-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: games-on-whales-moonlight-proxy
subjects:
  - kind: ServiceAccount
    name: games-on-whales-moonlight-proxy
    namespace: games
