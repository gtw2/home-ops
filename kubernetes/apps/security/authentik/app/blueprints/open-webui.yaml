# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Open WebUI (chat.${SECRET_DOMAIN}): OIDC provider, application, and who may
# log in.
#
# Adopts the live objects. Every attribute below was compared with the live
# provider and application (inventory, 2026-10-22) and matches, so applying
# changes nothing about them. What does change is the bindings: until now
# there were none.
version: 1
metadata:
  name: open-webui
entries:
  # Groups this file binds, so it never waits on groups.yaml (see there).
  - model: authentik_core.group
    id: admins
    state: created
    identifiers:
      name: authentik Admins
  - model: authentik_core.group
    id: users
    state: created
    identifiers:
      name: authentik Users
  - model: authentik_core.group
    id: friends
    state: created
    identifiers:
      name: friends

  # Found by client_id, which 1Password already holds for open-webui's own
  # ExternalSecret. That adopts the live provider whatever it is named, and on
  # a rebuild recreates it with the same credentials, so open-webui needs no
  # change at all.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      client_id: !Env BLUEPRINT_OPEN_WEBUI_CLIENT_ID
    attrs:
      name: Open-WebUI OIDC
      client_type: confidential
      client_secret: !Env BLUEPRINT_OPEN_WEBUI_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Never change this on a live provider: it is how Open WebUI recognises
      # a returning user, and a new value makes every one of them a stranger.
      # hashed_user_id is also the default, so a rebuild gets the same.
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      redirect_uris:
        - matching_mode: strict
          url: https://chat.${SECRET_DOMAIN}/oauth/oidc/callback
      # profile carries the groups claim that OAUTH_ROLES_CLAIM reads.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  # The slug is the one in open-webui's OPENID_PROVIDER_URL.
  - model: authentik_core.application
    id: app
    identifiers:
      slug: open-web-ui
    attrs:
      name: Open-WebUI
      provider: !KeyOf provider
      meta_launch_url: https://chat.${SECRET_DOMAIN}
      policy_engine_mode: any

  # The household as everywhere else (access.yaml), plus friends. This is the
  # one application friends can reach. Keep the group list in step with
  # OAUTH_ALLOWED_ROLES in llm/open-webui/app/externalsecret.yaml, which
  # refuses anyone whose groups match none of it.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !KeyOf admins
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !KeyOf users
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !KeyOf friends
    attrs:
      order: 20
