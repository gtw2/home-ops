---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-secret
    template:
      data:
        # Authentik DBs
        AUTHENTIK_POSTGRESQL__HOST: &dbhost postgres17-rw.database.svc.cluster.local
        AUTHENTIK_POSTGRESQL__NAME: &dbname authentik
        AUTHENTIK_POSTGRESQL__USER: &dbuser "{{ .AUTHENTIK_POSTGRES_USER }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: &dbpass "{{ .AUTHENTIK_POSTGRES_PASS }}"
        AUTHENTIK_REDIS__DB: "1"
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"

        # Authentik SMTP
        AUTHENTIK_EMAIL__HOST: "{{ .SMTP_HOST }}"
        AUTHENTIK_EMAIL__PORT: "{{ .SMTP_PORT }}"
        AUTHENTIK_EMAIL__USERNAME: "{{ .SMTP_EMAIL }}"
        AUTHENTIK_EMAIL__PASSWORD: "{{ .SMTP_PASSWORD }}"
        # AUTHENTIK_EMAIL__USE_SSL: "true"
        AUTHENTIK_EMAIL__USE_TLS: "true"
        AUTHENTIK_EMAIL__FROM: "{{ .SMTP_SENDER }}"

        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # First-boot admin, read by the system bootstrap blueprint only while
        # akadmin does not exist, so on a running instance it does nothing.
        # On a rebuild it is what makes the instance usable without the
        # browser setup flow, and the token is what lets anything script
        # against the API. Add both fields to the 1Password authentik item
        # before uncommenting: a template key that is missing from the item
        # fails the whole Secret, and this Secret is authentik's database
        # credentials too.
        # AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .AUTHENTIK_BOOTSTRAP_PASSWORD }}"
        # AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .AUTHENTIK_BOOTSTRAP_TOKEN }}"
        # OIDC client credentials for blueprints/, read there with !Env. Taken
        # from each app's own 1Password item, the same fields its
        # ExternalSecret already uses, so the two sides cannot drift and a
        # rebuild recreates the providers with the credentials the apps hold.
        # No AUTHENTIK_ prefix: authentik reads those as its own config.
        BLUEPRINT_OPEN_WEBUI_CLIENT_ID: "{{ .OPEN_WEBUI_CLIENT_ID }}"
        BLUEPRINT_OPEN_WEBUI_CLIENT_SECRET: "{{ .OPEN_WEBUI_CLIENT_SECRET }}"
        BLUEPRINT_LITELLM_CLIENT_ID: "{{ .LITELLM_CLIENT_ID }}"
        BLUEPRINT_LITELLM_CLIENT_SECRET: "{{ .LITELLM_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: authentik
    - extract:
        key: cloudnative-pg
    - extract:
        key: smtp
    - extract:
        key: open-webui
    - extract:
        key: litellm
