# freshclam 1.5 configuration, mounted over the image's
# /etc/clamav/freshclam.conf. /init-unprivileged runs freshclam with
# --daemon --foreground --stdout and --checks from FRESHCLAM_CHECKS, so
# logging and the schedule are set there. DatabaseOwner is left out: it
# only applies when freshclam starts as root. Directives checked against
# etc/freshclam.conf.sample at clamav-1.5.5.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
LogTime yes

# Tells clamd to reload after an update, over the LocalSocket in clamd.conf.
NotifyClamd /etc/clamav/clamd.conf
