---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ocis
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      ocis:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 65542 # gladius:external-services

        initContainers:
          init-config:
            image:
              repository: docker.io/owncloud/ocis
              tag: 8.2.4@sha256:38ec001185622d3eeb94abc99cdee7dcee250beb086571751281f7447b21be6a
            command:
              - /bin/sh
              - -c
            args:
              - |
                if [ ! -f /etc/ocis/ocis.yaml ]; then
                  ocis init
                fi
                CERT=/var/lib/ocis/idm/ldap.crt
                KEY=/var/lib/ocis/idm/ldap.key
                if [ -f "$CERT" ] && ! openssl x509 -in "$CERT" -checkend 1209600 -noout; then
                  echo "idm ldap cert expires within 14d, removing so ocis regenerates it"
                  rm -f "$CERT" "$KEY"
                fi
            env:
              OCIS_INSECURE: true

        containers:
          ocis:
            image:
              repository: docker.io/owncloud/ocis
              tag: 8.2.4@sha256:38ec001185622d3eeb94abc99cdee7dcee250beb086571751281f7447b21be6a
            env:
              DEMO_USERS: false
              NOTIFICATIONS_SMTP_AUTHENTICATION: "auto"
              OCIS_ASYNC_UPLOADS: true
              OCIS_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "false"
              OCIS_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: "true"
              OCIS_INSECURE: true
              OCIS_LOG_COLOR: true
              OCIS_LOG_LEVEL: info
              OCIS_LOG_PRETTY: true
              OCIS_URL: https://cloud.${SECRET_DOMAIN}
              PROXY_DEBUG_ADDR: 0.0.0.0:9205
              PROXY_HTTP_ADDR: 0.0.0.0:9200
              PROXY_TLS: false
              PROXY_LOG_LEVEL: info
              # STORAGE_USERS_OCIS_ROOT: /data
              TZ: ${TIMEZONE}
              # Authelia OIDC
              # Auto role assignment:
              # docs: https://doc.owncloud.com/ocis/next/deployment/services/s-list/proxy.html#automatic-role-assignments
              OCIS_OIDC_ISSUER: https://sso.${SECRET_DOMAIN}/application/o/ocis-web/
              PROXY_AUTOPROVISION_ACCOUNTS: true
              PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: none
              PROXY_OIDC_REWRITE_WELLKNOWN: true
              PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
              PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: groups
              PROXY_USER_OIDC_CLAIM: "preferred_username"
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/ocis/csp.yaml
              WEB_OIDC_METADATA_URL: https://sso.${SECRET_DOMAIN}/application/o/ocis-web/.well-known/openid-configuration
              WEB_OIDC_SCOPE: "openid profile email groups"
              # Storage
              STORAGE_USERS_DRIVER: s3ng
              STORAGE_SYSTEM_DRIVER: ocis
              STORAGE_USERS_S3NG_ENDPOINT: http://garage.storage.svc.cluster.local:3900
              STORAGE_USERS_S3NG_REGION: us-east-1
              STORAGE_USERS_S3NG_BUCKET: ocis-data
              # Virus scanning. With async uploads (above) every upload passes
              # through postprocessing before anyone can see it or sync it;
              # virusscan adds a scan by clamav (storage/clamav) as a step.
              # ocis does not start the antivirus service by default, hence
              # OCIS_ADD_RUN_SERVICES. Behaviour read from the v8.2.4 source:
              # - infected: the file is deleted.
              # - scan error, e.g. clamav down: retried with backoff, 14
              #   times over about 22h, then the upload is aborted. Uploads
              #   wait for clamav; they are never released unscanned.
              # - larger than ANTIVIRUS_MAX_SCAN_SIZE: released unscanned.
              #   Kept under clamd's StreamMaxLength (1024M, clamd.conf),
              #   since a longer stream is an error and so ends in abort.
              # Only new uploads are scanned, not files already stored.
              OCIS_ADD_RUN_SERVICES: antivirus
              POSTPROCESSING_STEPS: virusscan
              ANTIVIRUS_SCANNER_TYPE: clamav
              ANTIVIRUS_CLAMAV_SOCKET: tcp://clamav.storage.svc.cluster.local:3310
              ANTIVIRUS_INFECTED_FILE_HANDLING: delete
              ANTIVIRUS_MAX_SCAN_SIZE: 1000MiB
              # Scans at once (default 10). Each one holds its stream, and
              # anything unpacked from it, in clamav's /tmp, sized for 2.
              ANTIVIRUS_WORKERS: "2"
            envFrom:
              - secretRef:
                  name: ocis-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1024Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: ocis
        ports:
          http:
            port: 9200
            primary: true
          metrics:
            port: 9205
    route:
      app:
        enabled: true
        hostnames: ["cloud.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: owncloud.svg
          gethomepage.dev/name: OwnCloud Infinite Scale
          gethomepage.dev/description: Cloud native file provider
          gethomepage.dev/group: Home
          gethomepage.dev/weight: "50"

    persistence:
      # storage-users:
      #   type: nfs
      #   server: ${SECRET_NFS_SERVER}
      #   path: /mnt/sega/cloud
      #   globalMounts:
      #     - path: /data
      #       subPath: storage-users
      config:
        type: configMap
        name: ocis-configmap
        globalMounts:
          - path: /etc/ocis/web.yaml
            subPath: web.yaml
            readOnly: true
          - path: /etc/ocis/proxy.yaml
            subPath: proxy.yaml
            readOnly: true
          - path: /etc/ocis/csp.yaml
            subPath: csp.yaml
            readOnly: true
      data:
        existingClaim: ocis
        globalMounts:
          - path: /var/lib/ocis
            subPath: data
          - path: /etc/ocis
            subPath: config
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
