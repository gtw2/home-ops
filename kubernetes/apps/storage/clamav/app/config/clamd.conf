# clamd 1.5 configuration, mounted over the image's /etc/clamav/clamd.conf.
# The image's own file logs to /var/log/clamav and sets User, which only
# works as root; this pod runs as the image's clamav user (uid 100) through
# /init-unprivileged. Directives checked against etc/clamd.conf.sample at
# clamav-1.5.5. Comments must sit on their own lines.

# /init-unprivileged waits for this socket before it reports clamd started.
LocalSocket /tmp/clamd.sock
# ocis connects here (ANTIVIRUS_CLAMAV_SOCKET).
TCPSocket 3310
Foreground yes

# Log to the container's stdout. Unlocked, since a pipe cannot be locked.
LogFile /dev/stdout
LogFileUnlock yes
LogTime yes

DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

# Size limits. ocis streams each file whole over INSTREAM, so StreamMaxLength
# caps what can be scanned at all: a longer stream is an error, and ocis
# retries an error for about 22h and then aborts the upload. ocis therefore
# skips files over ANTIVIRUS_MAX_SCAN_SIZE (1000MiB, set in the ocis
# HelmRelease), which must stay below this. MaxFileSize matches it, and
# MaxScanSize lets an archive unpack to twice that before scanning stops.
StreamMaxLength 1024M
MaxFileSize 1024M
MaxScanSize 2048M
