# Base ingress policy for dragonfly. dragonfly-operator v1.6.x generated an
# equivalent policy itself; v1.7.0 removed that feature, so it is owned here.
# Selecting the pods isolates them for ingress: 6379 is open within the
# database namespace, and the admin/metrics port 9999 to the operator and peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-base
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 6379
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          control-plane: controller-manager
    - podSelector:
        matchLabels:
          app: dragonfly
          app.kubernetes.io/name: dragonfly
          app.kubernetes.io/part-of: dragonfly
    ports:
    - port: 9999
      protocol: TCP
---
# Allow cross-namespace clients to reach dragonfly (port 6379).
# dragonfly-base restricts 6379 to the database namespace; NetworkPolicies
# are additive, so this policy opens it to the client pods.
#
# Named pods, not whole namespaces. Dragonfly has no password, so anything
# that can connect reads and writes every app's database in it. With whole
# namespaces that was every pod in games (the game servers and filebrowser
# too), llm, media, security and home-automation. Each entry below pairs a
# namespace with that app's pods (both must match). The list is what
# connected to 6379 in Cilium's conntrack on every node on 2026-11-27, which
# matches the REDIS settings in the manifests, except:
# - authentik: configured (authentik.redis.host) but 2026.8 no longer uses
#   Redis and no pod was connected. Kept, scoped to its pods, so a
#   surprise cannot take SSO down; drop it once that is confirmed.
# - home-automation: no client there, so dropped.
# A new client fails to connect until it gets an entry here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-allow-clients
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
  - Ingress
  ingress:
  - from:
    # REDIS_HOST
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: games
      podSelector:
        matchLabels:
          app.kubernetes.io/name: romm
    # REDIS_HOSTNAME. The server only: machine-learning does not use it.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: media
      podSelector:
        matchLabels:
          app.kubernetes.io/name: immich
          app.kubernetes.io/controller: server
    # litellm's proxy pods (not its operator), open-webui's websocket
    # manager, searxng's limiter, and toolhive's mcp-gateway
    # (virtualmcpserver).
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: llm
      podSelector:
        matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
              - litellm
              - open-webui
              - searxng
              - virtualmcpserver
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: security
      podSelector:
        matchLabels:
          app.kubernetes.io/name: authentik
    ports:
    - port: 6379
      protocol: TCP
---
# Allow Prometheus to scrape dragonfly metrics (port 9999).
# dragonfly-base restricts 9999 to the operator and peers; this adds Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-allow-metrics
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 9999
      protocol: TCP
---
# Keep dragonfly's daily call to version.dragonflydb.io inside the cluster: it
# sends threads, kernel, uptime, memory bucket, cloud or VM label, deployment
# environment and role (src/server/version_monitor.cc at v2.1.0). Why this is a
# policy and not --version_check=false is in cluster.yaml.
#
# Selecting the pods isolates them for egress, and the only thing they start
# themselves is replication: dragonfly-operator v1.7.1 hands replicas the
# master's pod IP, on 9999 as observed. DNS stays blocked too, so the hostname
# never resolves. A dragonfly snapshot to S3 or an FQDN replica would need a
# rule here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-egress
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: dragonfly
          app.kubernetes.io/name: dragonfly
          app.kubernetes.io/part-of: dragonfly
    ports:
    - port: 6379
      protocol: TCP
    - port: 9999
      protocol: TCP
