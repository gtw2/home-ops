# Base ingress policy for dragonfly. dragonfly-operator v1.6.x generated an
# equivalent policy itself; v1.7.0 removed that feature, so it is owned here.
# Selecting the pods isolates them for ingress: 6379 is open within the
# database namespace, and the admin/metrics port 9999 to the operator and peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-base
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 6379
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          control-plane: controller-manager
    - podSelector:
        matchLabels:
          app: dragonfly
          app.kubernetes.io/name: dragonfly
          app.kubernetes.io/part-of: dragonfly
    ports:
    - port: 9999
      protocol: TCP
---
# Allow cross-namespace clients to reach dragonfly (port 6379).
# dragonfly-base restricts 6379 to the database namespace; NetworkPolicies
# are additive, so this policy opens it to the consuming namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-allow-clients
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
              - games
              - home-automation
              - llm
              - media
              - security
    ports:
    - port: 6379
      protocol: TCP
---
# Allow Prometheus to scrape dragonfly metrics (port 9999).
# dragonfly-base restricts 9999 to the operator and peers; this adds Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-allow-metrics
  namespace: database
spec:
  podSelector:
    matchLabels:
      app: dragonfly
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 9999
      protocol: TCP
