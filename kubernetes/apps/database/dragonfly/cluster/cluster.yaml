---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.1.0@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
  replicas: 3
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --lock_on_hashtags
    - --default_lua_flags=allow-undeclared-keys
    # --version_check stays at its default on purpose. The daily call must not
    # leave the cluster, but from v2.1.0 the DSAL forbids disabling usage
    # monitoring tools (LICENSE.md 4(b)) while saying firewall filtering of
    # outbound traffic is not that (6). dragonfly-egress in networkpolicy.yaml
    # blocks it instead. Do not remove that policy without restoring a block.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: "kubernetes.io/hostname"
  #     whenUnsatisfiable: "DoNotSchedule"
  #     labelSelector:
  #       matchLabels:
  #         app.kubernetes.io/part-of: dragonfly
