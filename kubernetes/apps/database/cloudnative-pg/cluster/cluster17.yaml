---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
spec:
  instances: 3
  # CNPG Offical Image
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:23719505c7cc417b043ffd9998b44ab8d57fec1d92f0bf11b231a1754a5962f2
  primaryUpdateStrategy: unsupervised
  # Update a replica, then switch over to it, rather than restart the primary
  # in place. The in-place restart for 18.7 (2026-11-13) took the database
  # down for about 2.5 minutes. authentik-server crash-looped, while radarr
  # and sonarr failed their liveness probes, restarted into the outage and
  # hung until their 10-minute startup probes gave up. A switchover takes
  # seconds. It rejects an update that changes the image and the Postgres
  # parameters at once: apply them one at a time.
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      auto_explain.log_min_duration: '10s'
      max_connections: "300"
      max_wal_size: 512MB
      shared_buffers: 2048MB
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
    limits:
      memory: 4Gi
  monitoring:
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-garage
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: postgres-pg18-v1
  # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster
  bootstrap:
    recovery:
      source: postgres17-v3
  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: postgres17-v3
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: postgres-garage
          serverName: postgres17-v3
