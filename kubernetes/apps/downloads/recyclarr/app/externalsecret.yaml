---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: recyclarr
spec:
  # The server needs at least 32 characters.
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - RECYCLARR_API_KEY
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: recyclarr
spec:
  # Mints the server's API key once and stores it in 1Password, where the
  # ExternalSecret below reads it. IfNotExists keeps a later regeneration
  # from rotating it.
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: recyclarr
  data:
    - match:
        secretKey: &key RECYCLARR_API_KEY
        remoteRef:
          remoteKey: recyclarr
          property: *key
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: recyclarr-secret
    template:
      engineVersion: v2
      data:
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        RECYCLARR_API_KEY: "{{ .RECYCLARR_API_KEY }}"
  dataFrom:
    - extract:
        key: radarr
    - extract:
        key: sonarr
    - extract:
        key: recyclarr
