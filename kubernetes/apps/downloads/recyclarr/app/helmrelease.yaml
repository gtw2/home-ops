---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  values:
    # The chart uses its appVersion as a bare tag. This keeps the digest pin.
    # The repository is spelled out so Renovate can track the image, and it
    # groups chart and image in one PR (.renovate/groups.json5).
    image:
      repository: ghcr.io/recyclarr/recyclarr
      tag: 9.0.0@sha256:4973d11b18b5ef09fb226f4161eecb16434ff7e6b43c56d50fceb52fb22c66c7
    apiKey:
      existingSecret: recyclarr-secret
      existingSecretKey: RECYCLARR_API_KEY
    configs:
      existingConfigMap: recyclarr-configmap
    settings:
      content: |
        server:
          schedule:
            # The pod has no TZ, so this is 00:00 UTC, when the v8 CronJob ran.
            cron: 0 0 * * *
          logging:
            # Console output is collected. Files would only fill the data emptyDir.
            files: false
    # RADARR_API_KEY and SONARR_API_KEY for !env_var in recyclarr.yml. The
    # chart blanks RECYCLARR_API_KEY from here and reads the key as a file.
    envFrom:
      - secretRef:
          name: recyclarr-secret
    persistence:
      # The kopiur-backed claim that was v8's /config. On first start v9
      # moves v8's nested state/ folder up to the root
      # (FlattenNestedStateMigrationStep) and only warns about v8's other
      # files. Without this the TRaSH ID mappings would be lost.
      state:
        existingClaim: recyclarr
    deploymentAnnotations:
      # The server reads configs, settings and its key only at startup, and
      # the chart does not track a ConfigMap or Secret it does not own.
      reloader.stakater.com/auto: "true"
    serviceMonitor:
      enabled: true
    # Not yet measured here. The upstream chart measured one server syncing a
    # Sonarr and a Radarr at ~280Mi peak (~150Mi of it reclaimable file cache)
    # and suggests these values.
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 512Mi
