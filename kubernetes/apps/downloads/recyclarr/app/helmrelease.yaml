---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  values:
    controllers:
      recyclarr:
        # v9's image runs a server that syncs on its own schedule
        # (settings.yml), and its entrypoint exits 1 on CLI args such as
        # `sync`, so this is no longer a CronJob. Recreate because /config
        # is an RWO claim.
        strategy: Recreate
        annotations:
          # The server reads settings.yml and recyclarr.yml only at startup.
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 9.0.0@sha256:4973d11b18b5ef09fb226f4161eecb16434ff7e6b43c56d50fceb52fb22c66c7
            env:
              # Guide clones and logs, re-downloaded on each start. Sync state
              # and server.db stay in /config/state on the claim.
              RECYCLARR_DATA_DIR: /tmp
            envFrom:
              # RADARR_API_KEY, SONARR_API_KEY and the server's
              # RECYCLARR_API_KEY, without which it does not start.
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: &management 7983
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *management
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 3
              # The server clones the guide repos before it listens. The
              # upstream chart gives that 5min, as does this.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *management
                  periodSeconds: 2
                  timeoutSeconds: 1
                  failureThreshold: 150
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            # Not yet measured here. The upstream chart measured one server
            # syncing a Sonarr and a Radarr at ~280Mi peak (~150Mi of it
            # reclaimable file cache) and suggests these values.
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      config-file:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true
          - path: /config/settings.yml
            subPath: settings.yml
            readOnly: true
      tmp:
        type: emptyDir
