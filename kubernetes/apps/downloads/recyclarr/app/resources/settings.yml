---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v9.0.0/schemas/settings-schema.json
server:
  schedule:
    # The pod has no TZ, so this is 00:00 UTC: the time the v8 CronJob ran.
    cron: 0 0 * * *
  logging:
    # Console output goes to the cluster's log collection. Files would only
    # pile up in the /tmp emptyDir.
    files: false
