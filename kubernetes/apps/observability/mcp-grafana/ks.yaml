---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mcp-grafana
  namespace: &namespace observability
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # grafana-instance, not grafana-operator: the operator only supplies the
    # CRDs and controller. The GrafanaServiceAccount targets instanceName
    # "grafana", so that instance has to be reconciled before a token can be
    # minted against it.
    - name: grafana-instance
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/observability/mcp-grafana/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
