---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-grafana-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # Passed as an env var rather than --server-auth-token, on upstream's
        # own advice: a flag would put the token in the process arguments.
        MCP_GRAFANA_SERVER_TOKEN: "{{ .MCP_GRAFANA_SERVER_TOKEN }}"
  dataFrom:
    - extract:
        key: toolhive
