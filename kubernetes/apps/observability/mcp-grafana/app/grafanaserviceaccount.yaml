---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanaserviceaccount_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: mcp-grafana
spec:
  instanceName: grafana
  name: mcp-grafana
  # Viewer, deliberately. mcp-grafana can then read dashboards, datasources,
  # alert rules and query metrics/logs, but cannot create or edit anything.
  # This is the same posture as the read-only kubectl and flux MCP servers.
  role: Viewer
  tokens:
    # The operator already holds admin credentials for this instance, so it
    # mints the token itself and writes it here. Nothing new goes into
    # 1Password, and the credential never leaves the observability namespace -
    # which is why mcp-grafana runs here rather than in llm.
    - name: mcp-grafana
      secretName: mcp-grafana-token
