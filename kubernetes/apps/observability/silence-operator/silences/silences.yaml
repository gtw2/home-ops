---
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: ceph-node-nfsmount-diskspace-warning
spec:
  matchers:
    - name: alertname
      value: CephNodeDiskspaceWarning
    - name: mountpoint
      value: /etc/nfsmount.conf
---
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: ceph-node-local-diskspace-warning
spec:
  matchers:
    - name: alertname
      value: CephNodeDiskspaceWarning
    - name: device
      value: /dev/nvme.*
      matchType: "=~"
---
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: zeroscaler-hpa-maxed-out
spec:
  # Zeroscaler HPAs (kubernetes/components/zeroscaler) run minReplicas 0 /
  # maxReplicas 1, so at rest desired == max and KubeHpaMaxedOut always fires.
  # Keep this list in sync when adding the component to another app.
  matchers:
    - name: alertname
      value: KubeHpaMaxedOut
    - name: horizontalpodautoscaler
      value: (agregarr|garage|immich-server|kopia|plex|radarr|romm|sabnzbd|sonarr|zigbee)
      matchType: "=~"
