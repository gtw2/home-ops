---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: victoria-logs-collector
    image:
      registry: quay.io
      repository: victoriametrics/vlagent
      tag: v1.53.0@sha256:a82f93ffecc153fb068606903e512368b070272739d823abe99fad0eff6e1849
    remoteWrite:
      - url: http://victoria-logs.observability.svc.cluster.local:9428
    # Every node, whatever it is tainted with. Promtail tolerated only the
    # control-plane taints, so the Framework (llm-workload=true:NoSchedule)
    # never had a collector and nothing from llama-strix reached Loki.
    tolerations:
      - effect: NoSchedule
        operator: Exists
    # /var/log only. The chart also mounts the host's whole /var/lib
    # read-only, for runtimes whose log symlinks point there (Docker,
    # Minikube). On these nodes /var/log/containers links into /var/log/pods
    # (checked on talos-4, 2026-11-10), and /var/lib holds every pod's mounted
    # Secrets and tokens under kubelet/, plus etcd on the control planes.
    #
    # The chart still mounts /var/lib/vl-collector read-write on its own, for
    # the checkpoints and the send buffer (extraArgs.tmpDataPath).
    defaultVolumes:
      - name: varlog
        hostPath:
          path: /var/log
    defaultVolumeMounts:
      - name: varlog
        mountPath: /var/log
        readOnly: true
    # Root, because the kubelet's log files are root-only, but with nothing
    # else: the same three settings promtail ran with on these nodes while
    # reading /var/log/pods and writing its positions to a hostPath. The chart
    # sets none of them. vlagent writes only under tmpDataPath
    # (/var/lib/vl-collector: checkpoints and the send queue, v1.53.0
    # app/vlagent/main.go), so a read-only root filesystem costs it nothing.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    # Starting values, not measured: the promtail pods ran at 120-200Mi.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
    podMonitor:
      enabled: true
