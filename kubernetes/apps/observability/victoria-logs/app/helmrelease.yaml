---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    server:
      # Service victoria-logs:9428, which the collector and the Grafana
      # datasource (grafana-operator/instance/grafanadatasource.yaml) both name.
      fullnameOverride: victoria-logs
      image:
        # quay.io carries the same image as Docker Hub (same index digest for
        # v1.53.0), without Docker Hub's pull limits.
        registry: quay.io
        repository: victoriametrics/victoria-logs
        tag: v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
      # Same window Loki kept.
      retentionPeriod: 14d
      # GiB. The window above is by age only, so a burst of logs (a pod
      # crash-looping with a stack trace) could fill the 20Gi volume before
      # anything is 14 days old, and ingestion stops on a full volume. Past
      # this size the oldest per-day partitions are dropped instead.
      retentionDiskSpaceUsage: 15
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        # Loki's 14 days were 2.3GiB on disk (kubelet_volume_stats_used_bytes,
        # 2026-11-10) at ~420MB a day of raw lines from four nodes. The
        # Framework's logs are new with this collector, so that is a floor,
        # and VictoriaLogs' own on-disk size here has not been measured yet.
        size: 20Gi
      # The 1Gi this started with was OOM-killed within 8s of every start on
      # 2026-11-11: on first run each collector replays its node's existing
      # log files, up to 14 days of them, and the server buffers rows per CPU
      # (20 on talos-4, with no CPU limit) for each day's partition
      # (lib/logstorage/datadb.go, v1.53.0). 4Gi is headroom for that
      # backfill, not a measurement; lower it once the steady state is known.
      # Loki sat at 616Mi for the same stream.
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 4Gi
      serviceMonitor:
        enabled: true
