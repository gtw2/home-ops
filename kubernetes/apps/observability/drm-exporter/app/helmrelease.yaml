---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  interval: 15m
  values:
    # GPU access via DRA rather than a hostPath /dev/dri. The claim is an
    # admin-access monitor claim: read-only visibility of every GPU on the
    # node, allocated as All and NOT counted as consumed, so it cannot steal
    # the device from llama-strix, which holds its own framework-gpu claim.
    #
    # This requires the label resource.kubernetes.io/admin-access: "true" on
    # the observability Namespace - patched in ../../kustomization.yaml, since
    # the Namespace comes from components/common and is owned by the parent.
    dra:
      enabled: true
      deviceClassName: gpu.amd.com
      adminAccess: true
      allocationMode: All
    hostAccess:
      # Required even in DRA mode: frequency, memory, AMD engine and hwmon
      # (temp/fan/power) stats are all read from sysfs. The chart mounts it
      # read-only.
      sys: /sys
      # Deliberately empty. devDri is the hostPath alternative to DRA and is
      # cgroup-blocked for a non-privileged container anyway. devCpu is for
      # Intel iGPU package temperature via MSR, which needs the host msr
      # kernel module - Talos ships none, and it is unused on AMD.
      devDri: ""
      devCpu: ""
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
        # The chart defaults to adding PERFMON and SYS_RAWIO. Both are Intel
        # concerns - the perf PMU for i915/xe engine utilization, and MSR for
        # package temperature. The chart's own docs say AMD and every
        # sysfs-based stat need neither, and that SYS_RAWIO should be dropped
        # on Talos regardless. So: nothing added.
        add: []
    # node.kubernetes.io/gpu-vendor, NOT the reference's
    # topology.kubernetes.io/gpus. NodeRestriction only lets a kubelet
    # self-set labels from an allowlist, which permits
    # topology.kubernetes.io/{region,zone} and nothing else under that prefix.
    # Talos retries the patch forever, the label never appears, and a pod
    # selecting on it stays Pending (docs/talos.md).
    nodeSelector:
      node.kubernetes.io/gpu-vendor: amd
    tolerations:
      - key: llm-workload
        operator: Exists
        effect: NoSchedule
    # The Framework node has ~1.2GiB of allocatable memory left once
    # llama-strix's 26Gi request is taken, so this has to stay small.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    monitoring:
      serviceMonitor:
        enabled: true
        interval: 30s
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          allowCrossNamespaceImport: true
          folder: LLM
          # grafana.internal/instance, which is what this repo's Grafana
          # matches on. The reference repo uses "dashboards: grafana"; copied
          # verbatim that imports nothing, silently.
          matchLabels:
            grafana.internal/instance: grafana
