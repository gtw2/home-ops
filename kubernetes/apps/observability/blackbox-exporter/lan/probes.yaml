---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-icmp
spec:
  module: icmp
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        # - expanse.internal
        # - garage-door.internal
        # - hdhomerun.internal
        # - idrac.internal
        # - jetkvm-0.internal
        # - jetkvm-1.internal
        # - jetkvm-2.internal
        # - k8s-0.internal
        # - k8s-1.internal
        # - k8s-2.internal
        # - kiosk.internal
        # - receiver.internal
        # - ups.internal
        - nas.internal
        - tank.internal
        - unifi.internal
        # - zwave-controller.internal
        # NOTE: zigbee-controller.internal has its own Probe below (lan-zigbee) so it
        # carries a stable `job` label for the zeroscaler HPA. Keeping it here too
        # would duplicate the series.
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-nfs
spec:
  # `jobName` pins the `job` label on probe_success. The zeroscaler component
  # (kubernetes/components/zeroscaler) selects on it via the external metrics API.
  jobName: nfs_probe
  module: tcp_connect
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - tank.internal:2049
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-backup
spec:
  # `jobName` pins the `job` label on probe_success. The zeroscaler component
  # (kubernetes/components/zeroscaler) selects on it via the external metrics API.
  jobName: backup_probe
  module: tcp_connect
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - nas.internal:2049
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-zigbee
spec:
  jobName: zigbee_probe
  module: icmp
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - zigbee-controller.internal
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
