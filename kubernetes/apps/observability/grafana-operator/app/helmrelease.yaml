---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-operator
  interval: 1h
  values:
    # namespaceScope=false (chart default) makes the operator watch every
    # namespace, which the GrafanaDashboard CRs in flux-system, kube-system,
    # network, games, database and rook-ceph depend on.
    serviceMonitor:
      enabled: true
