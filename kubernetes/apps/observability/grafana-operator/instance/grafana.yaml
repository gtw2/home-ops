---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    # Every GrafanaDashboard / GrafanaDatasource in this repo selects on this
    grafana.internal/instance: grafana
spec:
  version: 12.3.1
  # Admin credentials come from grafana-secret below; the operator reads them
  # out of the deployment env (including secretKeyRef) to talk to the instance.
  disableDefaultAdminSecret: true
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      reporting_enabled: "false"
    auth:
      signout_redirect_url: https://sso.${SECRET_DOMAIN}/application/o/grafana/end-session/
      oauth_auto_login: "false"
      oauth_allow_insecure_email_lookup: "true"
    auth.anonymous:
      enabled: "true"
      org_id: "1"
      org_name: Main Org.
      org_role: Viewer
    auth.generic_oauth:
      name: authentik
      enabled: "true"
      scopes: openid email profile
      auth_url: https://sso.${SECRET_DOMAIN}/application/o/authorize/
      token_url: https://sso.${SECRET_DOMAIN}/application/o/token/
      api_url: https://sso.${SECRET_DOMAIN}/application/o/userinfo/
      # Optionally map user groups to Grafana roles
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
    news:
      news_feed_enabled: "false"
  deployment:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      strategy:
        type: RollingUpdate
      template:
        spec:
          initContainers:
            - name: init-db
              image: ghcr.io/home-operations/postgres-init:18.6
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: grafana-secret
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: admin-user
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secret
                      key: admin-password
                - name: GF_DATE_FORMATS_USE_BROWSER_LOCALE
                  value: "true"
                - name: GF_EXPLORE_ENABLED
                  value: "true"
                - name: GF_FEATURE_TOGGLES_ENABLE
                  value: publicDashboards
                - name: GF_INSTALL_PLUGINS
                  value: grafana-clock-panel,grafana-piechart-panel,grafana-worldmap-panel,natel-discrete-panel,pr0ps-trackmap-panel,vonage-status-panel
                - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
                  value: natel-discrete-panel,pr0ps-trackmap-panel,panodata-map-panel
                - name: GF_SECURITY_COOKIE_SAMESITE
                  value: ${APP}
                - name: GF_SERVER_ROOT_URL
                  value: https://grafana.${SECRET_DOMAIN}
              # GF_DATABASE_* (postgres17-rw) and GF_AUTH_GENERIC_OAUTH_CLIENT_*
              envFrom:
                - secretRef:
                    name: grafana-secret
              resources:
                requests:
                  cpu: 23m
                  memory: 128M
                limits:
                  memory: 512M
  httpRoute:
    metadata:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/icon: grafana.png
        gethomepage.dev/name: Grafana
        gethomepage.dev/group: Observability
    spec:
      hostnames: ["grafana.${SECRET_DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
