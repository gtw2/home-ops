---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-gateway-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    # Envoy's apiKeyAuth reads this Secret as client-name -> key. One entry per
    # consumer, so a key can be revoked without disturbing the others. Add a
    # field to the 1Password item and a line here to onboard another client.
    template:
      data:
        claude-code: "{{ .MCP_GATEWAY_API_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
