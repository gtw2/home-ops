---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-gateway
  annotations:
    # guarded:false overrides the envoy-internal Gateway, which sets
    # guarded:true for every route beneath it. Guarded replaces the HTTP probe
    # with a DNS query against 1.1.1.1, so the other internal routes are really
    # only checking that their hostname resolves - fine with the default
    # [CONNECTED] == true, but a [STATUS] assertion can never match it, and
    # gatus fails it as "udp///mcp.gwst.dev: unknown port".
    #
    # Overriding is justified here rather than stylistic: gatus can reach this
    # host in-cluster (verified: 401 with a valid cert), and DNS resolving says
    # nothing about whether the gateway, the route and the API-key policy work.
    # An unauthenticated 401 says all three do.
    gatus.home-operations.com/endpoint: |-
      guarded: false
      path: /mcp
      conditions: ["[STATUS] == 401"]
spec:
  hostnames:
    - mcp.${SECRET_DOMAIN}
  # envoy-internal, not envoy-external. This endpoint can read every non-secret
  # object in the cluster; it has no business being on the public gateway.
  # Promoting it later is a one-line parentRefs change - keep the SecurityPolicy
  # either way, since envoy-internal is still reachable from the whole LAN.
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: vmcp-mcp-gateway
          port: 4483
