---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-gateway
  annotations:
    # No custom conditions, matching every other route under envoy-internal.
    #
    # That Gateway sets guarded:true, which the sidecar implements by replacing
    # the HTTP probe with a DNS query against 1.1.1.1 - so an internal route's
    # gatus check only ever proves its hostname resolves. A [STATUS] assertion
    # cannot match that, and reported this endpoint down while the gateway was
    # healthy.
    #
    # Since gatus-sidecar 0.6.0 a child can opt out with guarded: false or null
    # (the string "false" still guards). This one stays guarded: an HTTP probe
    # carries no API key, so the SecurityPolicy would refuse it and [STATUS]
    # would fail for that, not for the gateway. Setting an explicit url while
    # guarded is worse still - gatus builds a DNS target out of an HTTPS URL:
    #   dial udp: lookup udp///mcp.${SECRET_DOMAIN}/mcp: unknown port
    #
    # So this check means "DNS resolves", nothing more. Real health for this
    # service is the VirtualMCPServer and MCPServer CR status, which report
    # backend-by-backend and are what actually caught every failure here.
    gatus.home-operations.com/endpoint: |-
      group: internal
spec:
  hostnames:
    - mcp.${SECRET_DOMAIN}
  # envoy-internal, not envoy-external. This endpoint can read every non-secret
  # object in the cluster; it has no business being on the public gateway.
  # Promoting it later is a one-line parentRefs change - keep the SecurityPolicy
  # either way, since envoy-internal is still reachable from the whole LAN.
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: vmcp-mcp-gateway
          port: 4483
