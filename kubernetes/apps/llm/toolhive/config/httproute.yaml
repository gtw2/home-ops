---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-gateway
  annotations:
    # url is explicit because the gatus sidecar only derives one for routes on
    # envoy-external; an envoy-internal route gets the placeholder 1.1.1.1.
    # That is invisible for the other internal routes here because they use the
    # default [CONNECTED] == true condition, which passes against anything - but
    # a STATUS assertion against Cloudflare can never match, so this endpoint
    # reported down while the gateway was perfectly healthy.
    #
    # Unauthenticated probes are the expected state: securitypolicy.yaml rejects
    # anything without a valid x-api-key, so 401 means the whole path is working
    # - envoy, the route, and the policy.
    gatus.home-operations.com/endpoint: |-
      url: https://mcp.${SECRET_DOMAIN}/mcp
      conditions: ["[STATUS] == 401"]
spec:
  hostnames:
    - mcp.${SECRET_DOMAIN}
  # envoy-internal, not envoy-external. This endpoint can read every non-secret
  # object in the cluster; it has no business being on the public gateway.
  # Promoting it later is a one-line parentRefs change - keep the SecurityPolicy
  # either way, since envoy-internal is still reachable from the whole LAN.
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: vmcp-mcp-gateway
          port: 4483
