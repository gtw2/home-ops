---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway
spec:
  groupRef:
    name: mcp-tools
  # Anonymous at the pod. Callers from inside the cluster (open-webui) reach the
  # Service directly and are trusted; callers from the LAN come through
  # envoy-internal, where securitypolicy.yaml enforces the x-api-key header.
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      # "openai" is a WIRE PROTOCOL, not a vendor: the enum is tei|openai, and
      # llama.cpp serves the OpenAI-shaped /v1/embeddings endpoint. Nothing
      # leaves the cluster and there is no OpenAI account involved.
      #
      # No OPENAI_API_KEY is set anywhere. Per the CRD, an empty key omits the
      # Authorization header, which is exactly what a keyless in-cluster
      # endpoint like llama-server wants. Pointing at toolhive-embed directly
      # rather than through litellm also drops a hop and a virtual key.
      embeddingProvider: openai
      embeddingModel: toolhive-embed
      embeddingService: http://toolhive-embed.llm.svc.cluster.local:8080/v1
      # 600s, not the reference's 180s. The corpus here outgrew that budget:
      # 423 tools across six backends measured at 138s, and adding memini as a
      # seventh took it to 504, which lands around 165s and tipped over - every
      # session then died with "build session optimizer ... context deadline
      # exceeded" after initialize hung for the full 181s.
      #
      # This is a per-request ceiling on one embedding call, not a latency
      # budget: the index is built once and cached, so sessions after the first
      # return in about a second regardless. Sized for room to add backends
      # rather than to just clear today's corpus.
      embeddingServiceTimeout: 600s
      # The knob that matters at 22 tok/s: how many tool definitions get spent
      # from the context budget on every turn. 8 is the CRD default.
      maxToolsToReturn: 8
  # The shared dragonfly runs --cluster_mode=emulated, where only db 0 exists,
  # so separation from litellm's keys is by prefix rather than by db index.
  # That instance has no auth configured, hence no passwordRef; the llm
  # namespace is already in its dragonfly-allow-clients NetworkPolicy.
  sessionStorage:
    provider: redis
    address: dragonfly.database.svc.cluster.local:6379
    db: 0
    keyPrefix: "toolhive:vmcp:"
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          # Declares the metrics port so Prometheus can discover it. The
          # process already listens on 8080 and answers /metrics with a 200,
          # but the operator's pod spec declares only containerPort 4483
          # ("http"), and kubernetes_sd only ever emits candidates for
          # DECLARED container ports. With 8080 undeclared, the PodMonitor
          # matched nothing whether it asked by name or by targetPort number -
          # Prometheus reported 0 active / 44 dropped, and the only port in
          # the discovered labels was 4483.
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
        # Keeps the optimizer's tool index warm. The index is built in memory
        # by the FIRST session after the pod starts, and at 513 tools that
        # build takes 3-4 minutes - so after every restart the first
        # open-webui attempts hung in initialize and failed with "Failed to
        # connect to MCP server 'mcp-gateway'" long before it finished.
        # Concurrent first sessions each build their own copy too, so retrying
        # made it slower (a second build overlapped the first and took 252s).
        #
        # There is no eager-build option on the CRD, so this opens a session
        # itself: once as soon as the pod is up, then every 5 minutes so an
        # index dropped by a backend change is rebuilt before a user needs it.
        # Against a warm index this is a ~0.5s round trip.
        #
        # busybox wget cannot send DELETE, so each probe leaves one idle
        # session behind for the gateway's session TTL to expire. The 660s
        # timeout clears the 600s embeddingServiceTimeout.
        - name: warmup
          image: public.ecr.aws/docker/library/busybox:1.38
          command:
            - sh
            - -c
            - |
              body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"warmup","version":"1"}}}'
              until wget -q -O /dev/null http://127.0.0.1:4483/readyz; do sleep 5; done
              while true; do
                start=$(date +%s)
                if wget -q -O /dev/null -T 660 \
                    --header 'Content-Type: application/json' \
                    --header 'Accept: application/json, text/event-stream' \
                    --post-data "$body" http://127.0.0.1:4483/mcp; then
                  echo "warm: initialize took $(( $(date +%s) - start ))s"
                else
                  echo "warm: initialize FAILED after $(( $(date +%s) - start ))s"
                fi
                sleep 300
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 16Mi
