---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: toolhive-embed
spec:
  # nomic-embed-text-v1.5: 137M parameters and an 8192-token context. Both
  # numbers matter, and picking on either alone gets this wrong.
  #
  # Qwen3-Embedding-0.6B (600M, 32768 ctx) was correct but far too slow -
  # measured at 0.22 docs/s on this hardware, so ~420 tool descriptions needed
  # roughly 32 minutes against a 180s timeout and every session failed.
  #
  # bge-small-en-v1.5 (33M, 512 ctx) was fast but wrong: the real corpus has a
  # long tail. Measured across all 423 tools - median 136 tokens, p95 1477,
  # max 5332 - fifty of them exceed 512. llama.cpp REJECTS an over-length
  # input rather than truncating it:
  #   input (702 tokens) is larger than the max context size (512 tokens)
  # and the gateway embeds the whole group in one request, so a single long
  # description fails the entire batch.
  #
  # 8192 covers the 5332-token worst case with room to spare, at 4.4x fewer
  # parameters than Qwen. f16 because the file is only ~262MiB.
  # Filename verified against the repo on 2026-09-09; a wrong name fails at
  # download time, not apply time.
  source: hf://nomic-ai/nomic-embed-text-v1.5-GGUF
  files:
    - nomic-embed-text-v1.5.f16.gguf
  format: gguf
  quantization: F16
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: toolhive-embed
  labels:
    krr/ignore: "true"
spec:
  modelRef: toolhive-embed
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:17155a3ce4cc906728ec99a2814bf0b4eaffaf3b4872bad8c3affed310cdbc35
  # Deliberately NOT overriding modelCache.claimName the way llama-strix does.
  # That override points at an RWO local claim on the Framework's NVMe; this
  # service must be readable from whichever talos node it lands on, and at
  # ~640MiB the operator's shared CephFS RWX cache is the right home for it.
  #
  # No toleration for llm-workload=true:NoSchedule either, so this stays off the
  # Framework entirely and leaves that node's GPU and memory to llama-strix.
  replicas: 1
  priority: normal
  mode: embedding
  # llama.cpp divides --ctx-size by --parallel to get the per-slot context, so
  # per-slot must clear the corpus's longest document (5332 tokens measured):
  # 8 slots * 8192 = 65536.
  #
  # Sized by arithmetic, not by taste. nomic is 12 layers, 12 heads, head-dim
  # 64, so KV is 2*12*12*64*65536*2 bytes = 2.25GiB - versus 4.5GiB at 16
  # slots, which is what the memory limit below could not have absorbed. The
  # same formula predicts 0.28GiB for the bge config that ran happily in 2Gi,
  # which is why it is trusted here.
  contextSize: 65536
  parallelSlots: 8
  flashAttention: true
  # An embedding request must fit in ONE physical batch - llama.cpp will not
  # split it - so uBatchSize has to clear the longest document in the corpus
  # (5332 tokens measured). At the previous 1024 anything longer failed with
  #   input (1502 tokens) is too large to process. increase the physical batch
  # regardless of which model was loaded, so this was broken under Qwen too and
  # was never the throughput problem it looked like.
  batchSize: 8192
  uBatchSize: 8192
  # Pin the OpenMP pool. Without this, threads migrate across the node's 20
  # cores and lose cache locality on every hop - measurably so: the previous
  # model managed 18.9 tok/s per slot while consuming 7.7 cores. llama.cpp
  # reads both of these; they are OpenMP/MKL variables and would do nothing
  # for a non-OpenMP runtime.
  env:
    - name: GOMP_CPU_AFFINITY
      value: "0-11"
    - name: KMP_AFFINITY
      value: "granularity=fine,proc_list=[0-11],explicit"
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 300
  # llmkube maps resources.memory to BOTH request and limit, so this is
  # actually reserved on a talos node, not a ceiling. Sized by the KV cache
  # above (2.25GiB) plus ~262MiB of weights plus compute buffers, with real
  # headroom - an earlier revision of this file OOMKilled by trusting a
  # tighter estimate.
  resources:
    cpu: "2"
    memory: 5Gi
  extraArgs:
    # nomic-embed is trained with mean pooling; llmkube emits "--pooling last"
    # ahead of extraArgs and llama.cpp takes the last occurrence, so this
    # overrides it. Worth verifying behaviourally rather than trusting the
    # flag - wrong pooling degrades every embedding silently instead of
    # failing.
    - --pooling
    - mean
    - --alias
    - toolhive-embed
    - --cont-batching
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 120
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
