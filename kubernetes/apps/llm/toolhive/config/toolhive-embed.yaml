---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: toolhive-embed
spec:
  # bge-small-en-v1.5, 33M parameters, not Qwen3-Embedding-0.6B's 600M.
  # Measured on this hardware, the 0.6B model embedded unique documents at
  # 0.22 docs/s - ~65 tok/s aggregate while burning 7.7 cores - so the MCP
  # group's ~420 tool descriptions needed roughly 32 minutes against the
  # gateway's 180s embeddingServiceTimeout. Every session failed. Trimming the
  # corpus could not close a 10x gap; a model 18x smaller can.
  #
  # f16 and not a quant: the whole file is ~67MiB, so there is nothing to save.
  # Filename verified against the repo on 2026-09-09; a wrong name fails at
  # download time, not apply time.
  source: hf://CompendiumLabs/bge-small-en-v1.5-gguf
  files:
    - bge-small-en-v1.5-f16.gguf
  format: gguf
  quantization: F16
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: toolhive-embed
  labels:
    krr/ignore: "true"
spec:
  modelRef: toolhive-embed
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:17155a3ce4cc906728ec99a2814bf0b4eaffaf3b4872bad8c3affed310cdbc35
  # Deliberately NOT overriding modelCache.claimName the way llama-strix does.
  # That override points at an RWO local claim on the Framework's NVMe; this
  # service must be readable from whichever talos node it lands on, and at
  # ~640MiB the operator's shared CephFS RWX cache is the right home for it.
  #
  # No toleration for llm-workload=true:NoSchedule either, so this stays off the
  # Framework entirely and leaves that node's GPU and memory to llama-strix.
  replicas: 1
  priority: normal
  mode: embedding
  # bge-small-en-v1.5 truncates at 512 tokens, so a slot never needs more than
  # that. 32 slots * 512 = 16384 for the --kv-unified shared cache. Tool
  # descriptions run a few hundred tokens; anything longer is truncated, which
  # costs a little match quality and nothing else.
  #
  # KV here is 12 layers * 12 heads * 32 head-dim * 16384 * 2 * 2 bytes
  # ~= 288MiB, against ~3.6GiB for the 0.6B model at 32768. That is why the
  # memory limit below drops from 6Gi to 2Gi.
  contextSize: 16384
  parallelSlots: 32
  flashAttention: true
  batchSize: 1024
  uBatchSize: 1024
  # Pin the OpenMP pool. Without this, threads migrate across the node's 20
  # cores and lose cache locality on every hop - measurably so: the previous
  # model managed 18.9 tok/s per slot while consuming 7.7 cores. llama.cpp
  # reads both of these; they are OpenMP/MKL variables and would do nothing
  # for a non-OpenMP runtime.
  env:
    - name: GOMP_CPU_AFFINITY
      value: "0-11"
    - name: KMP_AFFINITY
      value: "granularity=fine,proc_list=[0-11],explicit"
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 300
  # llmkube maps resources.memory to BOTH request and limit, so this is
  # actually reserved on a talos node, not a ceiling. Sized by the KV cache
  # above (~288MiB) plus ~67MiB of weights plus compute buffers.
  resources:
    cpu: "2"
    memory: 2Gi
  extraArgs:
    # BGE models are trained with CLS pooling; llmkube emits "--pooling last"
    # ahead of extraArgs, and llama.cpp takes the last occurrence, so this
    # overrides it. Verify in the server log that it reports cls - using last
    # here would quietly degrade every embedding rather than fail.
    - --pooling
    - cls
    - --alias
    - toolhive-embed
    - --cont-batching
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 120
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
