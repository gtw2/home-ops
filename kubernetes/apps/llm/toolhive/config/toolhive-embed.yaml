---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: toolhive-embed
spec:
  # Filename verified against the repo on 2026-09-09. The repo publishes exactly
  # two GGUFs (Q8_0 and f16); a wrong name here fails at download time, not at
  # apply time, so re-check if this sits unapplied for a while.
  source: hf://Qwen/Qwen3-Embedding-0.6B-GGUF
  files:
    - Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: toolhive-embed
  labels:
    krr/ignore: "true"
spec:
  modelRef: toolhive-embed
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:17155a3ce4cc906728ec99a2814bf0b4eaffaf3b4872bad8c3affed310cdbc35
  # Deliberately NOT overriding modelCache.claimName the way llama-strix does.
  # That override points at an RWO local claim on the Framework's NVMe; this
  # service must be readable from whichever talos node it lands on, and at
  # ~640MiB the operator's shared CephFS RWX cache is the right home for it.
  #
  # No toleration for llm-workload=true:NoSchedule either, so this stays off the
  # Framework entirely and leaves that node's GPU and memory to llama-strix.
  replicas: 1
  priority: normal
  mode: embedding
  # Sized for throughput, and the memory below is what that costs.
  #
  # llmkube passes contextSize through as --ctx-size, and with --kv-unified
  # that is the whole shared cache: 28 layers * 8 kv-heads * 128 head-dim *
  # 32768 * 2 * 2 bytes ~= 3.6GiB of KV. That OOMKilled this pod at a 4Gi
  # limit, and the fix taken then - dropping to 8192 ctx and 8 slots - solved
  # the crash by cutting embedding concurrency 4x. That was invisible at two
  # MCP backends and fatal at six: the optimizer embeds every tool description
  # in the group to build its index, and a starved embedder could not finish
  # ~420 tools inside the gateway's 180s embeddingServiceTimeout, so EVERY
  # session failed with "build session optimizer ... context deadline
  # exceeded" and was torn down.
  #
  # The right answer to a 3.6GiB KV cache is 6Gi of memory, not a smaller
  # cache. These are the numbers the upstream reference runs 11 backends on.
  contextSize: 32768
  parallelSlots: 32
  flashAttention: true
  batchSize: 1024
  uBatchSize: 1024
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 300
  # llmkube maps resources.memory to BOTH request and limit, so this is 6Gi
  # actually reserved on a talos node, not a ceiling. It is sized by the KV
  # cache above - do not lower it without lowering contextSize to match.
  resources:
    cpu: "2"
    memory: 6Gi
  extraArgs:
    - --alias
    - toolhive-embed
    - --cont-batching
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 120
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
