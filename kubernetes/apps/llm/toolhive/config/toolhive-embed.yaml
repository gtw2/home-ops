---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: toolhive-embed
spec:
  # Qwen3-Embedding-0.6B. Its 32768-token training context is the only one of
  # the candidates that covers the whole corpus: measured across all 423 tool
  # descriptions, median is 136 tokens, p95 is 1477 and max is 5332.
  #
  # Two smaller models were tried and rejected on context, not speed:
  #   bge-small-en-v1.5 (33M, 512 ctx)      - 50 of 423 tools too long
  #   nomic-embed-text-v1.5 (137M)          - GGUF declares n_ctx_train 2048,
  #     which llama.cpp clamps n_ctx_slot to regardless of --ctx-size, so 12
  #     tools were still rejected
  # llama.cpp REJECTS an over-length input rather than truncating it, and the
  # gateway embeds the whole group in one request, so any rejection fails the
  # entire batch.
  #
  # This model was previously blamed for being slow (0.22 docs/s). That number
  # came from a broken configuration - see the batch and slot sizing below -
  # and should not be cited without re-measuring.
  source: hf://Qwen/Qwen3-Embedding-0.6B-GGUF
  files:
    - Qwen3-Embedding-0.6B-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: toolhive-embed
  labels:
    krr/ignore: "true"
spec:
  modelRef: toolhive-embed
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:17155a3ce4cc906728ec99a2814bf0b4eaffaf3b4872bad8c3affed310cdbc35
  # Deliberately NOT overriding modelCache.claimName the way llama-strix does.
  # That override points at an RWO local claim on the Framework's NVMe; this
  # service must be readable from whichever talos node it lands on, and at
  # ~640MiB the operator's shared CephFS RWX cache is the right home for it.
  #
  # No toleration for llm-workload=true:NoSchedule either, so this stays off the
  # Framework entirely and leaves that node's GPU and memory to llama-strix.
  replicas: 1
  priority: normal
  mode: embedding
  # llama.cpp divides --ctx-size by --parallel to get the PER-SLOT context, and
  # per-slot is what an input is measured against. This is the trap the first
  # revision of this file fell into: 32768 with 32 slots looks generous and is
  # actually 1024 per slot, so every tool description over 1024 tokens - about
  # a third of the corpus - was rejected outright. Combined with uBatchSize
  # 1024 below, that is what made this model look hopeless.
  #
  # 4 slots * 8192 = 32768 clears the 5332-token worst case. Qwen is 28 layers,
  # 8 kv-heads, head-dim 128, so KV is 3.5GiB - the same formula predicts
  # 0.28GiB for a bge config that ran in 2Gi, so it is trusted.
  contextSize: 32768
  parallelSlots: 4
  flashAttention: true
  # An embedding request must fit in ONE physical batch - llama.cpp will not
  # split it - so uBatchSize has to clear the longest document in the corpus
  # (5332 tokens measured). At the previous 1024 anything longer failed with
  #   input (1502 tokens) is too large to process. increase the physical batch
  # regardless of which model was loaded, so this was broken under Qwen too and
  # was never the throughput problem it looked like.
  batchSize: 8192
  uBatchSize: 8192
  # Pin the OpenMP pool. Without this, threads migrate across the node's 20
  # cores and lose cache locality on every hop - measurably so: the previous
  # model managed 18.9 tok/s per slot while consuming 7.7 cores. llama.cpp
  # reads both of these; they are OpenMP/MKL variables and would do nothing
  # for a non-OpenMP runtime.
  env:
    - name: GOMP_CPU_AFFINITY
      value: "0-11"
    - name: KMP_AFFINITY
      value: "granularity=fine,proc_list=[0-11],explicit"
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 300
  # llmkube maps resources.memory to BOTH request and limit, so this is
  # actually reserved on a talos node, not a ceiling. Sized by the KV cache
  # above (3.5GiB) plus ~640MiB of weights plus the compute buffers an 8192
  # ubatch needs, with real headroom - an earlier revision of this file
  # OOMKilled by trusting a tighter estimate.
  resources:
    cpu: "2"
    memory: 8Gi
  extraArgs:
    # Qwen3-Embedding is trained with last-token pooling, which is what llmkube
    # emits by default for this mode - stated explicitly so a future model swap
    # has to think about it. Verify behaviourally, not from the flag: wrong
    # pooling degrades every embedding silently instead of failing.
    - --pooling
    - last
    - --alias
    - toolhive-embed
    - --cont-batching
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 120
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
