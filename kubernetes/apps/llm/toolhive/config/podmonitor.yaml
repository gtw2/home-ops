---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mcp-gateway
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
      app.kubernetes.io/instance: mcp-gateway
  namespaceSelector:
    matchNames:
      - llm
  podMetricsEndpoints:
    # targetPort, NOT port. PodMonitor's "port" takes the NAME of a port
    # declared in the pod spec, and the vmcp pod declares exactly one -
    # containerPort 4483, name "http". Nothing is named "8080", so `port:
    # "8080"` matched nothing and this PodMonitor produced zero targets while
    # looking perfectly healthy: `kubectl get podmonitor` showed it, and
    # Prometheus reported 0 active / 44 dropped for
    # podMonitor/llm/mcp-gateway/0. No metric named mcp* or vmcp* ever existed.
    #
    # The metrics were there the whole time - the pod answers /metrics on 8080
    # with a 200, it is just not a declared port. targetPort addresses it by
    # number and does not need one.
    - targetPort: 8080
      path: /metrics
      interval: 15s
