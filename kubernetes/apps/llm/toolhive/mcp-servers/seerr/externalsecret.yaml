---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-seerr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      # The upstream package reads OVERSEERR_API_KEY. The 1Password item is
      # named overseerr here, not seerr, even though the app deploys a Service
      # called seerr - the directory, the item and the Service disagree and all
      # three are correct in their own context.
      data:
        OVERSEERR_API_KEY: "{{ .OVERSEERR_API_KEY }}"
  dataFrom:
    - extract:
        key: overseerr
