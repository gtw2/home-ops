---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-grafana-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # The COMPLETE header value, not the bare token: headerForward injects
        # this verbatim, so the "Bearer " prefix has to be baked in here.
        #
        # Same 1Password field as the copy in observability - the secret is
        # namespaced, so it is pulled independently on both sides rather than
        # copied between them. Rotating means editing the one field and letting
        # both ExternalSecrets resync.
        Authorization: "Bearer {{ .MCP_GRAFANA_SERVER_TOKEN }}"
  dataFrom:
    - extract:
        key: toolhive
