---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # NEW field on the existing home-assistant item: a Home Assistant
        # long-lived access token. The item already carries HASS_LATITUDE,
        # HASS_ELEVATION and friends, but nothing that authenticates to the API.
        HOMEASSISTANT_TOKEN: "{{ .HOMEASSISTANT_TOKEN }}"
  dataFrom:
    - extract:
        key: home-assistant
