---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-mcp-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # The complete header value - headerForward injects it verbatim, so the
        # "Bearer " prefix is baked in here. Uses the open-webui client key, so
        # memories written through the gateway land in that namespace.
        Authorization: "Bearer {{ .OPEN_WEBUI_API_KEY }}"
  dataFrom:
    - extract:
        key: memini
