---
# One ExternalSecret per *arr, which looks redundant and is not. MCPServer's
# spec.secrets is a Kubernetes list-map keyed on "name" alone, so two entries
# naming the same Secret collide during apply:
#   .spec.secrets: duplicate entries for key [name="toolhive-arr"]
# One Secret can therefore supply exactly one environment variable, and three
# keys need three Secrets.
#
# All three source fields already exist in 1Password - the same ones the *arr
# apps and recyclarr read.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: sonarr
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
