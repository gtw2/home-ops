---
# One ExternalSecret per *arr, each extracting its own 1Password item - the
# same ones the *arr apps and recyclarr read. This began as a workaround:
# before toolhive 0.54.0 the MCPServer CRD keyed spec.secrets on "name" alone,
# so one Secret could supply only one variable. It is now keyed on (name, key)
# (stacklok/toolhive#6690), so a merged Secret would also work.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: sonarr
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
