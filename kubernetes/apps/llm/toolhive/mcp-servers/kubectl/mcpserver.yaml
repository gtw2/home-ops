---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubectl
spec:
  image: docker.io/rohitghumare64/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  serviceAccount: kubectl-mcp-readonly
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # Belt to the RBAC's braces. The ServiceAccount has no write verbs
            # at all, so a bypass of this flag still cannot mutate anything.
            - --read-only
            # 2.0.0 registers only core+helm unless told otherwise, and tools
            # outside the enabled toolsets do not exist at all. These add the
            # read tools for what this cluster runs: cert-manager and cilium,
            # plus the generic diagnostics/security/cost/crds sets. gitops is
            # left out because flux-mcp already covers Flux. Measured with
            # --read-only: 57 tools, against 275 from 1.24.0. An unknown name
            # stops startup.
            - --toolsets
            - default,diagnostics,security,cost,crds,certs,cilium
          env:
            # 2.0.0 exits 2 rather than bind a non-loopback address without
            # OAuth. 127.0.0.1 is not an option: the toolhive proxy is its own
            # pod. The server stays anonymous by design; access control is the
            # gateway's envoy x-api-key policy and the read-only ServiceAccount.
            - name: MCP_ALLOW_UNAUTHENTICATED
              value: "true"
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            - name: PYTHONUNBUFFERED
              value: "1"
  groupRef:
    name: mcp-tools
