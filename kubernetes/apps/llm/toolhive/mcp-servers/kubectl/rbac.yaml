---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubectl-mcp-readonly
---
# Broad read-only access, split across two ClusterRoles. Kubernetes Secrets
# (core v1) are excluded from both, as are exec/attach/proxy subresources.
#
# The split is mandatory, not stylistic: a ClusterRole carrying an
# aggregationRule has its rules field owned by the aggregation controller,
# which overwrites anything written alongside it. Both roles bind to the same
# ServiceAccount.
#
# - kubectl-mcp-readonly: aggregation only, same selector as the built-in "view"
#   role, so it grows automatically as operators ship aggregate-to-view roles.
# - kubectl-mcp-readonly-explicit: what the aggregation does not cover.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubectl-mcp-readonly
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubectl-mcp-readonly-explicit
rules:
  - nonResourceURLs:
      - /api
      - /api/*
      - /apis
      - /apis/*
      - /healthz
      - /livez
      - /openapi
      - /openapi/*
      - /readyz
      - /version
      - /version/
    verbs:
      - get
  # Core v1 - everything except secrets, and without exec/attach/proxy paths.
  - apiGroups:
      - ""
    resources:
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/status
      - nodes
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - pods
      - pods/log
      - pods/status
      - podtemplates
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - serviceaccounts
      - services
      - services/status
    verbs:
      - get
      - list
      - watch
  # Every non-core API group reported by this cluster on 2026-09-09, plus
  # toolhive.stacklok.dev, whose CRDs arrive with this same change. Generated
  # from `kubectl api-resources`, not copied from another cluster - resources
  # "*" is safe here because Secret objects only exist in the core group.
  # authentication.k8s.io and authorization.k8s.io are omitted: both are
  # create-only review APIs where read verbs grant nothing.
  - apiGroups:
      - acme.cert-manager.io
      - actions.github.com
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - autoscaling
      - barmancloud.cnpg.io
      - batch
      - ceph.rook.io
      - certificates.k8s.io
      - cert-manager.io
      - cilium.io
      - coordination.k8s.io
      - csi.ceph.io
      - discovery.k8s.io
      - dragonflydb.io
      - events.k8s.io
      - externaldns.k8s.io
      - external-secrets.io
      - federation.llmkube.dev
      - flowcontrol.apiserver.k8s.io
      - fluxcd.controlplane.io
      - gateway.envoyproxy.io
      - gateway.networking.k8s.io
      - gateway.networking.x-k8s.io
      - generators.external-secrets.io
      - grafana.integreatly.org
      - groupsnapshot.storage.k8s.io
      - helm.toolkit.fluxcd.io
      - inference.llmkube.dev
      - k8s.cni.cncf.io
      - kopiur.home-operations.com
      - kustomize.toolkit.fluxcd.io
      - litellm.home-operations.com
      - metrics.k8s.io
      - monitoring.coreos.com
      - monitoring.giantswarm.io
      - networking.k8s.io
      - node.k8s.io
      - notification.toolkit.fluxcd.io
      - objectbucket.io
      - observability.giantswarm.io
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - snapshot.storage.k8s.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - storagemigration.k8s.io
      - talos.dev
      - toolhive.stacklok.dev
      - tuppr.home-operations.com
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubectl-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: kubectl-mcp-readonly
    namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubectl-mcp-readonly-explicit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly-explicit
subjects:
  - kind: ServiceAccount
    name: kubectl-mcp-readonly
    namespace: llm
