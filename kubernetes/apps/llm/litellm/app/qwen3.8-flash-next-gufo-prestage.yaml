---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/job_v1.json
#
# Downloads the weights qwen3.8-flash-next-gufo.yaml serves. llmkube runs no
# model downloader for runtime: generic, so without this the gufo pod starts
# against files that are not there. Ported from the reference's
# flash-next-gufo-prestage (joryirving/home-ops#10478).
#
# Safe to run beside the live llama-strix pod: it writes new files into the
# cache claim, which is RWO but on one node, and touches nothing the live pod
# reads. ~104.5GiB onto nvme0n1p1, which had 3.5T free on 2026-10-14.
#
# Delete this file once the Job has completed and gufo has served from it, as
# the reference did (#10483). The files stay; this is only how they arrive.
apiVersion: batch/v1
kind: Job
metadata:
  name: flash-next-gufo-prestage
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        node.kubernetes.io/gpu-vendor: amd
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
      # 101:102 is curlimages' own user, and the owner of every file the
      # operator has already put in this cache.
      securityContext:
        runAsUser: 101
        runAsGroup: 102
        fsGroup: 102
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          # Same layout as the operator's downloader: files at their
          # repo-relative path under the cache key. A file already present is
          # skipped, so a retry resumes rather than restarts; *.tmp is a
          # download that did not finish.
          #
          # gufo-cache is the parent of gufo's --cache-disk directory. gufo
          # makes the directory itself and refuses one it does not own, so
          # only the parent is created here, setgid and group-writable.
          command:
            - sh
            - -c
            - |
              set -eu
              find "$CACHE_DIR" -name '*.tmp' -delete
              for rel in $MODEL_FILES; do
                dest="$CACHE_DIR/$rel"
                if [ -f "$dest" ]; then echo "cached: $rel"; continue; fi
                mkdir -p "$(dirname "$dest")"
                echo "downloading: $rel"
                curl -fL --retry 5 --retry-delay 10 -o "$dest.tmp" "$SOURCE/$rel"
                mv "$dest.tmp" "$dest"
              done
              mkdir -p /models/gufo-cache
              chmod 2775 /models/gufo-cache
          env:
            # sha256("hf://unsloth/Qwen3.8-Flash-Next-GGUF")[:16]. Already
            # holds the MTP head and the UD-Q3_K_XL shards.
            - name: CACHE_DIR
              value: /models/f869f01c859f8577
            - name: SOURCE
              value: https://huggingface.co/unsloth/Qwen3.8-Flash-Next-GGUF/resolve/main
            # Sizes checked against the HF API on 2026-10-14 (repo sha
            # 766911a6): 10.9MB, 49.9GB, 49.4GB, 12.1GB, 0.9GB.
            - name: MODEL_FILES
              value: >-
                UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
                UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00002-of-00004.gguf
                UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00003-of-00004.gguf
                UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00004-of-00004.gguf
                mmproj-BF16.gguf
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llmkube-framework-cache
