---
# Qwen3.8-Flash-Next, replacing Qwen3.6-35B-A3B on the Framework's iGPU.
#
# Deliberately keeps the name llama-strix: the LiteLLMModel, the virtual key and
# Open WebUI all address the service by that name, so swapping the weights under
# it leaves the whole downstream chain untouched. Rolling back is one line in
# kustomization.yaml, not a coordinated edit across four files.
#
# Why this model suits Strix Halo specifically:
#   - 512 experts, 10 active => ~2.4B active params/token, FEWER than the A3B it
#     replaces, so throughput should hold up despite ~121B of expert weights.
#   - Hybrid attention: only 12 of 48 layers are full attention (the rest are
#     linear, constant-state), so the KV cache at the full 262144 context is
#     ~3.0GiB at q8_0 rather than the tens of GiB a dense 48-layer model needs.
# Budget at UD-Q3_K_XL: 83.8 weights + 3.9 MTP + 0.84 mmproj + 3.0 KV = 91.5GiB
# of the 96GiB BIOS VRAM carve-out. In practice --lazy-mode keeps the ~51B
# per-layer embedding table on disk, so observed resident VRAM is ~56GiB.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix
spec:
  source: hf://unsloth/Qwen3.8-Flash-Next-GGUF
  # files[0] is the primary; the operator stages each entry at its repo-relative
  # path under the cache key sha256(spec.source)[:16] = f869f01c859f8577.
  files:
    - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
    - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00002-of-00003.gguf
    - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00003-of-00003.gguf
    - mmproj-F16.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q3_K_XL
  hardware:
    # ROCm on retest, reverting the Vulkan fallback. Both reasons that forced
    # Vulkan have moved since it was written:
    #
    #   - llama.cpp#27856 (decode collapse past ~1K on HIP) is CLOSED, fixed by
    #     #27466 "ROCm: add radix TOP_K for long rows" (f8dbcd6, 2026-08-31).
    #     Root cause was HIP's supports_op capping TOP_K/ARGSORT at ne[0]<=1024
    #     without CUB, so the QSA indexer's ggml_top_k fell back to CPU once per
    #     QSA layer per token - a GPU->CPU->GPU sync 12x per decode. That is the
    #     cliff, and the image below is 251 commits past the fix.
    #
    #   - llama.cpp#27797 (the '//////' garbage) is still open but is NOT this
    #     model's bug and not gfx1151's: two independent Strix Halo A/Bs
    #     (2026-08-31, 2026-09-05) pinned it to GGML_CUDA_ENABLE_UNIFIED_MEMORY,
    #     identical build and flags either way, and it reproduces on DeepSeek
    #     and Ling too (#25436). It is the cudaMallocManaged path.
    #
    # So: do NOT set GGML_CUDA_ENABLE_UNIFIED_MEMORY (or the GGML_HIP_ spelling
    # the reference config carries - upstream reads only the CUDA name,
    # ggml-cuda.cu:143 and :4989, so on a stock build that one is a no-op).
    # Nothing here sets either; this comment exists so nothing adds one.
    #
    # Everything else is deliberately unchanged from the Vulkan config so the
    # A/B is single-variable. Vulkan baseline to beat, measured 2026-09-14
    # against the live server, 64 tokens generated per depth:
    #
    #       depth |     pp t/s |  tg t/s
    #          34 |       29.6 |   25.90
    #        7210 |      396.7 |   23.54
    #       28810 |      371.3 |   21.81
    #
    # RESULT 2026-09-14: this does NOT load. The pod read 62.8GiB of the ~84GiB
    # of weights, then stopped reading entirely and spun one core at 100% in
    # userspace for 11+ minutes - read_bytes flat at 62825750528 across
    # repeated samples while utime climbed ~98.8 ticks/s, wchan 0, 37 threads,
    # no log line after "loading model" at 0.03s, no HTTP server (startup probe
    # 503 then timeouts). It does not crashloop, so the 2h startup budget just
    # holds it there; it has to be reverted by hand.
    #
    # That is the same signature this file already documents for the repack
    # hang, at nearly the same byte count (62.4GiB there) - but --no-repack is
    # set here, so on the HIP path something else is doing an equivalent
    # single-threaded host-side pass at the same point. First suspect is
    # --no-host: bypassing the host staging buffer costs nothing on Vulkan's
    # unified-memory view but may push HIP into a per-tensor host conversion.
    # Next variations to try, one at a time, each ~10min of downtime: drop
    # --no-host; then drop --lazy-mode; then f16 KV (which is what the
    # reference config had to do, and which costs ~3GiB against a 96GiB
    # carve-out already budgeted to 91.5).
    #
    # Reverting is this block plus the image line below.
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      runtime: rocm
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: framework-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-strix
  # Do NOT set skipModelInit here, despite the operator's MissingSkipModelInit
  # warning on every reconcile. Following that advice makes it pass --model ""
  # to llama-server, which then starts in router mode with zero models loaded,
  # answers /health, and goes Ready while serving nothing.
  modelCache:
    claimName: llmkube-framework-cache
  runtime: llamacpp
  # Not the rocm-6.4.4 tag this repo used elsewhere: that tag was last built
  # 2026-08-27, one llama.cpp build before the fix this model needs
  # (llama.cpp#28355, "51B N-gram embedding table not loaded after build
  # 10665"; ours was 10664), and it is no longer rebuilt, so no digest bump on
  # it could ever fix that.
  #
  # rocm-10.0, same publisher and the same nightly rebuild as the vulkan-radv
  # tag it replaces - see the accelerator note above for why ROCm is back.
  # Verified rather than assumed: this digest reports build 10971 / 96ffdc41c
  # (2026-09-14), which the compare API puts 251 commits ahead of f8dbcd6 and 0
  # behind, so it carries the #27466 TOP_K fix. Re-check that on any bump; a
  # digest older than 2026-08-31 reintroduces the cliff.
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-10.0@sha256:683bf50b2591ba2ae1e781a6bb59e0437f5a2ad4735e495c032750af10590379
  command:
    - llama-server
  rolloutPolicy:
    # On now that the model is up and serving. It was off during bring-up
    # because the idle check asks the CURRENT pod's /slots whether it is busy
    # and treats any failure as busy, so a crashlooping pod blocks the very
    # rollout that would fix it - and this model crashlooped through five
    # distinct failures getting here.
    #
    # idleTimeoutSeconds stays at 300, not the reference's 86400: the timeout
    # bounds how long a rollout waits for the current pod to go idle, so a
    # large value reintroduces exactly that deadlock for up to a day. Five
    # minutes still lets in-flight requests drain.
    waitForIdle: true
    idleTimeoutSeconds: 300
  replicas: 1
  priority: high
  nodeSelector:
    node.kubernetes.io/gpu-vendor: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  parallelSlots: 2
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  batchSize: 4096
  uBatchSize: 2048
  # First-class field rather than the raw --spec-* flags the previous model
  # used: the operator resolves the draft file's staged path itself, which is a
  # content-hash directory the manifest cannot know before the first reconcile.
  # Speculative decoding is OFF, and BOTH routes to it are closed. Measured,
  # not assumed - do not re-litigate without new numbers.
  #
  # MTP: the CRD's "mtp" is only an alias for "draft-mtp", which needs a
  # separate draft model, and neither published MTP file loads standalone. The
  # shared one has no token_embd.weight; the non-shared one dies on
  # output_hc_norm.weight, a tensor the PARENT model has. MTP is a head meant
  # to load fused to its parent and upstream llama.cpp has no path for that.
  #
  # ngram-cache: loads fine and needs no draft weights, but made generation
  # roughly HALF as fast on this workload - 10.5-15.7 tok/s against 22.2
  # without it. Acceptance is too low to pay for the verification passes: this
  # model is asked reasoning questions and writes new prose rather than
  # restating its context, so context n-grams rarely hit. The other
  # context-only variants (ngram-simple, ngram-mod, ngram-map-k) work the same
  # way; they would need evidence of different behaviour to be worth a rollout.
  resources:
    cpu: "500m"
    # Both request AND limit - llmkube maps this single value to each, and the
    # first attempt was OOMKilled at 16Gi. Weights live in the 96GiB VRAM
    # carve-out, not here; this is the staging RSS while they upload. Measured
    # basis rather than a guess: the 22.9GiB model it replaces holds 3.7GiB of
    # host RSS, so ~84GiB of weights scales to ~13.5GiB. 24Gi leaves headroom
    # for that without starving a node that only has 31GiB of system RAM after
    # the BIOS carve-out (docs/talos.md).
    memory: 24Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-strix
    - --image-min-tokens
    - "1024"
    - --cont-batching
    # Both required, and both load-bearing on this hardware.
    #
    # mmap makes the ~84GiB of weights file-backed and evictable rather than
    # anonymous; without it the pod was OOMKilled at 16Gi and again at 24Gi,
    # staging weights through a node that only has 31GiB of system RAM.
    #
    # --lazy-mode reads certain tensors from disk on demand instead of keeping
    # them resident, and this model is the case it exists for: its
    # per_layer_token_embd.weight is [160, 320001536] - the ~51B n-gram/PLE
    # table - which dominates the file. This image's HEAD commit is
    # llama.cpp#28326, "disable lazy tensor loading by default on iGPUs", so
    # the default is off for exactly this class of hardware and has to be
    # forced back on. It requires mmap, hence the pair.
    #
    # NB it is --lazy-mode, not the reference config's --tensor-read-lazy:
    # that spelling exists only in the fork the reference runs and is rejected
    # outright here ("error: invalid argument: --tensor-read-lazy").
    - --load-mode
    - mmap
    - --lazy-mode
    - "on"
    # Repacking is ON by default and rewrites weights into CPU-optimised
    # layouts. With 84GiB of weights that is not a warm-up cost, it is a hang:
    # the pod sat Running for minutes with read_bytes flat at 62.4GiB, one core
    # pegged at 100%, no log output and no progress. Everything is offloaded to
    # the iGPU, so there is nothing to gain from a CPU layout in the first
    # place. --no-host bypasses the host staging buffer, which on unified
    # memory is a copy between two views of the same physical RAM. The
    # reference config carries both for the same reason.
    - --no-repack
    - --no-host
    - --cache-prompt
    - --kv-unified
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      # 84GiB of weights off local NVMe, so the startup window is much longer
      # than the 35B model needed. 720 x 10s = 2h, matching the reference.
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
