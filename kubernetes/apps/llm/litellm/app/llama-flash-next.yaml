---
# Qwen3.8-Flash-Next on the Framework Desktop's Strix Halo iGPU.
#
# Keeps the name llama-strix on purpose: the LiteLLMModel, the virtual key and
# Open WebUI all address the service by that name, so the weights underneath can
# change without touching the rest of the chain. Swapping models is one line in
# kustomization.yaml; swapping quantisations is the block below.
#
# Why this model suits this hardware:
#   - 512 experts, 10 active => ~2.4B active params/token, so throughput holds
#     up despite ~121B of expert weights.
#   - Hybrid attention: only 12 of 48 layers are full attention (the rest are
#     linear, constant-state), so the KV cache at the full 262144 context is
#     ~6.0GiB at f16 rather than the tens of GiB a dense 48-layer model needs.
#
# Measured budget as configured: 88.2GiB resident of the 96GiB BIOS VRAM
# carve-out, leaving 7.8GiB. (UD-Q3_K_XL sat at 81.9GiB.) That is well under the file size because --lazy-mode keeps
# per_layer_token_embd.weight - [160, 320001536], the ~51B n-gram/PLE table
# that dominates the file - off the GPU and reads its rows on demand.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix
spec:
  # files[0] is the primary; the operator stages each entry at its repo-relative
  # path under a cache key of sha256(spec.source)[:16]. Weights stay cached on
  # the node once pulled, so going back to a previous set costs a reconcile and
  # no re-download.
  # WEIGHTS: bartowski IQ4_NL, chosen on measurement. unsloth UD-Q3_K_XL is
  # commented below; both stay staged on the node, so switching back is a
  # reconcile and no re-download.
  #
  # IQ4_NL wins on everything measured, which is not what the sizes suggest -
  # it is the LARGER file (93.41GiB against 83.8GiB; the 87.2 figure an earlier
  # note here quoted was wrong). Same image, same args, same four realistic
  # prompts, 2000 generated tokens:
  #
  #                       UD-Q3_K_XL   IQ4_NL
  #   generation           33.82        39.66 tok/s   +17.3%
  #   MTP acceptance       65.9%        70.2%
  #   prefill @ 6857      910.9       1223.3 tok/s    +34%
  #   prefill @ 27389     945.5       1238.0 tok/s    +31%
  #   resident VRAM        81.9GiB      88.2GiB       +6.3GiB
  #
  # The acceptance gain is probably the mechanism behind part of the
  # generation gain: a higher-fidelity quant agrees with the MTP draft head
  # more often, so more drafted tokens survive verification, which compounds.
  #
  # Cost is VRAM headroom: 7.8GiB left of the carve-out against 14.1GiB
  # before. Raising contextSize or moving off f16 KV needs that checked first.
  source: hf://bartowski/Qwen3.8-Flash-Next-GGUF
  files:
    - Qwen3.8-Flash-Next-IQ4_NL/Qwen3.8-Flash-Next-IQ4_NL-00001-of-00003.gguf
    - Qwen3.8-Flash-Next-IQ4_NL/Qwen3.8-Flash-Next-IQ4_NL-00002-of-00003.gguf
    - Qwen3.8-Flash-Next-IQ4_NL/Qwen3.8-Flash-Next-IQ4_NL-00003-of-00003.gguf
    - mmproj-Qwen3.8-Flash-Next-f16.gguf
  mmproj: mmproj-Qwen3.8-Flash-Next-f16.gguf
  format: gguf
  quantization: IQ4_NL
  # source: hf://unsloth/Qwen3.8-Flash-Next-GGUF
  # files:
  #   - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
  #   - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00002-of-00003.gguf
  #   - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00003-of-00003.gguf
  #   - mmproj-F16.gguf
  #   - MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
  # mmproj: mmproj-F16.gguf
  # format: gguf
  # quantization: UD-Q3_K_XL
  hardware:
    # ROCm, not Vulkan. Vulkan was correct for a while and is no longer: the
    # two bugs it was chosen for are gone (llama.cpp#27856, the decode collapse
    # past 2K, is fixed by #27466; #27797, the '//////' garbage, does not
    # reproduce here - see the env block). ROCm now wins on every measurement.
    #
    # Getting here took four attempts, three of which hung mid-load: the pod
    # read 56-63GiB of weights, then spun one core in userspace forever with
    # the GPU 0% busy and VRAM byte-frozen. The cause was mmap. rchar was
    # 21MiB against 58GiB of read_bytes, i.e. every byte arrived through page
    # faults, and on HIP the upload sources straight out of that file-backed
    # mapping. Any config that reaches for --load-mode mmap will hang the same
    # way; the extraArgs block has what to use instead.
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      runtime: rocm
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: framework-gpu
---
# The MTP head on its own Model. Needed only because the active weights come
# from bartowski, who does not publish one - with the unsloth weights the head
# is a companion file in the same repo and speculativeDecoding.draftModel can
# name it directly. Same file either way; this is the reference's arrangement.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix-mtp
spec:
  source: hf://unsloth/Qwen3.8-Flash-Next-GGUF
  files:
    - MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
  format: gguf
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-strix
  # Do NOT set skipModelInit here, despite the operator's MissingSkipModelInit
  # warning on every reconcile. Following that advice makes it pass --model ""
  # to llama-server, which then starts in router mode with zero models loaded,
  # answers /health, and goes Ready while serving nothing.
  modelCache:
    claimName: llmkube-framework-cache
  runtime: llamacpp
  # A bespoke image, kept because it was measured, not because it is tidy.
  # Same four realistic prompts, 2000 generated tokens, one harness. These
  # were measured on UD-Q3_K_XL; the weights block above has the IQ4_NL
  # figures, which are higher across the board but move together:
  #
  #   22.60 tok/s  stock kyuz0 rocm-10.0, f16 KV, no MTP        control
  #   24.37        this image, same args, f16 KV, no MTP        branch, +7.8%
  #   27.50        + MTP on                                     +21.7%, 65.1% accept
  #   33.82        + this image's own arg set (below)           +49.6%, 65.9% accept
  #
  # Prefill, 64 tokens per depth: 910.9 t/s at 6857 and 945.5 at 27389, against
  # the old Vulkan baseline's 396.7 and 371.3 - about 2.5x at depth. Generation
  # also stops decaying with depth; stock ROCm fell 19.63 -> 17.41 across the
  # same span, this holds flat.
  #
  # It is upstream llama.cpp at ggml-org b0f31f58 plus unmerged qwen4exp work,
  # NOT a rewrite: `compare master...b0f31f58` says diverged, 50 ahead / 117
  # behind. The "-rocm-custom" in the tag is its own ROCr/HIP runtime under
  # /opt/custom over TheRock ROCm 7.14.1. Verified by pulling the layers:
  # amd64, libggml-hip carries gfx1151 kernels, libllama-common knows every
  # flag used here including draft-mtp.
  #
  # The standing cost the benchmark does not price: a personal one-off build,
  # a tag that is a single commit, never rebuilt, untrackable by Renovate, and
  # no future llama.cpp or ROCm fix will ever reach it. Revisit when
  # llama.cpp#28097 merges - stock gains the MTP loading then and most of the
  # reason for this line evaporates.
  #
  # NB the command below: this image's binary is /app/llama-server and /app is
  # NOT on its PATH, so a bare "llama-server" does not resolve.
  image: ghcr.io/joryirving/llama-qwen4exp:b0f31f58-rocm-custom@sha256:e9f705a606a147836fab6667199e1443943542026b4091e3110bdfacdbac5048
  # The stock fallback, rebuilt nightly. Build 11042 / ec9281505. Switching to
  # it means three coordinated edits, not one: command back to llama-server,
  # cacheTypeK/V back to q8_0, and the speculativeDecoding block removed. Each
  # is explained at its own field.
  # image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-10.0@sha256:82b22c73dabe7fed8be44fad52e3b752f87889b78e03eaf3a6120dbc6f70486c
  command:
    - /app/llama-server
  rolloutPolicy:
    # The idle check asks the CURRENT pod's /slots whether it is busy and
    # treats any failure as busy, so a pod that is down, crashlooping or stuck
    # mid-load blocks the very rollout that would replace it. Turn waitForIdle
    # off while experimenting, back on once a config is settled.
    #
    # idleTimeoutSeconds stays at 300 rather than the reference's 86400: the
    # timeout bounds how long a rollout waits for the current pod to go idle,
    # so a large value reintroduces that deadlock for up to a day.
    waitForIdle: false
    idleTimeoutSeconds: 300
  replicas: 1
  priority: high
  # node.kubernetes.io/gpu-vendor, not topology.kubernetes.io/gpus:
  # NodeRestriction only lets a kubelet self-set labels from an allowlist,
  # which permits topology.kubernetes.io/{region,zone} and nothing else under
  # that prefix. Talos retries the patch forever, the label never appears, and
  # a pod selecting on it stays Pending (docs/talos.md).
  nodeSelector:
    node.kubernetes.io/gpu-vendor: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  # 2, not the reference's 1. The reference serves one caller; Open WebUI does
  # not. A single tool-using turn is already two model round-trips (decide to
  # call, then answer from the result) and Open WebUI fires auxiliary task
  # requests - title, tags, follow-ups - alongside the chat. With one slot all
  # of that serialises: measured 5.51s alone, and two concurrent requests
  # returning at 5.17s and 10.59s, i.e. the second waited for the first.
  parallelSlots: 2
  flashAttention: true
  jinja: true
  # f16 is REQUIRED by the image above, not preferred. Its QSA path asserts:
  #
  #   qwen4exp.cpp:1365: GGML_ASSERT(q->ne[0] == 256 &&
  #     k->type == GGML_TYPE_F16 && v->type == GGML_TYPE_F16) failed
  #     in llama_model_qwen4exp::graph::build_attn_qsa
  #
  # q8_0 crashloops at context creation, before any weight is read. Stock
  # llama.cpp has no such constraint and ran fine at q8_0, so this goes back to
  # q8_0 with the image.
  #
  # The cost is small and was measured rather than feared: only 12 of 48 layers
  # are full attention, so the whole KV at 262144 is ~3.0GiB at q8_0 against
  # ~6.0GiB at f16. It is also not what made this image fast - stock at f16
  # measured 22.60 tok/s against this image's 24.37 on identical args.
  cacheTypeK: f16
  cacheTypeV: f16
  batchSize: 16384
  uBatchSize: 16384
  # MTP is the single reason the bespoke image is pinned, and it is NOT
  # available upstream. Master requires the trunk tensors unconditionally
  # (src/models/qwen4exp.cpp: create_tensor(tn(LLM_TENSOR_TOKEN_EMBD, ...), 0))
  # while that branch has:
  #
  #   const bool mtp_only    = (hparams.n_layer_nextn > 0) &&
  #                            (ml.get_weight("blk.0.hc_attn_norm.weight") == nullptr);
  #   const int  trunk_flags = mtp_only ? TENSOR_NOT_REQUIRED : 0;
  #
  # i.e. it recognises a standalone MTP head - nextn layers present, trunk
  # block 0 absent - and lets the trunk tensors be missing. That is exactly
  # what the published head is: block_count 49 carrying only blk.48, the
  # parent's next layer in its own file. On stock build 11042 it dies on
  # check_tensor_dims for token_embd.weight, retested 2026-09-18.
  #
  # The enabling PRs are all unmerged: #28097 (open, "support draft-head-only
  # GGUFs (unsloth layout)"), #28610 (closed without merging).
  #
  # So this block and the stock image are mutually exclusive - remove it if the
  # image line is rolled back, or the pod crashloops.
  #
  # draftModelRef plus the second Model CR above, because the active weights
  # are bartowski's and the head is unsloth's. On the unsloth weights this can
  # go back to `draftModel: MTP/...gguf`, a companion file in the same Model.
  # nDraftMax 2 is copied from the reference and is a starting point, not a
  # measured optimum.
  #
  # Beware the benchmark trap here. A random-word prompt makes MTP look awful -
  # 17.15 tok/s at 16% acceptance - because random words are unpredictable.
  # Real prompts accept 65.9%. Judge speculation on realistic work only. The
  # same trap sank ngram-cache, noted at the end of extraArgs.
  speculativeDecoding:
    type: draft-mtp
    draftModelRef: llama-strix-mtp
    nDraftMax: 2
  # Copied from the reference. HSA_OVERRIDE_GFX_VERSION is a no-op here
  # (gfx1151 IS 11.5.1 and the image ships gfx1151 kernels) and is kept only so
  # this stays its config rather than an edit of it.
  #
  # GGML_HIP_ENABLE_UNIFIED_MEMORY is the one to watch: llama.cpp#27797, the
  # '//////' garbage on gfx1151, was pinned to exactly this variable. It did
  # NOT reproduce - a six-segment chat came back clean, longest run of '/' in
  # 926 characters was one - but re-check output after any change here rather
  # than assuming.
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
    - name: GGML_HIP_ENABLE_UNIFIED_MEMORY
      value: "1"
  resources:
    cpu: "500m"
    # llmkube maps this single value to BOTH request and limit.
    #
    # 26Gi, not the reference's 30Gi, and not a preference: this node's
    # allocatable is 30029128Ki = 28.64GiB once the 96GiB BIOS VRAM carve-out
    # is taken, with ~1.4GiB already requested, so 30Gi is unschedulable and
    # the pod sits Pending on "Insufficient memory".
    #
    # Weights do not live here - --load-mode none streams them through four
    # pinned 64MiB buffers straight to the iGPU. What this has to cover is
    # --cache-ram 12228, a 12GiB host-side prompt cache. Early attempts were
    # OOMKilled at 16Gi and again at 24Gi, but that was the old full-staging
    # path and does not apply to this config.
    memory: 26Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-strix
    # The load path, and the thing that made ROCm work at all.
    #
    # NOT --load-mode mmap: that is what hung three ROCm attempts (see the
    # hardware block). Two working alternatives, both mmap-free:
    #   - none + --lazy-mode on-direct, used here. on-direct gathers the PLE
    #     rows with explicit pread()s instead of demand-paging an mmap. It
    #     exists only on this image's branch (llama.cpp#29030, #28136, both
    #     unmerged) and is worth a lot: this pairing is most of the 27.50 ->
    #     33.82 tok/s step.
    #   - dio + --lazy-mode on, for the stock image, which has
    #     LLAMA_LOAD_MODE_DIRECT_IO but not LAZY_MODE_DIRECT. Same idea, fewer
    #     of the gains. Load time went from a 2h startup budget to 12.3s.
    - --load-mode
    - none
    - --lazy-mode
    - on-direct
    # Required with an explicit parallelSlots. llama.cpp enables a unified KV
    # buffer only "if number of slots is auto", so naming a slot count turns it
    # off and each sequence would get its own KV - halving usable context per
    # slot or doubling KV VRAM. With it, both slots share one buffer at the
    # full 262144.
    - --kv-unified
    # No auto-fit probe; every size here is stated explicitly.
    - -fit
    - "off"
    # 4GiB host-side prompt cache, not the reference's 12GiB. With
    # parallelSlots 2 the reference's figure OOMKilled the pod (exit 137)
    # before the weights finished loading: llama.cpp saves idle slot state
    # into this cache per slot ("save idle slots to the prompt cache on new
    # task"), so it does not stay a flat 12GiB when a second slot exists. The
    # node cannot absorb it either - allocatable is 28.64GiB and this pod
    # already requests 26Gi. See resources.memory.
    - --cache-ram
    - "4096"
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0.0"
    - --repeat-penalty
    - "1.0"
    - --chat-template-kwargs
    - '{"reasoning_effort":"low"}'
    - --no-reasoning-preserve
    - --image-min-tokens
    - "1024"
    #
    # Deliberately absent, so they are not re-added by pattern-matching:
    #
    #   --no-repack, --no-host   added for the stock image's mmap path, which
    #                            is not in use. --no-host in particular never
    #                            did what an earlier comment here claimed:
    #                            no_host only drops pinned buffer types from
    #                            make_cpu_buft_list(), while the loader's
    #                            upload buffers come from
    #                            ggml_backend_dev_host_buffer_type() directly.
    #   --cont-batching          on by default in this build, so the explicit
    #                            flag was redundant rather than load-bearing.
    #   --cache-prompt, --threads, --threads-batch
    #                            dropped with the reference arg set; re-add
    #                            only with numbers. (--kv-unified came back -
    #                            see parallelSlots.)
    #
    # Speculative decoding other than MTP stays off. ngram-cache loads fine and
    # needs no draft weights, but halved generation on this workload - 10.5-15.7
    # tok/s against 22.2 - because this model answers reasoning questions and
    # writes new prose rather than restating its context, so context n-grams
    # rarely hit. ngram-simple, ngram-mod and ngram-map-k work the same way.
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      # The load itself is now ~15s, but this stays generous: a cold cache has
      # to pull the whole quantisation from HuggingFace first, in an init
      # container whose time counts against nothing else. 720 x 10s = 2h.
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
