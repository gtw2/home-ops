---
# Qwen3.8-Flash-Next, replacing Qwen3.6-35B-A3B on the Framework's iGPU.
#
# Deliberately keeps the name llama-strix: the LiteLLMModel, the virtual key and
# Open WebUI all address the service by that name, so swapping the weights under
# it leaves the whole downstream chain untouched. Rolling back is one line in
# kustomization.yaml, not a coordinated edit across four files.
#
# Why this model suits Strix Halo specifically:
#   - 512 experts, 10 active => ~2.4B active params/token, FEWER than the A3B it
#     replaces, so throughput should hold up despite ~121B of expert weights.
#   - Hybrid attention: only 12 of 48 layers are full attention (the rest are
#     linear, constant-state), so the KV cache at the full 262144 context is
#     ~3.0GiB at q8_0 rather than the tens of GiB a dense 48-layer model needs.
# Budget at UD-Q3_K_XL: 83.8 weights + 3.9 MTP + 0.84 mmproj + 3.0 KV = 91.5GiB
# of the 96GiB BIOS VRAM carve-out. In practice --lazy-mode keeps the ~51B
# per-layer embedding table on disk, so observed resident VRAM is ~56GiB.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix
spec:
  source: hf://unsloth/Qwen3.8-Flash-Next-GGUF
  # files[0] is the primary; the operator stages each entry at its repo-relative
  # path under the cache key sha256(spec.source)[:16] = f869f01c859f8577.
  files:
    - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf
    - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00002-of-00003.gguf
    - UD-Q3_K_XL/Qwen3.8-Flash-Next-UD-Q3_K_XL-00003-of-00003.gguf
    - mmproj-F16.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q3_K_XL
  hardware:
    # ROCm, attempt 4. Attempts 1-3 (2026-09-14, 2026-09-17) all hung at the
    # same place: llama-server read 56-63GiB of the ~84GiB of weights, then one
    # core spun in userspace indefinitely - GPU 0% busy, VRAM byte-frozen,
    # wchan 0, read_bytes advancing ~1.5KiB/s, 36 of 37 threads at exactly 0
    # ticks. The stall point moved between attempts, so it was never one bad
    # tensor.
    #
    # The measurement that names the cause is rchar 21MiB against 58GiB of
    # read_bytes: every byte came in through page faults, i.e. the load was
    # entirely mmap-driven. --load-mode mmap was added to fix an OOM, and on
    # Vulkan it is fine, but on HIP the upload reads its source straight out of
    # a file-backed mapping and that is the single-threaded pass nothing else
    # explained.
    #
    # --load-mode dio is the fix and it is in extraArgs, not here. It drops
    # mmap for the bulk weights and takes the loader's async path instead:
    # O_DIRECT reads into four pinned 64MiB buffers with overlapping uploads to
    # the iGPU, so host RSS stays ~256MiB (no OOM to re-fix) and no HIP copy
    # ever sources from a mapping. --lazy-mode still works without mmap - the
    # loader maps the lazy ranges alone for exactly this case.
    #
    # Two earlier reasons for Vulkan are dead and should not be resurrected:
    # llama.cpp#27856 (decode collapse past 2K) is FIXED by #27466, and
    # llama.cpp#27797 ('//////' garbage) was pinned to
    # GGML_CUDA_ENABLE_UNIFIED_MEMORY, which this config does not set.
    #
    # Vulkan baseline to beat, measured 2026-09-14, 64 tokens per depth:
    # depth 34 / 29.6 pp / 25.90 tg; 7210 / 396.7 / 23.54; 28810 / 371.3 /
    # 21.81. Roll back by restoring accelerator/runtime vulkan, the
    # vulkan-radv image and --load-mode mmap.
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      runtime: rocm
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: framework-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-strix
  # Do NOT set skipModelInit here, despite the operator's MissingSkipModelInit
  # warning on every reconcile. Following that advice makes it pass --model ""
  # to llama-server, which then starts in router mode with zero models loaded,
  # answers /health, and goes Ready while serving nothing.
  modelCache:
    claimName: llmkube-framework-cache
  runtime: llamacpp
  # TESTING joryirving's image, to price what a bespoke image actually buys.
  # Roll back to the stock line below by swapping which is commented.
  #
  # This is a personal one-off build, not a published project artifact: the
  # tag is a single commit, it is not rebuilt, and it will never pick up a
  # llama.cpp or ROCm fix. The stock kyuz0 tag is rebuilt nightly. That is the
  # standing cost of this line, separate from whatever the benchmark says.
  #
  # Verified before the swap by pulling the layers, not assumed: amd64; its
  # libggml-hip carries gfx1151 kernels (and gfx1250), so no
  # HSA_OVERRIDE_GFX_VERSION is needed the way the reference sets it; and its
  # libllama-common knows every flag this config passes, draft-mtp included.
  #
  # NB the command below. This image's llama-server is /app/llama-server and
  # /app is NOT on its PATH (/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:
  # /usr/sbin:/usr/bin:/sbin:/bin), so a bare "llama-server" will not resolve.
  image: ghcr.io/joryirving/llama-qwen4exp:b0f31f58-rocm-custom@sha256:e9f705a606a147836fab6667199e1443943542026b4091e3110bdfacdbac5048
  # Stock, rebuilt nightly. Build 11042 / ec9281505, verified in a throwaway
  # pod: --help lists "-lm, --load-mode ... - dio: use DirectIO if available",
  # which is the flag that fixed the ROCm load hang. No MTP - see the
  # speculativeDecoding block for why that needs the image above.
  # image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-10.0@sha256:82b22c73dabe7fed8be44fad52e3b752f87889b78e03eaf3a6120dbc6f70486c
  command:
    - /app/llama-server
  rolloutPolicy:
    # OFF while the ROCm attempt is in flight, on again once it serves. The
    # idle check asks the CURRENT pod's /slots whether it is busy and treats
    # any failure as busy, so a pod stuck mid-load blocks the very rollout
    # that would replace it - and the previous three attempts hung without
    # ever crashlooping, so the startup budget just holds them there.
    #
    # idleTimeoutSeconds stays at 300, not the reference's 86400: the timeout
    # bounds how long a rollout waits for the current pod to go idle, so a
    # large value reintroduces exactly that deadlock for up to a day. Five
    # minutes still lets in-flight requests drain.
    waitForIdle: false
    idleTimeoutSeconds: 300
  replicas: 1
  priority: high
  nodeSelector:
    node.kubernetes.io/gpu-vendor: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  parallelSlots: 2
  flashAttention: true
  jinja: true
  # f16, not q8_0, and this is NOT a preference while the image above is in
  # use - it is a hard requirement of that branch. Its QSA path asserts:
  #
  #   qwen4exp.cpp:1365: GGML_ASSERT(q->ne[0] == 256 &&
  #     k->type == GGML_TYPE_F16 && v->type == GGML_TYPE_F16) failed
  #     in llama_model_qwen4exp::graph::build_attn_qsa
  #
  # q8_0 crashloops the pod at context creation, before any weights matter.
  # That is why the reference config carries f16 KV; it is not tuning. Stock
  # llama.cpp has no such constraint and ran fine at q8_0, so revert this to
  # q8_0 whenever the image goes back to the kyuz0 line.
  #
  # Cost is bounded: the hybrid attention means only 12 of 48 layers are full
  # attention, so the whole KV at 262144 is ~3.0GiB at q8_0 and ~6.0GiB at
  # f16. Resident VRAM was 68.7GiB of the 96GiB carve-out, so ~3GiB more fits.
  cacheTypeK: f16
  cacheTypeV: f16
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  batchSize: 4096
  uBatchSize: 2048
  # First-class field rather than the raw --spec-* flags the previous model
  # used: the operator resolves the draft file's staged path itself, which is a
  # content-hash directory the manifest cannot know before the first reconcile.
  # Speculative decoding is OFF, and BOTH routes to it are closed. Measured,
  # not assumed - do not re-litigate without new numbers.
  #
  # MTP is OFF because it is not in upstream llama.cpp at all - not because
  # the files are wrong. Retested on build 11042 (2026-09-18) and it failed
  # the same way it did on ~10867.
  #
  # The reference config DOES have working MTP, and the difference is its
  # image. That image is not stock upstream, despite being tagged with a real
  # ggml-org commit: b0f31f58 compares "diverged" against master, 50 ahead of
  # the merge base and 117 behind, on an unmerged qwen4exp branch. Its
  # src/models/qwen4exp.cpp carries the thing master lacks:
  #
  #   const bool mtp_only    = (hparams.n_layer_nextn > 0) &&
  #                            (ml.get_weight("blk.0.hc_attn_norm.weight") == nullptr);
  #   const int  trunk_flags = mtp_only ? TENSOR_NOT_REQUIRED : 0;
  #   tok_embd = create_tensor(tn(LLM_TENSOR_TOKEN_EMBD, "weight"), ..., trunk_flags);
  #
  # That is precisely a standalone MTP head: nextn layers present, trunk block
  # 0 absent - so the trunk tensors become optional. Master hardcodes the flag
  # to 0, i.e. token_embd.weight is always required, which is our exact error.
  #
  # The relevant PRs, none of them merged:
  #   #28097 open    qwen4exp: support draft-head-only GGUFs (unsloth layout)
  #                  + fix draft-load regression   <-- the one that matters
  #   #28610 CLOSED  qwen4exp: NextN/MTP speculative decoding (draft tensor
  #                  loading + draft graph), closed without merging
  #   #29030, #28136 open, the direct-read lazy PLE work that gives that image
  #                  its --lazy-mode on-direct
  #
  # So MTP cannot be had from any kyuz0 nightly, however new: the code is not
  # on master for it to be built from. The retry condition is #28097 merging,
  # not a digest bump. Getting it sooner means building an image from that
  # branch, which is the tradeoff the reference made.
  #
  # For the record, the staged files are the right ones and match what the
  # reference feeds its own MTP:
  #
  #   parent      qwen4exp.block_count = 48   blocks 0..47
  #   shared      block_count = 49, 32 tensors, blk.48 ONLY, zero non-block
  #               tensors, qwen4exp.nextn_shared_target_tensors = true
  #   non-shared  block_count = 49, 34 tensors, blk.48 plus its own
  #               token_embd.weight and output.weight [2560, 248320]
  #
  # ngram-cache: loads fine and needs no draft weights, but made generation
  # roughly HALF as fast on this workload - 10.5-15.7 tok/s against 22.2
  # without it. Acceptance is too low to pay for the verification passes: this
  # model is asked reasoning questions and writes new prose rather than
  # restating its context, so context n-grams rarely hit. The other
  # context-only variants (ngram-simple, ngram-mod, ngram-map-k) work the same
  # way; they would need evidence of different behaviour to be worth a rollout.
  resources:
    cpu: "500m"
    # Both request AND limit - llmkube maps this single value to each, and the
    # first attempt was OOMKilled at 16Gi. Weights live in the 96GiB VRAM
    # carve-out, not here; this is the staging RSS while they upload. Measured
    # basis rather than a guess: the 22.9GiB model it replaces holds 3.7GiB of
    # host RSS, so ~84GiB of weights scales to ~13.5GiB. 24Gi leaves headroom
    # for that without starving a node that only has 31GiB of system RAM after
    # the BIOS carve-out (docs/talos.md).
    memory: 24Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-strix
    - --image-min-tokens
    - "1024"
    - --cont-batching
    # The load path, and the one thing this ROCm attempt changes.
    #
    # dio, not mmap. --load-mode mmap was added to fix an OOMKill at 16Gi and
    # again at 24Gi: staging ~84GiB of weights through a node with 31GiB of
    # system RAM. It does fix that, and on Vulkan it is what runs today, but
    # it is also what hung every ROCm attempt - see the accelerator note.
    #
    # dio fixes the OOM a different way and never mmaps the bulk weights.
    # use_mmap goes false, which is the condition the loader's async upload
    # path is gated on (llama-model-loader.cpp: `if (use_mmap ||
    # check_tensors) return nullptr`), so weights stream through four pinned
    # 64MiB staging buffers with overlapping GPU uploads instead. Host RSS is
    # bounded at ~256MiB by construction. If the cache filesystem refuses
    # O_DIRECT the open falls back to buffered reads with a warning, still
    # without mmap, so the failure mode is slower, not broken.
    #
    # --lazy-mode stays on and still works: the loader maps the lazy ranges
    # alone when mmap is off ("read_lazy also requires mmap; this condition
    # make sure it's usable even when --load-mode is not set to mmap"). This
    # model is the case that flag exists for - per_layer_token_embd.weight is
    # [160, 320001536], the ~51B n-gram/PLE table that dominates the file -
    # and this image's lineage disabled lazy loading by default on iGPUs
    # (llama.cpp#28326), so it has to be forced back on.
    #
    # NB it is --lazy-mode on, not the reference config's "on-direct". That
    # value is not a fork invention and not something upstream removed - it
    # has never been on master. It comes from the unmerged direct-read lazy
    # PLE work (llama.cpp#29030, #28136) that the reference's image is built
    # from. LLAMA_LOAD_MODE_DIRECT_IO, on the other hand, IS on master, which
    # is why dio below works on a stock nightly.
    - --load-mode
    - dio
    - --lazy-mode
    - "on"
    # Both kept from the Vulkan config, and both cheap rather than
    # load-bearing - neither is doing the work this attempt depends on.
    #
    # --no-repack: repacking is on by default and rewrites weights into
    # CPU-optimised layouts, single-threaded. Every layer is offloaded to the
    # iGPU, so the CPU layout is never read and the pass is pure cost. It was
    # once credited with fixing a 62.4GiB stall; that was wrong, the stall
    # reproduced with it set. Keep it for the wasted work it does avoid, not
    # as a fix for anything.
    #
    # --no-host: this was previously described here as bypassing the host
    # staging buffer. It does not. llama_model_params::no_host only drops
    # pinned host buffer types from make_cpu_buft_list(), i.e. from the CPU
    # tensor placement list. The loader's async upload buffers come from
    # ggml_backend_dev_host_buffer_type() directly and the lazy PLE tensor
    # from ggml_backend_dev_buffer_type(cpu_dev), so neither is affected and
    # dio's pinned staging path stays intact. Dropping it was A/B'd on ROCm
    # (attempt 2) and changed nothing, which fits.
    - --no-repack
    - --no-host
    - --cache-prompt
    - --kv-unified
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      # 84GiB of weights off local NVMe, so the startup window is much longer
      # than the 35B model needed. 720 x 10s = 2h, matching the reference.
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
