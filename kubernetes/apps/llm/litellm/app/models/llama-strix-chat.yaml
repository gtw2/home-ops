---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: llama-strix-chat
spec:
  # Distinct from the InferenceService name, which the operator auto-registers
  # untuned. This is the alias clients should ask for.
  modelName: llama-strix-chat
  proxyRef: litellm
  params:
    model: openai/llama-strix
    apiBase: http://llama-strix.llm.svc.cluster.local:8080/v1
    # llama.cpp serves without auth inside the cluster; litellm still insists on
    # a non-empty key.
    apiKey: sk-llmkube-noauth
    additional:
      temperature: 0.7
      top_p: 0.8
  info:
    mode: chat
    # llama.cpp's context holds prompt AND generation, so input is the served
    # contextSize (262144, one slot) less maxOutputTokens. Clients like Open
    # WebUI read this as the context window. Change it with contextSize in
    # qwen3.8-flash-next.yaml; it sat at 131072 from the scaffold long after
    # the server moved to 262144.
    maxInputTokens: 229376
    maxOutputTokens: 32768
    supportsFunctionCalling: true
