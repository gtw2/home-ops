---
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix
spec:
  source: hf://unsloth/Qwen3.6-35B-A3B-MTP-GGUF
  files:
    - Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
    - mmproj-F16.gguf
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: framework-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-strix
  # Do NOT set skipModelInit here, despite the operator's MissingSkipModelInit
  # warning on every reconcile. Following that advice makes it pass --model ""
  # to llama-server, which then starts in router mode with zero models loaded,
  # answers /health, and goes Ready while serving nothing. The init container
  # staging the weights is what actually produces a usable --model path.
  # modelCache:
  #   claimName: llmkube-skirk-cache
  runtime: llamacpp
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4@sha256:1c655ca0443655f2e7603d054770b07cd8c79267145728b3261295f005053947
  rolloutPolicy:
    # The idle check is fail-closed: the operator asks the CURRENT pod's /slots
    # whether it is busy, and a pod that is down refuses the connection, which
    # counts as "busy". At the reference's 86400 that means a crashlooping pod
    # cannot be replaced by a spec change for 24h - the fix and the thing it
    # fixes deadlock. Five minutes keeps the intent (do not cut off in-flight
    # requests) while bounding the stall. Raise it once the service is warm.
    # Off while bringing the service up: the check asks the CURRENT pod's
    # /slots whether it is busy and treats any failure as busy, so a pod that
    # is down (connection refused) or in router mode (no /slots) blocks its own
    # replacement. Turn it back on once the service is genuinely serving and
    # draining in-flight requests is worth something.
    waitForIdle: false
    idleTimeoutSeconds: 300
  command:
    - llama-server
  replicas: 1
  priority: high
  # node.kubernetes.io/gpu-vendor, not the reference's topology.kubernetes.io/
  # gpus: NodeRestriction only lets a kubelet self-set labels from an allowlist,
  # which permits topology.kubernetes.io/{region,zone} and nothing else under
  # that prefix. Talos retries the patch forever and the label never appears, so
  # a pod selecting on it stays Pending (docs/talos.md).
  nodeSelector:
    node.kubernetes.io/gpu-vendor: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  contextSize: 262144
  parallelSlots: 2
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  batchSize: 6144
  uBatchSize: 2048
  resources:
    cpu: "500m"
    memory: 16Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - llama-strix
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-type
    - draft-mtp
    - --spec-draft-p-min
    - "0.75"
    - --spec-draft-n-max
    - "3"
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - --cache-prompt
    - --cache-ram
    - "4096"
    - --kv-unified
    - --checkpoint-min-step
    - "32768"
    - --temp
    - "0.6"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "16"
    - --threads-batch
    - "21"
    - --load-mode
    - none
    - --chat-template-kwargs
    - '{"preserve_thinking":true}'
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
