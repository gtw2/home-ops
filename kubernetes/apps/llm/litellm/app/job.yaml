---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-init-db
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        # Every other app in this repo creates its database with a postgres-init
        # initContainer on the app pod. LiteLLMProxy is an operator-owned
        # Deployment with no initContainers field, so the same image runs as a
        # one-shot Job instead. It is idempotent - re-running it on a database
        # that already exists is a no-op.
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.7@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
          envFrom:
            - secretRef:
                name: litellm-init-db-secret
