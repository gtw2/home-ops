---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: open-webui
spec:
  proxyRef: litellm
  keyAlias: Open WebUI
  # The operator mints the key through the proxy admin API and writes it here.
  secretName: litellm-key-open-webui
  secretKey: api-key
  # No models list: open-webui is the general chat UI and should pick up new
  # models as they are added, without re-minting the key each time. Scope a
  # key to specific models when it belongs to one automated consumer.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: open-webui
spec:
  # Secrets are namespaced and open-webui lives in home-automation, so the
  # minted key goes back to 1Password and is pulled from there by whichever
  # namespace needs it. Requires the onepassword-connect store's token to have
  # write access to the litellm item.
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-open-webui
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_OPEN_WEBUI_API_KEY
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: memini
spec:
  proxyRef: litellm
  keyAlias: Memini
  secretName: litellm-key-memini
  secretKey: api-key
  # Scoped, unlike open-webui's unrestricted key: memini is an automated
  # consumer with exactly two needs - reranking and distillation. Embeddings are
  # not listed because it reaches toolhive-embed directly, without the proxy.
  models:
    - llama-strix-chat
    - rerank
  # No PushSecret for this one, unlike open-webui: memini runs in this namespace
  # and reads the minted Secret directly with a secretKeyRef, so the key never
  # needs to travel through 1Password.
