---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: open-webui
spec:
  proxyRef: litellm
  keyAlias: Open WebUI
  # The operator mints the key through the proxy admin API and writes it here.
  secretName: litellm-key-open-webui
  secretKey: api-key
  # No models list: open-webui is the general chat UI and should pick up new
  # models as they are added, without re-minting the key each time. Scope a
  # key to specific models when it belongs to one automated consumer.
  #
  # No PushSecret: open-webui moved into this namespace, so it reads this
  # Secret directly and the key no longer needs to travel through 1Password.
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: memini
spec:
  proxyRef: litellm
  keyAlias: Memini
  secretName: litellm-key-memini
  secretKey: api-key
  # Scoped, unlike open-webui's unrestricted key: memini is an automated
  # consumer with exactly two needs - reranking and distillation. Embeddings are
  # not listed because it reaches toolhive-embed directly, without the proxy.
  models:
    - llama-strix-chat
    - rerank
  # No PushSecret for this one, unlike open-webui: memini runs in this namespace
  # and reads the minted Secret directly with a secretKeyRef, so the key never
  # needs to travel through 1Password.
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: kritika
spec:
  proxyRef: litellm
  keyAlias: kritika
  secretName: litellm-key-kritika
  secretKey: api-key
  # Scoped: kritika is an automated consumer that only ever asks for the review
  # model. Embeddings go straight to toolhive-embed, as memini's do.
  models:
    - llama-strix-chat
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kritika
spec:
  # kritika lives in its own namespace, so the minted key goes back to
  # 1Password and kritika's ExternalSecret pulls it from there.
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-kritika
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_KRITIKA_API_KEY
# Friends: one key each, copied from this template. Kept as a comment until
# there is a first friend, since an inactive key is still a working credential.
#
# Scoped like kritika's, not open-webui's: a key outside the cluster should
# name its models, so a new model is not handed out by default.
#
# maxParallelRequests 1 is the one limit that matters. gufo serves two
# sessions (--sessions 2 in qwen3.8-flash-next-gufo.yaml); a friend's agent
# loop could hold both, which would queue Open WebUI behind it. rpmLimit
# bounds the tight retry loops agent clients fall into. No tpmLimit: an
# agent's prompt alone can be tens of thousands of tokens, so any value that
# lets one turn through says nothing about throughput.
#
# The key goes to 1Password beside kritika's, for handing over from there.
# Delete the pair to revoke: the operator deletes the key from the proxy.
#
# ---
# apiVersion: litellm.home-operations.com/v1alpha1
