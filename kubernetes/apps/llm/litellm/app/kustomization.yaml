---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./pvc.yaml
  - ./job.yaml
  - ./litellmproxy.yaml
  - ./servicemonitor.yaml
  # LiteLLMVirtualKey: one file per consumer
  - ./virtualkeys
  # Model + InferenceService + LiteLLMModel: the weights, the pod that serves
  # them, and the name clients call them by.
  #
  # Exactly ONE of these may be active: each runs as the Service llama-strix
  # on the Framework's one GPU. Each also carries its LiteLLMModel under the
  # model's real name, so /v1/models always says what is loaded. Both
  # Flash-Next files publish qwen3.8-flash-next, so swapping engines changes
  # nothing for clients. Swapping to another model changes the name they call:
  # move kritika, memini and the keys in ./virtualkeys to it in the same commit.
  #
  # To change models, or to roll back, move the comment - do not revert the
  # commit. The manifests are meant to stay in the tree: a revert would also
  # take the flash-next config and everything learned writing it, and we would
  # rebuild it from scratch the next time. Swapping the line is the whole
  # operation; the weights of every option stay cached on the node, so going
  # back costs one reconcile and no re-download.
  #
  #   ./qwen3.8-flash-next.yaml       Flash-Next       llama.cpp fork  IQ4_NL      ~93.4GiB
  #   ./qwen3.8-flash-next-gufo.yaml  Flash-Next       gufo            UD-Q4_K_XL  ~103.6GiB
  #   ./qwen3.6-35b-a3b.yaml          Qwen3.6-35B-A3B  llama.cpp       UD-Q4_K_XL  ~22.9GiB
  #
  # The gufo option needs the BIOS carve-out at its minimum (docs/talos.md);
  # its header says why, and how its weights got onto the node.
  #
  # Files are named for the model they serve, not the service name, so the
  # line below says what is actually running.
  # - ./qwen3.8-flash-next.yaml
  - ./qwen3.8-flash-next-gufo.yaml
  # - ./qwen3.6-35b-a3b.yaml
  # LiteLLMModel: the backends that are not the Framework's model
  - ./models
  # Grafana dashboards: one ConfigMap and one CR per dashboard, so they can be
  # added or dropped independently.
  - ./dashboard
  - ./grafanadashboard.yaml
