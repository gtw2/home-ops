---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # Proxy auth. LITELLM_MASTER_KEY is what apiAccess.masterKeyRef reads to
        # mint virtual keys, and it is the sk- key you log in with.
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"
        # SSO through Authentik, same pattern as open-webui.
        GENERIC_CLIENT_ID: "{{ .LITELLM_CLIENT_ID }}"
        GENERIC_CLIENT_SECRET: "{{ .LITELLM_CLIENT_SECRET }}"
        # Spend logs, virtual keys and the UI's session state all live in
        # postgres17; the DB and role are created by the init Job.
        DATABASE_URL: postgres://{{ .LITELLM_POSTGRES_USER }}:{{ .LITELLM_POSTGRES_PASSWORD }}@postgres17-rw.database.svc.cluster.local/{{ .LITELLM_POSTGRES_DB }}
  dataFrom:
    - extract:
        key: litellm
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-init-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm-init-db-secret
    template:
      data:
        INIT_POSTGRES_DBNAME: "{{ .LITELLM_POSTGRES_DB }}"
        INIT_POSTGRES_HOST: postgres17-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .LITELLM_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .LITELLM_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: litellm
