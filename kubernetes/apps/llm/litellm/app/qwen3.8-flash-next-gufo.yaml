---
# Qwen3.8-Flash-Next on gufo, the challenger to qwen3.8-flash-next.yaml.
#
# Same model, different engine and weights, ported from the reference
# (joryirving/home-ops kubernetes/apps/base/llm/litellm/qwen3.8-flash-next-gufo.yaml,
# as of d70c2560, 2026-10-14). Kept under the name llama-strix like every
# option in kustomization.yaml, so the LiteLLMModel, the virtual key and Open
# WebUI follow whichever file is live. Swapping is the one line there.
#
# PREREQUISITES, both outside this file:
#   1. The BIOS iGPU carve-out at its minimum (docs/talos.md). The model holds
#      ~95GiB of GPU memory (100787MiB device-used at load), more than the
#      96GiB carve-out it shipped with.
#   2. The weights on the node. llmkube never runs its model downloader for
#      runtime: generic (NeedsModelInit() = false), so nothing in this file
#      fetches them. They arrived on 2026-10-14 through a one-off Job,
#      flash-next-gufo-prestage (#1742); if the cache is ever lost, restore
#      that file from git history and let it run before swapping to this.
#
# Measured here 2026-10-14, first day live, against the llama.cpp fork on the
# same node and memory layout:
#
#                            llama.cpp fork      gufo
#   one request alone        38.0-38.9 tok/s     36.9-42.1 tok/s
#   two at once              second one queues   25.3-26.6 + 30.7-41.9 tok/s
#   MTP acceptance           60-62%              70-74%
#   load                     ~15s                61s (45s of it fingerprinting)
#   task llm:eval            89%, 93%            82%
#
# Same 77-token prompt, 1500 tokens out, cache off. The gain is concurrency,
# not single-stream speed: upstream's 65.25 tok/s single-user figure did not
# reproduce (gufo logged plan=serial-fallback for every solo request).
#
# The eval gap is not yet a finding. It is one run per task, and the fork
# itself swung 60% -> 100% on noderestriction-labels between its two runs.
# Of gufo's misses, openwebui-persistentconfig was right but worded
# "first-boot", which the check's regex misses; noderestriction-labels was
# genuinely wrong (blamed API-server prefix validation, not NodeRestriction).
# Settle it with --repeat 3 on both before choosing on quality. The weights
# differ too (UD-Q4_K_XL here, IQ4_NL there), so this is not engine alone.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: llama-strix
spec:
  # unsloth UD-Q4_K_XL, the quant gufo publishes its Flash-Next numbers for,
  # and the reference's. 4 shards, 103.6GiB, against IQ4_NL's 93.4GiB.
  #
  # Same source as the UD-Q3_K_XL and MTP files already cached, so the same
  # cache key: /models/f869f01c859f8577 (sha256 of spec.source, first 16 hex).
  # args below hardcode that path; changing source moves it.
  #
  # Under runtime: generic this Model is bookkeeping and the GPU claim, not a
  # download. The prestage Job fetched exactly this file list.
  source: hf://unsloth/Qwen3.8-Flash-Next-GGUF
  files:
    - UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
    - UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00002-of-00004.gguf
    - UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00003-of-00004.gguf
    - UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00004-of-00004.gguf
    - MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    # BF16, not the F16 already cached: gufo's --mmproj takes "Qwen BF16
    # vision sidecar" (gufo serve llm --help, 0.15.0).
    - mmproj-BF16.gguf
  mmproj: mmproj-BF16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      runtime: rocm
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: framework-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-strix
  labels:
    krr/ignore: "true"
  annotations:
    # waitForIdle polls /slots by default, which gufo does not serve, and any
    # failure counts as busy - so without this every rollout of this pod would
    # wait out idleTimeoutSeconds. /health always answers, so the wait is in
    # effect off for this pod: a rollout can cut off a request in flight.
    inference.llmkube.dev/idle-endpoint: /health
spec:
  modelRef: llama-strix
  runtime: generic
  # Released semver tag, so Renovate can track it - the standing cost of the
  # llama.cpp fork image is that it cannot. Verified 2026-10-14 by running it
  # on framework: gufo 0.15.0 (89d6185), uid 1000 in groups video and render,
  # memlock 8MiB, and every flag below listed by `gufo serve llm --help`.
  image: ghcr.io/gufo-org/toolboxes/gufo-runtime:0.16.0@sha256:1a979643634b760e068387c0486a718424f64da1e0d290a4d47b561680feb340
  command:
    - gufo
  args:
    - serve
    - llm
    - --host
    - 0.0.0.0
    - --port
    - "8080"
    # Two sessions, each with the full context. gufo reserves their capacity
    # at admission, so if two do not fit it fails at startup instead of
    # OOMing mid-request; fall back to "1" then. They fit on the first start
    # (load_completed sessions=2 context_tokens=262144).
    - --sessions
    - "2"
    # gufo's per-client queue limit defaults to --max-pending, and every
    # request arrives from the litellm pod's IP. Reference values.
    - --max-pending
    - "32"
    - --max-pending-per-client
    - "16"
    # 64MiB, the reference's. Requests carry base64 images.
    - --max-request-bytes
    - "67108864"
    - --model
    - /models/f869f01c859f8577/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
    - --mmproj
    - /models/f869f01c859f8577/mmproj-BF16.gguf
    # What litellm asks for: the LiteLLMModel sends openai/llama-strix.
    - --served-model-name
    - llama-strix
    # Per session. Keep in step with contextSize and llama-strix-chat's
    # maxInputTokens.
    - --context
    - "262144"
    # 32768, not the reference's 65536: it matches llama-strix-chat's
    # maxOutputTokens, which is what clients are told.
    - --max-tokens
    - "32768"
    # MTP draft length is adaptive in gufo, capped by --draft-tokens
    # (default 7). Left at the default, as the reference does; the fork's
    # fixed nDraftMax 2 has no equivalent here.
    - --speculative
    - mtp
    - --mtp-model
    - /models/f869f01c859f8577/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
    # Sampling identical to qwen3.8-flash-next.yaml and the reference.
    - --temperature
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0.0"
    - --repeat-penalty
    - "1.0"
    # low, as qwen3.8-flash-next.yaml runs, not the reference's medium: an
    # engine comparison should not also change how long the model thinks.
    - --reasoning-effort
    - low
    # = the fork's --no-reasoning-preserve.
    - --preserve-thinking
    - "off"
    # Restart-safe prompt cache on the node's NVMe, the reference's 64GiB.
    # gufo insists on owning the directory and chmods it 0700, so it must
    # create it: /cache is the group-writable gufo-cache the prestage Job
    # made, and /cache/continuation does not exist until gufo starts.
    #
    # No --cache-ram-bytes: the default is half the host RAM still available
    # after the model loads, capped by the container limit. It chose
    # 12175706112 (11.3GiB) on the first start, with 23.2GiB available. Those
    # pages are hipHostMalloc'd and charged to this pod; see resources.memory.
    # No --cache-disk-staging-bytes: Flash-Next ignores it.
    - --cache-disk
    - /cache/continuation
    - --cache-disk-bytes
    - "68719476736"
  # Required for runtime: generic - args name the model itself. The warning in
  # qwen3.8-flash-next.yaml against setting this applies to runtime: llamacpp
  # only, where it makes the operator pass --model "".
  skipModelInit: true
  contextSize: 262144
  rolloutPolicy:
    # 300, not the reference's 86400, for the reason given in
    # qwen3.8-flash-next.yaml; the annotation above makes it moot for now.
    waitForIdle: true
    idleTimeoutSeconds: 300
  replicas: 1
  priority: high
  # node.kubernetes.io/gpu-vendor, not the reference's
  # topology.kubernetes.io/gpus: see qwen3.8-flash-next.yaml.
  nodeSelector:
    node.kubernetes.io/gpu-vendor: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  # The cache files are group 102 (the operator's curl image wrote them) and
  # gufo runs as uid 1000. fsGroup 102 lets it read /models and write /cache.
  podSecurityContext:
    fsGroup: 102
    fsGroupChangePolicy: OnRootMismatch
  # No-op, as in qwen3.8-flash-next.yaml; kept to match the reference.
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1"
  resources:
    cpu: "1"
    # llmkube maps this to both request and limit.
    #
    # 24Gi, not the reference's 108Gi. That figure assumed gufo copies the
    # weights into anonymous memory, charged to this cgroup
    # (joryirving/home-ops#10479). Not so here, on 0.15.0 with the carve-out
    # at 512MiB: the weights and sessions are GPU allocations in GTT, which no
    # cgroup is charged for. Measured on the first day: process RSS 1040MiB
    # after load, memory.peak 16.8GiB once the prompt cache filled, of which
    # 11.3GiB anon (the RAM cache budget, see --cache-disk) and 5.4GiB file
    # (the disk cache's page cache, reclaimable). 24Gi covers that with room.
    #
    # The ~95GiB in GTT is invisible to kubelet, so allocatable overstates
    # what is free; the llm-workload taint and the OOMConfig cover it.
    memory: 24Gi
  extraVolumes:
    - name: models
      persistentVolumeClaim:
        claimName: llmkube-framework-cache
  extraVolumeMounts:
    - name: models
      mountPath: /models
      readOnly: true
    - name: models
      mountPath: /cache
      subPath: gufo-cache
  containerPort: 8080
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      # 2h, as for the fork, though nothing downloads in this pod and the
      # first load took 61s. Kept generous for a cold page cache.
      failureThreshold: 720
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
