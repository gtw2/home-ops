---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default

              # Embeddings: straight at the InferenceService, no litellm hop and
              # no key. This is the same endpoint the toolhive optimizer already
              # uses, and it is the model memini wants anyway -
              # Qwen3-Embedding-0.6B at 1024 dims. Sharing it is deliberate: it
              # sits idle once the tool index is built, so a second embedder
              # would be pure duplicated cost.
              MEMINI_EMBED_BASE_URL: http://toolhive-embed.llm.svc.cluster.local:8080/v1
              MEMINI_EMBED_MODEL: toolhive-embed
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_QUERY_PREFIX: "Instruct: Given a user message, retrieve relevant past memories\nQuery: "
              MEMINI_EMBED_MAX_CONCURRENCY: "16"
              MEMINI_RECALL_EMBED_TIMEOUT: 15s
              MEMINI_REEMBED_ON_MODEL_CHANGE: "true"

              # Distillation. This is the one piece that touches the Framework's
              # GPU, which is the only chat backend in this cluster - every
              # distillation competes with interactive chat. If that shows, drop
              # the three MEMINI_LLM_* lines and memini falls back to marker
              # heuristics with no data migration.
              #
              # llama-strix-chat, not the auto-registered llama-strix: the alias
              # carries the sampling defaults and token limits.
              MEMINI_LLM_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: llama-strix-chat
              MEMINI_LLM_MAX_TOKENS: "24576"
              MEMINI_DISTILL_TIMEOUT: 600s
              # Straight from the Secret the litellm operator mints in this
              # namespace - no 1Password round trip, so there is no window where
              # the key exists in the cluster but not yet in the vault.
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-memini
                    key: api-key

              # Rerank through litellm, which normalises the rerank API shape.
              MEMINI_RERANK: http://litellm.llm.svc.cluster.local:4000/v1
              MEMINI_RERANK_MODEL: rerank
              MEMINI_RERANK_MAX_CONCURRENCY: "2"
              MEMINI_RERANK_TIMEOUT: 45s
              MEMINI_RERANK_POOL: "5"
              MEMINI_RERANK_MAX_DOC_CHARS: "1024"
              MEMINI_RERANK_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-memini
                    key: api-key

              # Lifecycle. Defaults from upstream except where noted.
              MEMINI_WRITE_DEDUP_SCORE: "0.80"
              MEMINI_WRITE_DEDUP_ACTION: coalesce
              MEMINI_DEDUP_TIERS: episodic,semantic,procedural
              MEMINI_DEDUP_SIMILARITY: "0.80"
              MEMINI_SHORT_TERM_CAP: "300"
              MEMINI_ASSESS_BATCH: "5"
              MEMINI_ASSESSED_SALIENCE_WEIGHT: "0.6"
              MEMINI_PROMOTE_MIN_ACCESS: "10"
              MEMINI_DEMOTE_AFTER: 72h
              MEMINI_TIMEOUT_MS: "55000"
            envFrom:
              - secretRef:
                  name: memini
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 180
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  failureThreshold: 6
              readiness: *probe
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
      # Nightly integrity check on the sqlite store.
      fsck:
        enabled: true
        cronjob:
          schedule: "0 5 * * *"
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: MEMINI_API_KEY
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      data:
        # Created by components/kopiur/backup as ${APP}, with a Restore
        # dataSourceRef so a rebuild repopulates from backup.
        existingClaim: *app
      api-keys:
        # REQUIRED. The chart defaults this to false and its own docs warn the
        # failure is silent: without it the volume vanishes from the rendered
        # pod and memini boots with no key file, so every client is unauthorised
        # rather than erroring at deploy time.
        enabled: true
        name: memini-api-keys
    route:
      # API + MCP surface on the http port. Internal only: this holds everything
      # the agents have ever been told.
      main:
        enabled: true
        hostnames: ["memini.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
      # Admin SPA on its own port. Upstream is explicit that a signed-in token
      # here is same-origin-readable and this must stay on an internal gateway.
      ui:
        enabled: true
        hostnames: ["memini-ui.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    serviceMonitor:
      main:
        enabled: true
    grafanaDashboards:
      enabled: true
      folder: llm
