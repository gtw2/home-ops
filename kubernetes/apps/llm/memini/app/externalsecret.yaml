---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # Gates memini's own API and MCP surface.
        #
        # The litellm key is NOT here. The operator mints it into
        # litellm-key-memini in this very namespace, so the container reads it
        # with a secretKeyRef instead of round-tripping through 1Password. The
        # open-webui key needs that round trip only because it is consumed from
        # another namespace; doing it here would add an ordering hazard - the
        # field does not exist until the key is first minted and pushed - for no
        # benefit.
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
  dataFrom:
    - extract:
        key: memini
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # Per-client keys, each pinned to its own namespace so open-webui and
        # opencode never see each other's memories.
        api-keys.yaml: |
          keys:
            - name: open-webui
              secret: "{{ .OPEN_WEBUI_API_KEY }}"
              default_namespace: open-webui
            - name: opencode
              secret: "{{ .OPENCODE_API_KEY }}"
              default_namespace: opencode
  dataFrom:
    - extract:
        key: memini
