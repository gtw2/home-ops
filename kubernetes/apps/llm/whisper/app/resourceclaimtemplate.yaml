---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/resource.k8s.io/resourceclaimtemplate_v1.json
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: whisper-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            # Published by the Intel GPU DRA driver in kube-system. Same
            # DeviceClass media/plex already claims for transcoding, which is
            # this cluster's working proof that the non-privileged path works -
            # plex runs runAsNonRoot and still gets the device.
            deviceClassName: gpu.intel.com
            # One iGPU. There are four in the cluster, one per talos node, and
            # plex holds one; ExactCount takes a single free device rather than
            # All, so whisper and plex can coexist on different nodes.
            allocationMode: ExactCount
            count: 1
