---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app whisper
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      whisper:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          fetch-model:
            # Only the model is fetched; the image already carries
            # whisper-server on PATH.
            image:
              repository: ghcr.io/ggml-org/whisper.cpp
              tag: main-fe69461618ffc50ba8afa65c25cc6c6e34d4537f@sha256:f0ac7bb8d5c1f3460e2fe0d21c9f69cff2b592791e200846c7e86ad0712aab46
            command:
              - bash
              - -c
              - |
                set -euo pipefail
                cd /cache
                model=ggml-large-v3-turbo-q8_0.bin
                # Size-checked, not existence-checked, and downloaded to a
                # .part file first. Existence alone is what let a truncated
                # GGUF crashloop memini-rerank on its first deploy.
                want=874188075
                if [ ! -f "$model" ] || [ "$(stat -c%s "$model")" != "$want" ]; then
                  curl -fsSL --retry 3 -o "$model.part" \
                    "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$model"
                  mv "$model.part" "$model"
                fi
                ls -l "$model"
        containers:
          app:
            # The plain CPU build, NOT main-intel. main-intel registers its
            # SYCL backend at startup and aborts with "can not find preferred
            # GPU platform" when no device is present - --no-gpu does not help,
            # because registration happens before the flag is read.
            image:
              repository: ghcr.io/ggml-org/whisper.cpp
              tag: main-fe69461618ffc50ba8afa65c25cc6c6e34d4537f@sha256:f0ac7bb8d5c1f3460e2fe0d21c9f69cff2b592791e200846c7e86ad0712aab46
            # ENTRYPOINT is ["bash","-c"], and PATH already carries
            # /app/build/bin from the image.
            args:
              - |
                exec whisper-server \
                  --model /cache/ggml-large-v3-turbo-q8_0.bin \
                  --host 0.0.0.0 --port 8080 --threads 8 \
                  --inference-path /v1/audio/transcriptions
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 6
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: "2"
                memory: 2Gi
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: whisper
        ports:
          http:
            port: 8080
    persistence:
      cache:
        existingClaim: whisper-cache
        globalMounts:
          - path: /cache
