---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-operator
spec:
  chartRef:
    kind: OCIRepository
    name: litellm-operator
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controller:
      logLevel: info
      leaderElection:
        enabled: true
    llmkube:
      # Off: clients address models by their real names (qwen3.8-flash-next),
      # and every name the proxy serves is a hand-written LiteLLMModel.
      # Auto-registration can only publish the InferenceService name, which is
      # a Service name and so cannot carry the dots in a model's name; it would
      # put llama-strix, memini-rerank and toolhive-embed back on /v1/models
      # beside the real names, the reranker as a chat model. Turning it off
      # deletes those generated LiteLLMModels and leaves the hand-written ones.
      autoRegister: false
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
