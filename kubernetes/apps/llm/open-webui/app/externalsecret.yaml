---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: open-webui-secret
    template:
      data:
        # OAUTH
        ENABLE_OAUTH_SIGNUP: "true"
        ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
        OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
        OAUTH_PROVIDER_NAME: Authentik
        OPENID_PROVIDER_URL: https://sso.${SECRET_DOMAIN}/application/o/open-web-ui/.well-known/openid-configuration
        OAUTH_SCOPES: openid email profile
        # Role from Authentik group membership, checked at every login.
        # Without this a new account lands as DEFAULT_USER_ROLE (pending) and
        # waits for manual approval. Admin is what sees the Cluster tools
        # connection (TOOL_SERVER_CONNECTIONS, no access_grants = admin-only
        # in v0.12.3), so only authentik Admins may map to it, and anyone who
        # was an Open WebUI admin without being in it becomes a user.
        #
        # The groups claim comes from the profile scope. In v0.12.3
        # get_user_role: a groups list matching none of these is refused
        # outright, and an EMPTY list leaves the role as it was. Keep the list
        # in step with the bindings in
        # security/authentik/app/blueprints/open-webui.yaml; every account
        # that existed on 2026-10-22 is in one of these groups.
        ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
        OAUTH_ROLES_CLAIM: groups
        OAUTH_ALLOWED_ROLES: authentik Users,friends,authentik Admins
        OAUTH_ADMIN_ROLES: authentik Admins
        OPENID_REDIRECT_URI: https://chat.${SECRET_DOMAIN}/oauth/oidc/callback
        OAUTH_CLIENT_ID: "{{ .OPEN_WEBUI_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OPEN_WEBUI_CLIENT_SECRET }}"
        # OPENAI_API_KEY is NOT here. open-webui now runs in the llm namespace
        # alongside the LiteLLMVirtualKey that mints it, so the HelmRelease
        # reads litellm-key-open-webui with a secretKeyRef instead. The
        # 1Password round trip existed only to cross the namespace boundary.
        # memini. The filter function reads this from the environment rather
        # than a valve, deliberately - its own comment says it keeps the secret
        # out of the Open WebUI database, where Functions and their valves live.
        # This is memini's own per-client key, not a litellm one, and it pins
        # every write from this instance to the open-webui namespace.
        MEMINI_API_KEY: "{{ .OPEN_WEBUI_API_KEY }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: "{{ .OPEN_WEBUI_POSTGRES_DB }}"
        INIT_POSTGRES_HOST: postgres17-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .OPEN_WEBUI_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .OPEN_WEBUI_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # Database
        DATABASE_URL: postgres://{{ .OPEN_WEBUI_POSTGRES_USER }}:{{ .OPEN_WEBUI_POSTGRES_PASSWORD }}@postgres17-rw.database.svc.cluster.local/{{ .OPEN_WEBUI_POSTGRES_DB }}
  dataFrom:
    - extract:
        key: cloudnative-pg
    # memini's per-client key is only ever in 1Password - it is not minted
    # in-cluster, so this is a direct read rather than a round trip.
    - extract:
        key: memini
    - extract:
        key: open-webui