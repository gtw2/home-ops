---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  interval: 15m
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            envFrom: &envFrom
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.13.3@sha256:46b59158e6558eeb980bc828e0f1b30238ad24d82ed84d5e5eda1dab2a082f14
            env:
              # Most of open-webui's settings are PersistentConfig: env seeds
              # the database on FIRST launch and is ignored on every start
              # after that, so changing a value here silently does nothing.
              # This makes env authoritative again, which is the only way the
              # connection below can live in git. Everything not declared here
              # falls back to upstream defaults rather than a stored value.
              ENABLE_PERSISTENT_CONFIG: "false"
              # Authentik is the way in (the OAUTH_* settings in
              # externalsecret.yaml), so the local signup endpoint is off and
              # the password form is hidden. Upstream defaults both to on, and
              # with persistent config off those defaults applied at every
              # start: anyone could POST /api/v1/auths/signup on the public
              # hostname. With OAUTH_MERGE_ACCOUNTS_BY_EMAIL, an account
              # registered that way under an invited person's address is the
              # one their first SSO login attaches to and promotes, while
              # the password its creator chose still signs in (v0.13.3,
              # utils/oauth.py and routers/auths.py).
              #
              # Either one being false makes signup answer 403. OAuth account
              # creation is ENABLE_OAUTH_SIGNUP and unaffected.
              #
              # What these two do not do (v0.13.3):
              # - Take a password away. Sign-in checks ENABLE_PASSWORD_AUTH
              #   only, left on as the way in when Authentik is down, and the
              #   form is hidden rather than gone: /auth?form=signin still
              #   renders it (src/routes/auth/+page.svelte). An account
              #   registered before this change keeps its password until it
              #   is deleted in Admin > Users, and stays the one that
              #   address's first SSO login attaches to.
              # - Leave local signup as a way to create the first admin. On
              #   an empty database it answers 403 without the login form,
              #   unless ENABLE_INITIAL_ADMIN_SIGNUP is true. The first SSO
              #   login is made admin instead (utils/oauth.py), so a rebuilt
              #   database is bootstrapped through Authentik.
              ENABLE_SIGNUP: "false"
              ENABLE_LOGIN_FORM: "false"
              # Models come from litellm in the llm namespace, which fronts the
              # llama.cpp InferenceService on the Framework. OPENAI_API_KEY is
              # the litellm virtual key, pulled from the secret below - the
              # proxy rejects an unkeyed request even in-cluster.
              ENABLE_OPENAI_API: true
              OPENAI_API_BASE_URL: http://litellm.llm.svc.cluster.local:4000/v1
              # Straight from the Secret the litellm operator mints in this
              # namespace. Same-namespace now, so no 1Password hop.
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # The ollama endpoint was the out-of-cluster instance on
              # framework.internal:11434, retired when that host joined the
              # cluster.
              ENABLE_OLLAMA_API: false
              # Titles, tags, follow-ups and search queries go to the 3090, off
              # the Framework, where on llama-strix's single slot each of these
              # short calls swapped out the context of whatever long
              # conversation held it. While the 3090 is off they fail rather
              # than fall back (litellm/app/litellmproxy.yaml): chats then get
              # no title, tags or follow-ups, and web search queries the raw
              # message instead of generated queries (v0.12.5 middleware.py).
              TASK_MODEL_EXTERNAL: qwen3.6-35b-a3b
              # Context compaction: once a chat's history passes the threshold,
              # the older messages are summarised by the chat model and the
              # newest 40% (the retention default) are kept verbatim.
              #
              # Since v0.12.0, with native function calling, it is also checked
              # between tool-call rounds, not only before the reply starts, and
              # a history holding tool results
              # is judged on the full estimate rather than the last reported
              # usage, so cluster-tool chats compact mid-reply instead of growing
              # past the context.
              #
              # The threshold is independent of the model's context size, and
              # it is compared against an ESTIMATE - characters / 4 - which
              # undercounts code, JSON tool output and non-English text. So it
              # sits well under qwen3.8-flash-next's 229376-token input limit
              # (262144 context less 32768 reserved for output) rather than
              # near it: 160000 leaves ~43% for the estimate to be wrong by.
              ENABLE_CONTEXT_COMPACTION: true
              CONTEXT_COMPACTION_TOKEN_THRESHOLD: 160000
              # v0.13.0 raises the default cap on one reply's tool-call rounds
              # from 256 to 1024. Each round is a request to the Framework,
              # which everything else here shares, so a looping model should
              # stop at the old limit.
              CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS: 256
              # Open-webui settings
              ENABLE_RAG_WEB_SEARCH: true
              ENABLE_SEARCH_QUERY: true
              RAG_WEB_SEARCH_ENGINE: searxng
              SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
              # The memini Memory filter's base_url valve defaults to this, and
              # to http://localhost:8080 - open-webui itself - without it, where
              # every recall and capture fails silently (fallback_on_error).
              # A default only: a base_url already saved in the function's
              # valves wins, and valves live in the database, not here.
              # The timeout_ms valve defaults to 30000, under memini's 45s
              # MEMINI_RERANK_TIMEOUT: set ~55000 in the function's settings, as
              # MEMINI_TIMEOUT_MS is, or a slow rerank returns no memory at all.
              MEMINI_BASE_URL: http://memini.llm.svc.cluster.local:8080
              # MCP tools from toolhive in the llm namespace. Talking to the
              # gateway Service directly keeps this in-cluster, so it bypasses
              # envoy and needs no API key - auth_type none is correct here,
              # not an oversight. The gateway's own optimizer means this stays
              # two tools (find_tool/call_tool) no matter how many MCP servers
              # join the group.
              #
              # For MCP connections open-webui uses "url" verbatim and ignores
              # "path", so the /mcp suffix belongs in the url. "config.enable"
              # must be true or the server is parsed and then skipped.
              # This only works because ENABLE_PERSISTENT_CONFIG is false above.
              TOOL_SERVER_CONNECTIONS: |-
                [
                  {
                    "url": "http://vmcp-mcp-gateway.llm.svc.cluster.local:4483/mcp",
                    "path": "",
                    "type": "mcp",
                    "auth_type": "none",
                    "key": "",
                    "headers": null,
                    "config": {"enable": true},
                    "info": {
                      "id": "mcp-gateway",
                      "name": "Cluster tools",
                      "description": "Read-only kubectl and flux tools, via toolhive"
                    }
                  }
                ]
              # Speech-to-text against whisper in this namespace. Open WebUI
              # POSTs to {base}/audio/transcriptions, which is why the server
              # runs with --inference-path /v1/audio/transcriptions rather than
              # whisper.cpp's default /inference.
              #
              # These are PersistentConfig variables and only work from here
              # because ENABLE_PERSISTENT_CONFIG is false above.
              AUDIO_STT_ENGINE: openai
              AUDIO_STT_OPENAI_API_BASE_URL: http://whisper.llm.svc.cluster.local:8080/v1
              # whisper.cpp serves without auth; the field must be non-empty.
              AUDIO_STT_OPENAI_API_KEY: sk-whisper-noauth
              AUDIO_STT_MODEL: whisper-1
              ENABLE_WEBSOCKET_SUPPORT: "true"
              WEBSOCKET_MANAGER: "redis"
              WEBSOCKET_REDIS_URL: "redis://dragonfly.database.svc.cluster.local:6379/5"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 2Gi
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Interact with your AI models
          gethomepage.dev/group: Home
          gethomepage.dev/icon: sh-open-webui.svg
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/weight: "40"
          gethomepage.dev/app: open-webui
        hostnames: ["chat.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data