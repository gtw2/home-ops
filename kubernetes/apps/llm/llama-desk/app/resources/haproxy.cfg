global
  log stdout format raw local0 info

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 3s
  # Matches LiteLLM's request_timeout (1200s). A non-streamed
  # request sends nothing back until it is done, so anything
  # shorter cuts off a long generation as idle.
  timeout client 20m
  timeout server 20m
  timeout http-request 30s

frontend llm
  bind :8080
  default_backend workstation

frontend metrics
  bind :8404
  http-request use-service prometheus-exporter if { path /metrics }
  http-request return status 200 content-type text/plain string ok if { path /healthz }

backend workstation
  # llama-server answers /health with 503 while it loads the
  # model, so a starting server stays down until it can serve.
  # fall 2 at 2s: about 4-10s to notice it went away.
  option httpchk
  http-check send meth GET uri /health
  http-check expect status 200
  default-server inter 5s fastinter 2s downinter 5s fall 2 rise 2
  # 10.10.40.30 is reserved out of Cilium's LB pool
  # (kube-system/cilium/app/networking.yaml).
  server workstation 10.10.40.30:8080 check
