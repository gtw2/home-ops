---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/node.k8s.io/runtimeclass_v1.json
#
# containerd's `nvidia` handler, registered by the Talos
# nvidia-container-toolkit extension. The reference Talos + NVIDIA DRA setup
# this follows (rothgar/homelab-flux, RTX 3060) found the driver's CDI
# injection needs it on Talos, and runs every GPU pod under it.
#
# The scheduling block is merged into every pod that names this class, so such
# a pod can only land where the handler exists. On any other node it would
# fail at sandbox creation with "no runtime for nvidia is configured".
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
scheduling:
  nodeSelector:
    node.kubernetes.io/gpu-vendor: nvidia
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
