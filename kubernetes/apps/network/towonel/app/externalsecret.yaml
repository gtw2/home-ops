---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: towonel
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: towonel-secret
    # The chart mounts this as TOWONEL_API_KEY via credentials.existingSecret.
    # This is the hub's OPERATOR key (/data/operator.key on the VPS), not an
    # invite token: the operator provisions invites itself - that is what
    # TowonelTunnel.spec.tokenExpiry and its status.InviteID are for - so it
    # needs account-level API access. Upstream calls it a "personal API key"
    # and shows it as twk_xxx, which is what operator.key should look like.
    template:
      data:
        token: "{{ .TOWONEL_API_KEY }}"
  dataFrom:
    - extract:
        key: towonel
