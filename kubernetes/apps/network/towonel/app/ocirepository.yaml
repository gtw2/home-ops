---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: towonel-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # Tags here are v-prefixed, which Helm's OCI tag resolution will not sort on
  # its own - pin the exact tag rather than expecting a range to resolve.
  ref:
    tag: v1.7.1
  url: oci://ghcr.io/jacaudi/charts/towonel-operator
