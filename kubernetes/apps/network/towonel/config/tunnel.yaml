---
apiVersion: towonel.io/v1alpha1
kind: TowonelTunnel
metadata:
  name: home-ops
spec:
  apiKeySecretRef:
    name: towonel-secret
    key: token
  # NOT inert, and not geography: region is a matching label between this
  # tunnel and the edge that serves it. It must equal TOWONEL_EDGE_REGION on
  # the hub container. The enum is EU|CA with no US option, so a US-hosted VPS
  # still gets CA - set both sides to CA and leave them alone.
  region: CA
  # The invite cannot be created without at least one authorized HTTPS hostname,
  # even though everything here is UDP - the operator reports "no authorized
  # hostnames yet" and stays Pending forever otherwise. Nothing serves this over
  # HTTPS; it exists to give the invite a hostname to be scoped to.
  #
  # Wildcarded deliberately. Hostname scoping exists so multiple tenants can
  # share one hub without forging each other's routes; this hub has exactly one
  # tenant, who also owns the domain, so per-name scoping buys nothing and costs
  # an edit per game server. Keeping it to the gaming domain rather than every
  # domain still bounds what a leaked invite could claim.
  extraHostnames:
    - "*.${SECRET_GAMING_DOMAIN}"
  # Retain, not Delete: deleting this object should not tear the invite out
  # from under a running agent while we are still evaluating.
  deletionPolicy: Retain
  # No dns: block, so the DNS handoff stays Disabled and DNS stays
  # hand-written, in ../dns/dnsendpoint.yaml and beside each game server.
  # v1.10.0 made the handoff real (spec.dns.mode: DNSEndpoint CNAMEs each
  # hub-confirmed hostname to its region's edge), but on our own hub it would
  # also need an edge target (chart dns.edgeTargets or spec.dns.cnameTarget;
  # only the public hub has defaults) and spec.dns.providerSpecific with the
  # alpha-prefixed cloudflare-proxied "false" the hand-written records carry.
  # Without that, cloudflare-dns's --cloudflare-proxied publishes them proxied.
