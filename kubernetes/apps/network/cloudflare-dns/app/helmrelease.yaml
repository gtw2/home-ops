---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudflare-dns
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret cloudflare-dns-secret
            key: api-token
    extraArgs:
      # external-dns v0.22.0 changed the DEFAULT --annotation-prefix from
      # external-dns.alpha.kubernetes.io/ to external-dns.kubernetes.io/, which
      # silently orphaned every annotation in this repo. The visible failure was
      # the envoy-external Gateway's target=external.${SECRET_DOMAIN} going
      # unread, so external-dns fell back to the Gateway's LoadBalancer address
      # and tried to write proxied A records at 10.10.40.8. Cloudflare rejects a
      # proxied record on RFC1918 (code 9003), and policy=sync had already
      # deleted the CNAMEs, so every external name stopped resolving.
      # Pinning the old prefix restores the pre-bump behaviour; migrating the
      # ~18 annotations to the new prefix is the eventual fix, not this one.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
      - --cloudflare-dns-records-per-page=1000
      # SRV is not managed by default - the default set is A, AAAA, CNAME - so
      # the minecraft _minecraft._tcp records were ignored regardless of how
      # they were written. The flag REPLACES the default list rather than adding
      # to it, so the three defaults have to be restated here.
      #
      # This is the second half of the SRV fix; the first was the trailing dot
      # on the target, without which external-dns rejects the endpoint outright.
      # Either alone leaves the records silently absent.
      - --managed-record-types=A,AAAA,CNAME,SRV
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=envoy-external
    triggerLoopOnEvent: true
    policy: sync
    sources: ["crd", "gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}", "${SECRET_GAMING_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
