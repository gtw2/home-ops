---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      server:
        strategy: RollingUpdate
        annotations:
          secret.reloader.stakater.com/reload: immich-secret
          configmap.reloader.stakater.com/reload: immich-configmap
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 3003
            runAsGroup: 3003
            runAsNonRoot: true
            fsGroup: 3003
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: immich-secret
            # Every Immich container gets this. The server decodes uploaded
            # photos and videos (sharp/libvips, ffmpeg, exiftool), so it is
            # where an exploited parser would run, with write access to the
            # whole photos dataset. The pods already run as uid 3003 with no
            # effective capabilities, but both images ship Debian's setuid
            # binaries (su, passwd, mount, chfn and others; checked in
            # v3.4.2). allowPrivilegeEscalation false stops those from
            # raising privileges, and dropping ALL empties the bounding set;
            # Immich uses neither. The root filesystem stays writable: the
            # paths Immich writes outside its volumes were not mapped.
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          main:
            securityContext: *securityContext
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
            env:
              IMMICH_CONFIG_FILE: /config/immich-config.yaml
            envFrom:
              - secretRef:
                  name: immich-secret
              - configMapRef:
                  name: immich-configmap
      machine-learning:
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: immich-secret
          configmap.reloader.stakater.com/reload: immich-configmap
        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 3003
            runAsGroup: 3003
            runAsNonRoot: true
            fsGroup: 3003
            fsGroupChangePolicy: OnRootMismatch
        containers:
          main:
            securityContext: *securityContext
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
            envFrom:
              - secretRef:
                  name: immich-secret
              - configMapRef:
                  name: immich-configmap
            env:
              MPLCONFIGDIR: "/cache/matplotlib"
              # v3.3 re-exports the same models in an optimized format; the ML speed
              # and memory gains only apply to these. Outputs are numerically
              # equivalent, so no jobs need re-running. Upstream makes v2 the
              # default in a later release, after which this can be dropped.
              MACHINE_LEARNING_MODEL_REVISION: v2

    service:
      server:
        controller: server
        ports:
          http:
            port: &port 2283
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003

    route:
      external:
        hostnames: ["photos.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: server
                port: *port
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Immich
          gethomepage.dev/icon: immich.png
          gethomepage.dev/weight: "30"
          gethomepage.dev/widget.type: immich
          gethomepage.dev/widget.url: http://immich-server.media:2283
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_IMMICH_TOKEN}}`}}"
          gethomepage.dev/widget.version: "2"

    persistence:
      config:
        type: secret
        name: immich-config-secret
        advancedMounts:
          server:
            main:
              - path: /config
      matplotlib:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /config/matplotlib
      library:
        type: nfs
        server: tank.internal
        path: /mnt/silo/media/photos
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/upload
      machine-learning-cache:
        existingClaim: immich-machine-learning-cache
        advancedMounts:
          machine-learning:
            main:
              - path: /cache
                subPath: cache
              - path: /.cache
                subPath: dotCache
      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            main:
              - path: /usr/src/app/.reverse-geocoding-dump
                subPath: geocoding
              - path: /usr/src/app/.transformers_cache
                subPath: transformers
