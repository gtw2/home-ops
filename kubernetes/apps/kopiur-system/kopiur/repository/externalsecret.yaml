---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-repository-secret
    template:
      engineVersion: v2
      data:
        # A filesystem backend needs only the repository encryption password -
        # no object-store credentials. Same 1Password item VolSync used, so this
        # opens the existing repository rather than creating a new one.
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: kopia
