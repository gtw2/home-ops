---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  backend:
    filesystem:
      # Mount path INSIDE the mover pod - not a path on the NAS.
      path: /repository
      volume:
        nfs:
          server: nas.internal
          path: /mnt/sega/VolsyncKopia
  create:
    # The repository already exists and holds the full backup history. Connect
    # only: a failed connect must be loud, never a silently-fresh empty repo.
    enabled: false
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      # A ClusterRepository is cluster-scoped, so every Secret ref needs an
      # explicit namespace (webhook-enforced), and credentialProjection needs it
      # set to know what to copy.
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  credentialProjection:
    # Owner-side gate; each SnapshotPolicy still opts in.
    allowed: true
  health:
    probe:
      # Defaults (30m x 3) mean up to 90 minutes before the breaker opens, and
      # every policy whose slot falls in that window mints a mover Job that can
      # only hang on the dead NFS mount. 5m x 3 detects in roughly 15-20 minutes
      # (a deadline-killed probe adds its own duration on top of the interval)
      # for the cost of one short connect Job every 5 minutes.
      #
      # Threshold stays at 3 deliberately: a single slow connect over a large
      # index must not degrade the repository.
      enabled: true
      interval: 5m
      failureThreshold: 3
      onFailure: Degrade
  identityDefaults:
    # kopia files snapshots under username@hostname:path. VolSync wrote every
    # source as <app>@<namespace>:/data - these expressions reproduce the
    # username and hostname halves; the path half comes from each policy's
    # sources[].sourcePathOverride. All three must match for kopiur to adopt the
    # existing history instead of starting a new lineage.
    hostnameExpr: "namespace"
    usernameExpr: "policyName"
  allowedNamespaces:
    list:
      # The operator projects its own managed Maintenance into the operator
      # namespace, and the admission webhook gates that on this list too - omit
      # it and maintenance never applies, so kopia storage is never reclaimed.
      - kopiur-system
      - database
      - default
      - downloads
      - games
      - home-automation
      - media
      - storage
  moverDefaults:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
