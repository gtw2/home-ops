---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  install:
    # kopiur ships its 9 CRDs in the chart's crds/ directory, which Helm installs
    # once and never touches again. This is alpha software whose CRD surface may
    # still change between releases, so let Flux replace them on upgrade.
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    features:
      credentialProjection:
        # Required for SnapshotPolicy.spec.credentialProjection: lets the operator
        # copy the ClusterRepository's KOPIA_PASSWORD Secret from kopiur-system into
        # each mover Job's namespace, instead of an ExternalSecret per app.
        enabled: true
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
