---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: github://gtw2/home-ops
      statusChecks: true
      prComments: true
      publicUrl: https://{{ .Release.Name }}.${SECRET_DOMAIN}
      mcp: true
      verifyImages: true
    secret:
      existingSecret: konflate-webhook-token-secret
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.${SECRET_DOMAIN}"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 1Gi
        # Since 0.7, konflate never prunes its source cache (config.cacheTtl
        # does nothing), and the cache is an emptyDir. Past this limit the
        # pod is evicted and comes back with an empty cache. On 0.6.6 the
        # cache was 26Mi and /tmp 15Mi after ~20h of uptime (2026-11-28).
        ephemeral-storage: 2Gi
