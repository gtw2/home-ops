---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app matter-server
  namespace: &namespace home-automation
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/home-automation/matter-server/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      # matter-server writes 0600 files as root, so no unprivileged UID can read
      # them - this needs a root mover, which is gated by the privileged-movers
      # opt-in annotation on the home-automation namespace.
      KOPIUR_PUID: "0"
      KOPIUR_PGID: "0"
      KOPIUR_RUNASNONROOT: "false"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false