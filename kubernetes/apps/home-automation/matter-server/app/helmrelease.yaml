---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  interval: 15m
  values:
    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/home-assistant-libs/python-matter-server
              tag: 8.1.0@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
            env:
              TZ: ${TIMEZONE}
              MATTER_SERVER__INSTANCE_NAME: "{{ .Release.Name }}"
              MATTER_SERVER__PORT: &port 5580
              MATTER_SERVER__APPLICATION_URL: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
              MATTER_SERVER__LOG_LEVEL: info
            args:
              - --storage-path=/data
              - --primary-interface=net1
              - --log-level=debug
              - --log-level-sdk=info
            resources:
              limits:
                memory: 256Mi
        # Thread devices live on the mesh ULA prefix, reachable only via the
        # border router - not via the VLAN 20 gateway the default route points
        # at. The border router advertises that prefix in an RA Route
        # Information Option, but the pod's accept_ra_rt_info_max_plen is 0, so
        # the kernel discards the option and Thread traffic falls through to the
        # default route and is dropped. Commissioning a Thread device hangs with
        # no error; Wi-Fi Matter devices are unaffected.
        #
        # The sysctl is the right fix and cannot be set here: /proc/sys is
        # read-only inside the container under hostUsers: false, and a node-level
        # value does not propagate into the pod netns. Setting it through the
        # kubelet needs allowedUnsafeSysctls on every node, so this installs the
        # route directly instead.
        #
        # Both addresses are therefore pinned and will need updating if the
        # Thread network re-forms with a new prefix or the border router is
        # replaced. Symptom is the same silent commissioning hang; compare
        # `ip -6 route get <device addr>` against the border router's link-local.
        # Reuses the app image purely for its iproute2 - nothing extra to pull.
        initContainers:
          thread-route:
            image: *image
            command:
              - sh
              - -c
              - ip -6 route replace fda4:a6bf:6c9e::/64 via fe80::1cd2:1436:bde3:3b0a dev net1
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["192.168.20.11/24"],
            "mac": "aa:2e:f9:93:40:5b"
          }]
      hostUsers: false
      securityContext:
        runAsNonRoot: false # Must be run as root user
        runAsUser: 0        # Must be run as root user
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [34]
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: [*host]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      tmp:
        type: emptyDir