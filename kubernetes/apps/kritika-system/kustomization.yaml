---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Its own namespace: kritika's Role can create, patch and delete every Secret
# in the release namespace (runner Jobs run there), so nothing else lives here.
namespace: kritika-system
components:
  - ../../components/common
resources:
  - ./kritika/ks.yaml
