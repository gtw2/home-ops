---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-secret
    template:
      engineVersion: v2
      # No KRITIKA_* keys: this Secret is loaded with envFrom, and kritika reads
      # any KRITIKA_* variable as configuration. The configuration file and the
      # chart's `config` name these variables instead.
      data:
        # Local admin: the way into a fresh instance, and in when SSO is down.
        ADMIN_PASSWORD: "{{ .KRITIKA_ADMIN_PASSWORD }}"
        # Authentik
        OIDC_CLIENT_SECRET: "{{ .KRITIKA_OIDC_CLIENT_SECRET }}"
        # GitHub App. The private key is stored base64-encoded in 1Password so
        # the PEM's newlines survive the trip.
        GITHUB_APP_CLIENT_ID: "{{ .KRITIKA_GITHUB_APP_CLIENT_ID }}"
        GITHUB_APP_PRIVATE_KEY: "{{ .KRITIKA_GITHUB_APP_PRIVATE_KEY_B64 | b64dec }}"
        GITHUB_APP_WEBHOOK_SECRET: "{{ .KRITIKA_GITHUB_APP_WEBHOOK_SECRET }}"
        # Minted by the LiteLLMVirtualKey in the llm namespace and pushed here
        # through 1Password.
        LITELLM_API_KEY: "{{ .LITELLM_KRITIKA_API_KEY }}"
        # toolhive-embed takes no key, but a provider needs a reference to one.
        EMBEDDER_API_KEY: unused
  dataFrom:
    - extract:
        key: kritika
    - extract:
        key: litellm
