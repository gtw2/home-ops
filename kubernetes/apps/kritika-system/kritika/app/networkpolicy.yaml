---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# Supplements the chart's policies. Cilium allows the union of every policy
# that selects a pod, so each rule here widens what the chart allows; keep them
# narrow (named peers, and ports where the direction allows it).
#
# Ingress, for replies: on this cluster's netkit datapath, a reply to a
# connection made through a Service reaches the pod's ingress policy with its
# source already rewritten to the Service IP. That misses the connection Cilium
# recorded against the backend pod, so the reply is dropped as "Policy denied"
# (seen for Postgres's SYN-ACK and for kube-dns answers). Allowing ingress from
# each peer the pod talks to lets those replies through.
#
# Egress, for one extra destination: kritika serve reaches Authentik through
# envoy-external (see the rule below), which the chart's egress ports miss.
#
# The reference deployment (onedr0p/home-ops) runs veth and needs none of this.
#
# Pods are selected by component as well as name: runner pods also carry
# app.kubernetes.io/name=kritika, and must not pick up the serve pods' rules.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kritika-replies
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kritika
      app.kubernetes.io/instance: kritika
      app.kubernetes.io/component: server
  ingress:
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: kritika-postgres
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm
            app.kubernetes.io/name: litellm
            app.kubernetes.io/instance: litellm
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm
            app: toolhive-embed
        - matchLabels: &envoyExternal
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
    # kritika serve creates and watches the runner Jobs through the API server.
    - fromEntities:
        - kube-apiserver
  egress:
    # OIDC discovery and token exchange: sso.${SECRET_DOMAIN} resolves to the
    # envoy-external LoadBalancer IP in-cluster, and Cilium checks egress
    # against the translated backend port (10443), not the 443 the chart allows.
    - toEndpoints:
        - matchLabels: *envoyExternal
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# The same for runner pods, which the chart denies all ingress: their replies
# come from Postgres, kube-dns and kritika's egress gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kritika-runner-replies
spec:
  endpointSelector:
    matchLabels:
      kritika.home-operations.com/role: runner
  ingress:
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: kritika-postgres
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: kritika
            app.kubernetes.io/component: server
