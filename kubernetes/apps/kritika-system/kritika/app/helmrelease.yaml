---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kritika/main/charts/kritika/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kritika
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # A changed Secret does not roll the pods on its own.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      # The one public URL: the dashboard, and GitHub's webhook at /hooks/github.
      webUrl: https://kritika.${SECRET_DOMAIN}
      authAdminPassword:
        valueFrom:
          secretKeyRef: { name: kritika-secret, key: ADMIN_PASSWORD }
      authOidcName: Authentik
      authOidcIssuer: https://sso.${SECRET_DOMAIN}/application/o/kritika/
      # Not a secret, and the chart takes it only as a string: set the same
      # Client ID on the Authentik provider.
      authOidcClientId: kritika
      authOidcClientSecret:
        valueFrom:
          secretKeyRef: { name: kritika-secret, key: OIDC_CLIENT_SECRET }
      authOidcScopes: openid,email,profile
      authOidcRolesClaim: groups
      # Fails closed: anyone outside the group is refused.
      authOidcRoleMappingExpr: '"authentik Admins" in roles ? "admin" : ""'
    configFile:
      apps:
        github:
          accounts: [gtw2]
          clientId: { env: GITHUB_APP_CLIENT_ID }
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        # The Qwen model on the Framework, through LiteLLM. Local, so it reports
        # no cost; tokens still count against the limits.
        litellm:
          type: openai
          baseUrl: http://litellm.llm.svc.cluster.local:4000/v1
          apiKey: { env: LITELLM_API_KEY }
          # One slot behind the proxy: a busy server answers 5xx/429, which a
          # retry outlasts.
          retries: 2
        embedder:
          type: openai
          baseUrl: http://toolhive-embed.llm.svc.cluster.local:8080/v1
          apiKey: { env: EMBEDDER_API_KEY }
      embedding:
        model: embedder/toolhive-embed
        # Qwen3-Embedding-0.6B
        dims: 1024
        # toolhive-embed is llama.cpp with a 32768-token context shared by 16
        # slots; kritika's defaults (64 inputs, 200k characters) can overrun it.
        maxBatch: 8
        maxBatchChars: 60000
        # A small embedder scores nearly everything above the 0.5 default.
        similarFloor: 0.7
      review:
        model: litellm/llama-strix-chat
      limits:
        # Model calls at once, per model. The default 2 does not exist on a
        # one-slot server: two reviews' conversations took turns on it, each
        # step evicting the other's context (148 such requests in 72h of
        # llama-strix logs, 2026-10-07). From 0.0.45 a large review's parts
        # also run in these slots, so every split review would interleave the
        # same way, and a step queued behind another's 16384-token generation
        # (~7.5m at 36 tok/s) can pass the 5m mark kritika treats as a
        # timeout. At 1 the parts run one after another, which is all the
        # slot allows anyway. It also caps index embedding at one slot, which
        # a review's similar-code lookup can wait behind.
        concurrency: 1
      agent:
        # For the renovate-review skill: upstream release notes through gh,
        # rendering through flate (runner.tools), and jq/yq/rg to read this
        # repository. No curl: egress below is only what flate fetches.
        commands: [gh, flate, jq, yq, rg]
        # The 20m default cut reviews off mid-run on the local model: every
        # step succeeded, they just added up (PRs #1676 and #1677). The runner
        # deadline follows this plus 5m on its own (true only while parts is 1;
        # split, it is rounds of parts x timeout, capped at 2h35m).
        timeout: 45m
        # 0.0.45 splits a diff over 64 KiB into up to 8 parts by default, each
        # taking another slot of the review model. That model is one llama.cpp
        # slot (parallelSlots: 1 in llm/litellm/app/qwen3.8-flash-next.yaml), so
        # parts would queue behind each other and end the review incomplete.
        parts: 1
      egress:
        # Where flate fetches this repository's chart sources, beyond the
        # github.com and api.github.com the app allows. Exact hosts rather than
        # "*": a PR's head could otherwise point a source anywhere. Each
        # registry's token realm is on its own host. Re-check when a source
        # moves to a new registry.
        allow:
          # OCI charts: ghcr.io redirects blobs to pkg-containers, quay.io to
          # cdnNN.quay.io, gsoci.azurecr.io (silence-operator) to Azure blob
          # storage, whose account name varies by replica.
          - ghcr.io
          - pkg-containers.githubusercontent.com
          - quay.io
          - "*.quay.io"
          - mirror.gcr.io
          - gsoci.azurecr.io
          - "*.blob.core.windows.net"
          - registry.erwanleboucher.dev
          # HelmRepository indexes; external-dns and metrics-server tarballs
          # are GitHub release assets.
          - kubernetes-sigs.github.io
          - rocm.github.io
          - release-assets.githubusercontent.com
          # dragonfly-operator's CRD, a remote kustomize resource.
          - raw.githubusercontent.com
      trigger:
        # Konflate posts its image check and blast radius within a minute or
        # so of a push; wait for it so the review can read it.
        settle: 2m
        exclude:
          # Renovate merges these itself (.renovate/autoMerge.json5), so a
          # review would only hold the local model's single slot.
          - name: automerge
            expr: 'pr.body.contains("**Automerge**: Enabled.")'
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      # Without these, runner pods are BestEffort with no memory limit. A
      # runner's flate cache always starts cold, and a cold one-namespace
      # render of this tree peaked at ~1.7GiB (kritika, cilium; flate 0.6.5).
      resources:
        requests: { cpu: 10m, memory: 512Mi }
        limits: { memory: 3Gi }
      # Statically linked; /flate in the image, the default path and command.
      tools:
        - name: flate
          image: ghcr.io/home-operations/flate:0.6.5@sha256:e0e2d2de97539b3141977e8bb3bbb50ea5c5afe89477950e5fa972c9862478da
    networkPolicy:
      enabled: true
      type: cilium
      # 443 for GitHub; 4000 for LiteLLM and 8080 for toolhive-embed, which
      # kritika serve calls on the runners' behalf. Runner pods only ever reach
      # DNS, Postgres and the gateway.
      egressPorts: [443, 4000, 8080]
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - kritika.${SECRET_DOMAIN}
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          folder: LLM
          matchLabels:
            grafana.internal/instance: grafana
