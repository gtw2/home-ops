---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kritika/main/charts/kritika/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  interval: 1h
  # The 5m default is too short under Recreate: the old pod's drain alone can
  # take 200s (terminationGracePeriodSeconds), then the new digests pull and
  # the leader runs migrations. A timeout triggers the rollback remediation,
  # and rolling back across a queue change strands jobs in Postgres
  # (upstream docs/database.md, "Queue upgrades and rollbacks").
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: kritika
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # One replica, so a rolling update buys little, and it overlaps the old
    # pod's workers with the new leader's migrations. Upstream says to stop
    # older replicas first (docs/database.md, "Queue upgrades and rollbacks",
    # 0.0.65). Webhooks missed in the gap are caught by the 10m PR poll.
    # Helm merges maps, so rollingUpdate must be nulled.
    strategy:
      type: Recreate
      rollingUpdate: null
    # A changed Secret does not roll the pods on its own.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      # The one public URL: the dashboard, and GitHub's webhook at /hooks/github.
      webUrl: https://kritika.${SECRET_DOMAIN}
      # Both secret references resolve from kritika-secret through envFrom.
      auth:
        admin:
          password: { env: ADMIN_PASSWORD }
        oidc:
          name: Authentik
          issuer: https://sso.${SECRET_DOMAIN}/application/o/kritika/
          # Not a secret, so inline: set the same Client ID on the Authentik
          # provider.
          clientId: kritika
          clientSecret: { env: OIDC_CLIENT_SECRET }
          scopes: [openid, email, profile]
          rolesClaim: groups
          # Fails closed: anyone outside the group is refused.
          roleMappingExpr: '"authentik Admins" in roles ? "admin" : ""'
      apps:
        github:
          accounts: [gtw2]
          clientId: { env: GITHUB_APP_CLIENT_ID }
          privateKey: { env: GITHUB_APP_PRIVATE_KEY }
          webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
      providers:
        # The Qwen model on the Framework, through LiteLLM. Local, so it reports
        # no cost; tokens still count against the limits.
        litellm:
          type: openai
          baseUrl: http://litellm.llm.svc.cluster.local:4000/v1
          apiKey: { env: LITELLM_API_KEY }
          # Few slots behind the proxy (gufo's 2 sessions, shared with every
          # other client): a busy server answers 5xx/429, which a retry
          # outlasts.
          retries: 2
        embedder:
          type: openai
          baseUrl: http://toolhive-embed.llm.svc.cluster.local:8080/v1
          apiKey: { env: EMBEDDER_API_KEY }
      embedding:
        model: embedder/toolhive-embed
        # Qwen3-Embedding-0.6B
        dims: 1024
        # toolhive-embed is llama.cpp with a 32768-token context shared by 16
        # slots; kritika's defaults (64 inputs, 200k characters) can overrun it.
        maxBatch: 8
        maxBatchChars: 60000
        # A small embedder scores nearly everything above the 0.5 default.
        similarFloor: 0.7
      review:
        model: litellm/llama-strix-chat
      limits:
        # Model calls at once, per model: one per gufo session. llama-strix
        # serves 2, each with the full 262144-token context reserved at load
        # (load_completed sessions=2, 2026-10-17), so two reviews no longer
        # evict each other's context as they did on the one-slot llama.cpp
        # fork (148 such requests in 72h, 2026-10-07). Two at once run at
        # ~25-42 tok/s each against ~37-42 alone (gufo file's table). The
        # sessions are shared, so while two reviews run, Open WebUI and the
        # agents queue in gufo (--max-pending) rather than fail.
        concurrency: 2
      agent:
        # The run tool offers the runner image's curl, fd, gh, jq, rg and yq
        # plus flate from .kritika/mise.toml (0.0.70 removed agent.commands).
        # curl can no longer be withheld, so egress below is what bounds it.
        # The 20m default cut reviews off mid-run on the local model: every
        # step succeeded, they just added up (PRs #1676 and #1677). The runner
        # deadline follows this plus 5m on its own (true only while parts is 1;
        # split, it is rounds of parts x timeout, capped at 2h35m).
        timeout: 45m
        # 0.0.45 splits a diff over 64 KiB into up to 8 parts by default, each
        # taking another slot of the review model. That model was one llama.cpp
        # slot when this was set, so parts queued behind each other and ended
        # the review incomplete. It now serves 2 gufo sessions
        # (llm/litellm/app/qwen3.8-flash-next-gufo.yaml), but those are shared
        # with Open WebUI and the agents, so parts above 1 would take both.
        parts: 1
      egress:
        # Where flate fetches this repository's chart sources, beyond the
        # github.com and api.github.com the app allows. Exact hosts rather than
        # "*": a PR's head could otherwise point a source anywhere. Each
        # registry's token realm is on its own host. Re-check when a source
        # moves to a new registry.
        allow:
          # OCI charts: ghcr.io redirects blobs to pkg-containers, quay.io to
          # cdnNN.quay.io, gsoci.azurecr.io (silence-operator) to Azure blob
          # storage, whose account name varies by replica.
          - ghcr.io
          - pkg-containers.githubusercontent.com
          - quay.io
          - "*.quay.io"
          - mirror.gcr.io
          - gsoci.azurecr.io
          - "*.blob.core.windows.net"
          - registry.erwanleboucher.dev
          # HelmRepository indexes; external-dns and metrics-server tarballs
          # are GitHub release assets.
          - kubernetes-sigs.github.io
          - rocm.github.io
          - release-assets.githubusercontent.com
          # dragonfly-operator's CRD, a remote kustomize resource.
          - raw.githubusercontent.com
      trigger:
        # 0.0.70 removed the settle delay: a review now starts as soon as the
        # slot is free, so Konflate's image check and blast radius (posted a
        # minute or so after a push) may not be there yet when it reads them.
        exclude:
          # Renovate merges these itself (.renovate/autoMerge.json5), so a
          # review would only hold the local model's single slot.
          - name: automerge
            expr: 'pr.body.contains("**Automerge**: Enabled.")'
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      # Without these, runner pods are BestEffort with no memory limit. A
      # runner's flate cache always starts cold, and a cold one-namespace
      # render of this tree peaked at ~1.7GiB (kritika, cilium; flate 0.6.5).
      # Pod-level since 0.0.76, so they bound the run tool's commands too.
      podTemplate:
        spec:
          resources:
            requests: { cpu: 10m, memory: 512Mi }
            limits: { memory: 3Gi }
    networkPolicy:
      enabled: true
      type: cilium
      # 443 for GitHub; 4000 for LiteLLM and 8080 for toolhive-embed, which
      # kritika serve calls on the runners' behalf. Runner pods only ever reach
      # DNS, Postgres and the gateway.
      egressPorts: [443, 4000, 8080]
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - kritika.${SECRET_DOMAIN}
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        # The chart's 600s/15m fires on normal queueing. With limits.concurrency
        # at 1, over 7 days to 2026-10-13 the median review took ~13m and 37
        # of 82 took over 15m, so a batch of three Renovate PRs waited past it.
        # One review can run 50m (agent.timeout plus the runner's 5m), so an
        # hour's wait held for 30m means a stall, not a queue.
        queueAgeSeconds: 3600
        queueDelayFor: 30m
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          folder: LLM
          matchLabels:
            grafana.internal/instance: grafana
