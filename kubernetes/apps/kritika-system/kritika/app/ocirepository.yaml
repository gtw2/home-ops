---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kritika
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Pre-1.0 and moving fast: config and schema change between releases, so
    # read the changelog before merging a bump. 0.0.45 turned on split reviews
    # (agent.parts, default 8); the HelmRelease keeps them off with parts: 1.
    # 0.0.68 dropped configFile and the flat auth* keys: the whole application
    # YAML now sits under config, with auth nested as config.auth. 0.0.70
    # removed agent.commands and trigger.settle, and unknown config keys fail
    # startup; 0.0.73 removed runner.tools. 0.0.76 moved runner.resources to
    # runner.podTemplate.spec.resources, and the old key is silently ignored.
    # 0.0.87 stopped reading the merge base's .kritika/mise.toml and
    # mise.lock: flate now comes from the tools key of .kritika.yaml.
    # 0.0.107 removed mise from the runner: that tools key takes only
    # aqua:<owner>/<repo> packages pinned to a release's tag, and any other
    # key fails the file. 0.0.116 removed database.runner, and the old key is
    # silently ignored: runners hold no database credential and report
    # through the gateway. Its migration 0054 revokes the runner role's
    # grants; upstream says to delete the role's DatabaseRole and Secret after
    # the upgrade, not with it.
    tag: 0.0.116
  url: oci://ghcr.io/home-operations/charts/kritika
