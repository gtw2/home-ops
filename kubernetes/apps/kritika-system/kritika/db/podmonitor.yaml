---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
# CNPG deprecates the Cluster's monitoring.enablePodMonitor in favour of a
# PodMonitor you create. The relabelings match the other clusters, so the
# CloudNativePG dashboard picks this one up.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kritika-postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: kritika-postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      metricRelabelings:
        - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
        - { regex: cluster, action: labeldrop }
