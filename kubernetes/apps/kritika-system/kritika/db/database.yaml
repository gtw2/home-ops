---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kritika
spec:
  cluster:
    name: kritika-postgres
  name: kritika
  owner: kritika
  extensions:
    - name: vector
      ensure: present
    # CNPG installs this version, or updates the extension to it when it
    # changes, so keep it in step with the vchord-scratch tag in cluster.yaml.
    - name: vchord
      version: "1.1.1"
      ensure: present
