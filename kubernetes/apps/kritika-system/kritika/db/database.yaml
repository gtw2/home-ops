---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kritika
spec:
  cluster:
    name: kritika-postgres
  name: kritika
  owner: kritika
  extensions:
    - name: vector
      ensure: present
    # CNPG installs this version, or updates the extension to it when it
    # changes, so keep it in step with the vchord image tag in cluster.yaml,
    # and change it only once both instances run that image. Renovate raises
    # it in a PR of its own, beside the image's: merge the image's first.
    - name: vchord
      # renovate: datasource=docker depName=ghcr.io/home-operations/vchord
      version: "1.3.0"
      ensure: present
