---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
# Follows kritika's CloudNativePG guide: https://kritika.home-operations.com/database/
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm@sha256:2f690a4072bd00715c579cd19d0ba41599557687052ecd149560e673f77ce02a
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  # Update the standby first, then switch over to it, rather than restart the
  # primary in place. This rejects an update that changes the image and the
  # Postgres parameters at once: apply them one at a time.
  primaryUpdateMethod: switchover
  affinity:
    # A node-local storage class with both instances on one node would take
    # both down with that node.
    podAntiAffinityType: required
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  postgresql:
    extensions:
      # VectorChord mounted as an image volume extension, from the pgsty fork
      # that kritika's guide moved to in 0.0.123: TensorChord's releases stop
      # at 1.1.1. Change the tag first and the vchord version in database.yaml
      # once both instances run it: the new library works with the old
      # extension, and the old image has no update script to the new one.
      - name: vchord
        image:
          reference: ghcr.io/home-operations/vchord:1.5.0@sha256:97b4a1aa15b65c29fa97e84b4270cb235e7bd39e80d4a4b2e91d9fa17997566d
        # The image keeps Debian's paths rather than CNPG's default
        # /extensions/vchord/lib and /extensions/vchord/share.
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib/
        extension_control_path:
          - /usr/share/postgresql/18/
    shared_preload_libraries:
      - vchord
    # A commit waits for the standby while it is healthy, so a failover loses
    # nothing; with the standby down, writes go on without it.
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kritika-garage
        # Note: serverName version needs to be incremented
        # when recovering from an existing cnpg cluster
        serverName: kritika-postgres-v1
  bootstrap:
    initdb:
      database: kritika
      # The owner role. It must not be a superuser; the Database resource
      # creates the extensions as superuser on its behalf.
      owner: kritika
      secret:
        name: kritika-postgres-credentials
