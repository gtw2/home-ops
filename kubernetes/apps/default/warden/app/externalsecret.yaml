---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warden
  namespace: default # keep
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: warden-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # --- Discord identity ------------------------------------------------
        # The `warden` 1P item is a copy of the retired `discordgsm` one, so
        # the bot application (and its existing invite and permissions) carry
        # over. Read Message History matters: warden recovers its panels after
        # a restart by scanning recent channel history for its own marker.
        DISCORD_TOKEN: "{{ .APP_TOKEN }}"
        WARDEN_GUILD_ID: "{{ .GUILD_ID }}"

        # --- Warden's own IDs ------------------------------------------------
        # Not credentials, but they identify a private community, so they are
        # injected rather than committed.
        WARDEN_CONTROL_CHANNEL_ID: "{{ .CONTROL_CHANNEL_ID }}"
        WARDEN_GAMEMASTER_ROLE_ID: "{{ .GAMEMASTER_ROLE_ID }}"

        # --- Per-game query passwords ----------------------------------------
        # Referenced by env-var NAME from the server's config entry
        # (`query_auth_env`); the value never appears in config or annotations.
        # Adding an authed game is one line here plus one config line — no RBAC
        # change, since warden cannot read Secrets through the API at all.
        QUERYAUTH_PALWORLD: "{{ .ADMIN_PASSWORD }}"

        # --- Per-game join passwords -----------------------------------------
        # Shown on the panel as a spoiler, referenced by env-var NAME from the
        # Service's `warden.dev/password-env`. The JOIN password only — never an
        # admin one, which is why these are not QUERYAUTH_* reused. Each is
        # fetched as a single field (`data` below), not a whole item: several
        # items call it SERVER_PASSWORD, and extracting them would let the last
        # one silently win.
        JOIN_ENSHROUDED: "{{ .JOIN_ENSHROUDED }}"
        JOIN_ICARUS: "{{ .JOIN_ICARUS }}"
        JOIN_PALWORLD: "{{ .JOIN_PALWORLD }}"
        JOIN_VALHEIM: "{{ .JOIN_VALHEIM }}"
        JOIN_WINDROSE: "{{ .JOIN_WINDROSE }}"
  data:
    - secretKey: JOIN_ENSHROUDED
      remoteRef: { key: enshrouded, property: SERVER_PASSWORD }
    - secretKey: JOIN_ICARUS
      remoteRef: { key: icarus, property: SERVER_PASSWORD }
    - secretKey: JOIN_PALWORLD
      remoteRef: { key: palworld, property: SERVER_PASSWORD }
    - secretKey: JOIN_VALHEIM
      remoteRef: { key: valheim, property: SERVER_PASS }
    - secretKey: JOIN_WINDROSE
      remoteRef: { key: windrose, property: SERVER_PASSWORD }
  dataFrom:
    - extract:
        key: warden # APP_TOKEN, GUILD_ID, CONTROL_CHANNEL_ID, GAMEMASTER_ROLE_ID
    - extract:
        key: palworld # reuse the game's existing item (ADMIN_PASSWORD)
