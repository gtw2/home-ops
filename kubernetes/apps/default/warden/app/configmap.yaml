---
# The shape of the deployment, and nothing that identifies it.
#
# Every Discord ID arrives from warden-secret via envFrom — see
# externalsecret.yaml. Nothing here is sensitive, deliberately: a guild,
# channel and role ID together identify a private community, and git history
# is forever.
apiVersion: v1
kind: ConfigMap
metadata:
  name: warden-config
  namespace: default # keep
data:
  config.yaml: |
    poll_interval: 30            # seconds between reconcile ticks
    discovery_interval: 120      # seconds between annotation scans
    cooldown_seconds: 300        # 5 min dwell before the opposite action
    start_timeout_seconds: 300   # 5 min to become ready, else Failed
    log_level: INFO

    # Namespaces scanned for annotated Services. Read-only, and bounded by the
    # read Role, which only covers `games`.
    discover_namespaces:
      - games

    # Empty on purpose. Every server comes from `warden.dev/*` annotations on
    # its own Service (see the warden repo's discovery.md), so adding a game is
    # one annotation in that game's HelmRelease rather than an edit here too,
    # and removing the annotation cleans up the panel by itself.
    #
    # A server may still be listed here if it has no annotated Service.
    # Discovery wins on a key collision, since the annotation sits next to the
    # workload it describes.
    #
    # Channels: a server with no `warden.dev/channel-ids` lands in
    # WARDEN_CONTROL_CHANNEL_ID. To post one to several channels, or to a
    # game-specific channel, list the ids in that annotation — but note the
    # annotation lives in git, so use a `${VAR}` substituted from the SOPS
    # `cluster-secrets` Secret rather than writing an id in plaintext.
    servers: []
