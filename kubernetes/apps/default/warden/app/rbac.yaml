---
# Least-privilege access for warden, in the `games` namespace only.
#
#   READ  — derive lifecycle state and discover annotated Services. No writes.
#   SCALE — the only mutation warden makes: patch /scale. Namespace-wide, so
#           making a game controllable is an annotation and not an RBAC edit.
#           The 0/1 ceiling is enforced by the ValidatingAdmissionPolicy in
#           ../guard, not here — RBAC can express which resources, not which
#           values.
#
# The ServiceAccount itself is created by the HelmRelease
# (`serviceAccount: { warden: {} }`), matching how homepage does it.
#
# A full compromise of the bot pod yields exactly: toggle games workloads
# between 0 and 1 replicas, plus the query passwords already in its own env.
# It cannot exec, cannot read any Secret through the API, cannot create or
# delete anything, and cannot touch another namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden-read
  namespace: games # keep — these grant access to the game workloads
  labels:
    app.kubernetes.io/instance: warden
    app.kubernetes.io/name: warden
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"] # annotation-driven discovery (phase 5)
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"] # optional: richer Failed-state diagnostics
    verbs: ["get", "list", "watch"]
  # NOTE: no `secrets` rule, deliberately. Query passwords reach the bot as
  # environment variables from warden-secret via envFrom, so warden has zero
  # Kubernetes access to read Secrets.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden-scale
  namespace: games # keep
  labels:
    app.kubernetes.io/instance: warden
    app.kubernetes.io/name: warden
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warden-read
  namespace: games # keep
  labels:
    app.kubernetes.io/instance: warden
    app.kubernetes.io/name: warden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: warden-read
subjects:
  - kind: ServiceAccount
    name: warden
    namespace: default # keep — the SA lives with the bot, the Role with the games
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warden-scale
  namespace: games # keep
  labels:
    app.kubernetes.io/instance: warden
    app.kubernetes.io/name: warden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: warden-scale
subjects:
  - kind: ServiceAccount
    name: warden
    namespace: default # keep
