---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# kritika refuses to start unless three roles are kept apart: the owner runs
# migrations, the app role serves (and must not own the tables, so row-level
# security applies), and the runner role is handed to runner Jobs. Each Secret
# is basic-auth for CNPG plus the `uri` key the chart reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-credentials
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: kritika
        password: "{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}"
        uri: postgres://kritika:{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}@kritika-postgres-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-app
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: kritika_app
        password: "{{ .KRITIKA_POSTGRES_APP_PASSWORD }}"
        uri: postgres://kritika_app:{{ .KRITIKA_POSTGRES_APP_PASSWORD }}@kritika-postgres-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-runner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: kritika_runner
        password: "{{ .KRITIKA_POSTGRES_RUNNER_PASSWORD }}"
        uri: postgres://kritika_runner:{{ .KRITIKA_POSTGRES_RUNNER_PASSWORD }}@kritika-postgres-rw.kritika.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10
  dataFrom:
    - extract:
        key: kritika
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-garage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-postgres-garage
    template:
      engineVersion: v2
      data:
        aws-access-key-id: "{{ .AWS_ACCESS_KEY_ID }}"
        aws-secret-access-key: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: garage-cnpg
