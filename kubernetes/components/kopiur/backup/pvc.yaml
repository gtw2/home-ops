---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
  labels:
    # The existing PVCs are Bound with a VolSync ReplicationDestination
    # dataSourceRef, and PVC spec is immutable - server-side applying this over
    # them would be rejected and fail the Kustomization. IfNotPresent leaves
    # existing PVCs alone; the Restore populator below only matters when a PVC
    # is created from scratch on a rebuild.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - ${KOPIUR_ACCESSMODES:=ReadWriteOnce}
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: ${APP}
  resources:
    requests:
      storage: ${KOPIUR_CAPACITY:=5Gi}
  storageClassName: ${KOPIUR_STORAGECLASS:=ceph-block}
