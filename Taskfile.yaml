---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

set: [pipefail]
shopt: [globstar]

# OP_CONNECT_HOST / OP_CONNECT_TOKEN for the sentinel playbook's 1Password
# lookups. Loaded here because task forbids dotenv in included Taskfiles, and
# because mise's environment is not reliably present under task - which is why
# KUBECONFIG and SOPS_AGE_KEY_FILE are restated in env: below. A missing file is
# ignored, so a fresh clone is unaffected.
dotenv: ['.secrets.env']

vars:
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos'
  PRIVATE_DIR: '{{.ROOT_DIR}}/.private'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/clusterconfig/talosconfig'

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig'
  SOPS_AGE_KEY_FILE: '{{.ROOT_DIR}}/age.key'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  bootstrap: .taskfiles/bootstrap
  kubernetes: .taskfiles/kubernetes
  llm: .taskfiles/llm
  minecraft: .taskfiles/minecraft
  sentinel: .taskfiles/sentinel
  talos: .taskfiles/talos
  volsync: .taskfiles/volsync

tasks:

  default: task --list

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux
