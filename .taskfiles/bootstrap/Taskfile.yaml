---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster
    dir: '{{.TALOS_DIR}}'
    # Assumes talsecret.sops.yaml and clusterconfig/talosconfig already exist.
    # Creating them from scratch is still an open item — see docs/talos.md.
    cmds:
      - for f in nodes/*.yaml; do
          n=$(basename "$f" .yaml);
          ip=$(yq '.address | split("/") | .[0]' "$f");
          task talos:render NODE="$n" | talosctl --nodes "$ip" apply-config --insecure --file /dev/stdin;
        done
      - until talosctl --nodes {{.BOOTSTRAP_IP}} bootstrap; do sleep 10; done
      - until talosctl --nodes {{.BOOTSTRAP_IP}} kubeconfig {{.ROOT_DIR}} --force; do sleep 10; done
    vars:
      BOOTSTRAP_IP:
        sh: yq '.address | split("/") | .[0]' {{.TALOS_DIR}}/nodes/talos-1.yaml
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/talsecret.sops.yaml
      - test -f {{.TALOS_DIR}}/machineconfig.yaml.j2
      - which minijinja-cli talosctl sops yq

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}
