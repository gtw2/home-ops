[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
# Gitignored. Holds OP_CONNECT_HOST / OP_CONNECT_TOKEN, which the ansible
# 1Password lookups read straight from the environment - see
# ansible/sentinel/README.md. Absent on a fresh clone, which is harmless
# until you run the sentinel playbook.
_.file = ["{{config_root}}/.secrets.env"]
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[tools]
"python" = "3.14.10"
"uv" = "latest"
"pipx:makejinja" = "2.9.1"
"pipx:ansible-core" = "2.21.5"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cli/cli" = "2.103.2"
"aqua:cloudflare/cloudflared" = "2026.10.3"
"aqua:cue-lang/cue" = "0.17.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.54.0"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.33.1"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:mitsuhiko/minijinja" = "3.0.3"
"aqua:siderolabs/talos" = "1.14.4"
"aqua:yannh/kubeconform" = "0.8.0"
